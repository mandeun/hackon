<!doctype html>
<!-- ┌─ 편집 구역 ────────────────────────────────────────────────┐
     │ AGENT-EDIT : 화면 마크업 · CSS · 렌더 함수 · 예시 데이터    │
     │ ASK-FIRST  : api() 와 LIVE 분기 — 승인 없이 지우지 않는다   │
     └───────────────────────────────────────────────────────────┘
     라켓온과 같은 규칙. 파일을 통째로 새로 짜면 서버 호출이 소리 없이 사라진다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151A34">
<link rel="manifest" href="/manifest.webmanifest">
<title>HACK:ON — 누구나 5분 만에 대회를 연다</title>
<style>
:root{
  --navy:#1E2A5E; --navy-d:#16204A; --navy-l:#F3F5FB;
  --acc:#E8552D;   /* 콜론의 켜진 점. 브랜드 강조색 */
  --ok:#1F6F5C; --ok-l:#EAF5F1; --warn:#A8631B; --warn-l:#FDF4E5; --bad:#9B2C2C;
  --ink:#1A1E1D; --ink2:#4A5250; --ink3:#828986; --rule:#E4E7E9; --bg:#fff; --bg2:#F7F9FA;
  --kr:'Pretendard','Apple SD Gothic Neo','맑은 고딕','Malgun Gothic',sans-serif; --r:12px;
  --paper:#FAFAF8;   /* 순백은 눈이 아프다. 종이에 가깝게 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--kr);background:#E7E9E6;color:var(--ink);font-size:15px;
     display:flex;justify-content:center;min-height:100vh;
     -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
input,select,textarea{border:1px solid var(--rule);border-radius:9px;padding:9px 11px;width:100%;background:#fff}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#app{width:100%;max-width:460px;background:var(--paper);min-height:100vh;
     box-shadow:0 8px 40px rgba(20,30,60,.10);display:flex;flex-direction:column}

header{padding:14px 16px 0;border-bottom:1px solid var(--rule);flex:none;background:var(--paper)}
.hrow{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.logo{color:var(--navy);display:flex;background:none;padding:0;border-radius:6px;
      transition:opacity .15s}
.logo:hover{opacity:.55}
.logo:active{opacity:.35}
.logo svg{height:19px;display:block}
.chip{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--bg2);color:var(--ink3)}
.chip.live{background:var(--ok-l);color:var(--ok);font-weight:700}

main{flex:1;overflow:auto;padding:20px 16px 24px}
/* 화면마다 큰 한 문장. 레퍼런스들이 전부 이걸로 시작한다. */
h2{font-size:23px;margin:0 0 6px;letter-spacing:-.035em;line-height:1.25;font-weight:800}
.sub{color:var(--ink2);font-size:13px;margin-bottom:18px;line-height:1.7}
.card{border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:10px;
      background:var(--bg)}
.card h3{font-size:15px;margin-bottom:3px;letter-spacing:-.02em}
.meta{font-size:12.5px;color:var(--ink3);line-height:1.7}
/* 나란한 숫자. 60fps 가 항목 옆에 작은 수를 위로 올려 붙인다 */
.sup{font-size:10px;vertical-align:super;color:var(--ink3);margin-left:2px;font-weight:700}
/* 안내는 화면 위에 겹쳐 띄운다. 화면을 다시 그리면 사용자가 쓰던 칸이 날아간다. */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:9;
       max-width:420px;width:calc(100% - 32px);pointer-events:none}
#toast div{border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;
           box-shadow:0 6px 20px rgba(20,30,60,.16)}
/* 접어 둔다. 지금 안 쓰는 것을 다 펼쳐 놓으면 아무것도 안 보이는 것과 같다.
   브라우저가 원래 해 주는 것이라 자바스크립트가 필요 없다. */
details{border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);margin-bottom:10px}
details>summary{padding:13px 14px;font-weight:700;font-size:14.5px;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:7px;letter-spacing:-.02em}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'＋';margin-left:auto;color:var(--ink3);font-weight:400;font-size:15px}
details[open]>summary::after{content:'－'}
details>summary:hover{color:var(--navy)}
details .in{padding:0 14px 14px}
details .in>.card{border:0;padding:0;margin:0;background:none}
.when{font-size:11px;color:var(--ink3);font-weight:600;margin-left:2px}

/* 행사장 큰 화면. 여기만 검은 바탕이고 글씨가 크다.
   멀리서 보이는 것이 전부라 다른 화면의 규칙을 따르지 않는다. */
body.tv{background:#0B0E1A;display:block}
body.tv #app{max-width:none;background:#0B0E1A;box-shadow:none;color:#fff;
             height:100vh;min-height:0}
body.tv header,body.tv nav,body.tv #toast{display:none}
/* main 에 height 를 또 주면 #app 이 100vh 보다 커져서 아래가 빈다. flex 로만 채운다. */
body.tv main{padding:3.2vh 3vw;overflow:hidden;flex:1;min-height:0;
             display:flex;flex-direction:column}
.tvwrap{display:flex;flex-direction:column;height:100%;gap:2.4vh}
.tvtop{display:flex;align-items:baseline;gap:1.4vw}
.tvtitle{font-size:3.4vh;font-weight:800;letter-spacing:-.03em}
.tvhost{font-size:1.9vh;color:#8E97B5}
.tvmid{display:flex;gap:2.4vw;flex:1;min-height:0}
.tvbig{flex:1.15;display:flex;flex-direction:column;justify-content:center}
.tvlabel{font-size:2vh;color:#8E97B5;letter-spacing:.02em;margin-bottom:.6vh}
.tvclock{font-size:15vh;font-weight:800;line-height:.95;letter-spacing:-.05em;
         font-variant-numeric:tabular-nums}
.tvclock.hot{color:#FF7A4D}
.tvclock.over{color:#FF5A5A}
.tvside{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.tvnow{background:#161B33;border-radius:1.4vh;padding:2vh 2vw}
.tvnow b{display:block;font-size:4.2vh;font-weight:800;line-height:1.15;letter-spacing:-.03em}
.tvnext{font-size:2vh;color:#8E97B5;margin-top:.8vh}
.tvsub{font-size:2.6vh;line-height:1.5;color:#C7CDE4}
.tvsub em{font-style:normal;color:#fff;font-weight:800}
.tvbot{display:flex;align-items:center;gap:2vw;border-top:1px solid #232945;padding-top:2vh}
.tvaddr{font-family:Consolas,monospace;font-size:3.4vh;font-weight:700;letter-spacing:-.02em}
.tvaddr span{display:block;font-size:1.7vh;color:#8E97B5;font-family:var(--kr);
             font-weight:600;letter-spacing:0}
.tvrank{margin-left:auto;display:flex;gap:1.6vw}
.tvrank div{text-align:right}
.tvrank b{display:block;font-size:2.8vh;font-weight:800}
.tvrank span{font-size:1.6vh;color:#8E97B5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.btn{background:var(--navy);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;
     width:100%;text-align:center;transition:opacity .12s}
.btn:hover{opacity:.88}
.btn:active{opacity:.75}
.btn.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:7px 11px;font-size:13px;width:auto;border-radius:8px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--navy-l);color:var(--navy);font-weight:700}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.stat{display:flex;gap:8px;margin:12px 0}
.stat div{flex:1;border:1px solid var(--rule);border-radius:10px;padding:9px 10px;background:var(--bg2)}
.stat b{display:block;font-size:22px;color:var(--navy);line-height:1.15;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:left}
th{color:var(--ink3);font-weight:700;font-size:12px}
td.n,th.n{text-align:right}
.err{background:#FCF1F1;color:var(--bad);border:1px solid #F0D6D6;border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.ok-msg{background:var(--ok-l);color:var(--ok);border:1px solid #CDE6DD;border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:13px}
nav{display:flex;border-top:1px solid var(--rule);flex:none;background:var(--bg)}
nav button{flex:1;padding:11px 0 13px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .12s}
nav button.on{color:var(--navy);font-weight:700}
nav .i{font-size:17px}
.share{font-family:Consolas,monospace;font-size:12px;background:var(--bg2);border:1px solid var(--rule);
       border-radius:8px;padding:8px 10px;word-break:break-all;margin-top:8px}
.due{font-size:13px;font-weight:700;color:var(--ink2);background:var(--bg2);
     border:1px solid var(--rule);border-radius:9px;padding:8px 11px;margin-bottom:10px}
.due.hot{color:var(--acc);border-color:#F6CFC2;background:#FDF3EF}
.due.over{color:var(--bad);border-color:#F0D6D6;background:#FCF1F1}
.late{color:var(--bad);font-weight:700}
.agree{border:1px solid var(--rule);border-radius:9px;padding:11px;background:var(--bg2);margin-top:12px}
.agree .meta{line-height:1.6}
.ck{display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:13px;font-weight:600}
.ck input{width:16px;height:16px;flex:none;margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--navy)}
.rv{border-left:3px solid var(--rule);padding:2px 0 2px 10px;margin:8px 0}
.shrow{display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.shrow .share{flex:1;margin-top:0}
@media print{
  body{background:#fff}
  #app{max-width:none;box-shadow:none;min-height:0}
  header,nav,.noprint{display:none!important}
  main{overflow:visible;padding:0}
  .card,table{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <button class="logo" id="b-home" title="처음으로" aria-label="처음 화면으로">
        <svg viewBox="0 0 316 64" role="img" aria-label="HACK:ON">
        <g fill="currentColor" font-family="Segoe UI,Pretendard,sans-serif"
           font-size="44" font-weight="800" letter-spacing="-1.5">
          <text x="0" y="46">HACK</text><text x="160" y="46">ON</text></g>
        <circle cx="136" cy="25" r="6.5" fill="none" stroke="currentColor" stroke-width="3.2" opacity=".45"/>
        <circle cx="136" cy="42" r="6.5" fill="var(--acc)"/>
      </svg></button>
      <span class="chip" id="mode">데모</span>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast"></div>
  <nav>
    <button data-t="home" class="on"><span class="i">◎</span>대회</button>
    <button data-t="make"><span class="i">＋</span>열기</button>
    <button data-t="board"><span class="i">▤</span>순위</button>
    <button data-t="spon"><span class="i">◆</span>협찬 성과</button>
  </nav>
</div>

<script>
/* ═══════ ASK-FIRST : 서버 연결부 ═══════
   라켓온과 같은 두 갈래. file:// 로 열면 데모 데이터, http:// 면 진짜 서버. */
const LIVE = location.protocol.startsWith('http');
const okeyOf = id => localStorage.getItem('hackon.okey.' + id) || '';
async function api(path, opt) {
  const r = await fetch('/api' + path, {
    method: opt?.method || 'GET',
    headers: { 'content-type': 'application/json',
               ...(cur && okeyOf(cur) ? { 'x-okey': okeyOf(cur) } : {}) },
    body: opt?.body ? JSON.stringify(opt.body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '서버 오류');
  return d;
}
/* ═══════ ASK-FIRST 끝 ═══════ */

/* 데모 데이터 — 서버 없이 화면을 확인할 때만 쓴다 */
const DEMO = {
  events: [{ id: 'demo01', title: '우리 동네 문제 해결 해커톤', host: '유재원',
             starts: '2026-10-11', ends: '2026-10-12', prize: 3000000 }],
  event: { id: 'demo01', title: '우리 동네 문제 해결 해커톤', host: '유재원', topic: '생활 불편',
           starts: '2026-10-11', ends: '2026-10-12', prize: 3000000, cap: 20, teams: 3,
           rubric: [{key:'idea',label:'독창성',weight:30},{key:'make',label:'완성도',weight:30},
                    {key:'use',label:'실용성',weight:25},{key:'tell',label:'전달력',weight:15}],
           sponsors: [{ name: '오픈에이아이', kind: '크레딧', amount: 2000000 },
                      { name: '동네카페', kind: '상품', amount: 300000 }] },
  board: [{ rank:1, name:'가나다팀', score:82.5, judges:2, done:true },
          { rank:2, name:'하나팀', score:71.0, judges:2, done:true },
          { rank:3, name:'셋팀', score:0, judges:0, done:false }],
  outcomes: { teams:3, finished:2, finishRate:66.7, interview:2, adoption:1, hired:0, followup:1, list:[] },
};

let tab = 'home', cur = localStorage.getItem('hackon.event') || '', curTeam = '';
/* 참가자 폰은 localhost 로 못 온다. 서버가 알려 준 랜 주소로 공유 링크를 만든다. */
let NET = null;
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const won = n => (+n || 0).toLocaleString('ko-KR') + '원';

/* 대회 상태는 날짜에서 바로 나온다. 서버에 칸을 하나 더 두지 않는다. */
function statusOf(e) {
  const t = new Date().toISOString().slice(0, 10);
  if (t < e.starts) return { k: '모집중', c: 'ok' };
  if (t > e.ends) return { k: '끝남', c: '' };
  return { k: '진행 중', c: 'warn' };
}
const badge = e => { const s = statusOf(e); return `<span class="pill ${s.c}">${s.k}</span>`; };

/* 마감까지 남은 시간. 1시간을 끊으면 색이 바뀐다. */
function dueText(due) {
  const ms = new Date(due) - new Date();
  if (ms <= 0) return { t: '제출 마감이 지났습니다', c: 'over' };
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  return { t: '제출 마감까지 ' + (h ? h + '시간 ' + (m % 60) + '분' : m + '분'),
           c: ms < 3600000 ? 'hot' : '' };
}
/* 화면 전체를 다시 그리지 않고 그 칸의 글자만 갈아 끼운다. */
function tickDue() {
  document.querySelectorAll('[data-due]').forEach(el => {
    if (!el.dataset.due) return;
    const r = dueText(el.dataset.due);
    if (el.classList.contains('tvclock')) {
      /* 큰 화면에서는 '제출 마감까지' 를 위에 따로 적어 두었으니 숫자만 남긴다. */
      el.textContent = r.t.replace('제출 마감까지 ', '').replace('제출 마감이 지났습니다', '마감');
      el.className = 'tvclock ' + r.c;
    } else {
      el.textContent = r.t; el.className = 'due ' + r.c;
    }
  });
}
setInterval(tickDue, 1000);
const dueBox = e => e.due ? `<div class="due" data-due="${esc(e.due)}"></div>` : '';

/* 참가 신청 칸. 운영 화면과 공개 화면이 같은 것을 쓴다 — 두 벌로 두면 한쪽만 고치게 된다.
   '어디서 보셨나' 가 이 폼의 핵심이다. 2회차 홍보를 어디에 할지 이 한 칸이 정한다. */
/* 대회 규칙. 참가자가 가장 크게 데는 곳이 결과물 권리다.
   해외에서 주최사가 결과물 권리를 통째로 가져가는 조항을 넣었다가 사과한 일이 있었다.
   기본값을 참가자 쪽에 두고 그것을 눈에 보이게 적는다. */
function rulesBox() {
  return `<div class="card"><h3>규칙</h3><div class="meta">
    <b>만든 것은 팀의 것입니다.</b> 주최 측은 결과물의 권리를 가져가지 않습니다.
    홍보에 쓸 때도 먼저 물어봅니다.<br>
    생성형 AI 를 써도 됩니다. 무엇을 썼는지만 적어 주세요.<br>
    중간에 떨어뜨리는 라운드가 없습니다. 모든 팀이 같은 시간을 씁니다.<br>
    심사 기준은 시작 전에 공개하고, 시작한 뒤에는 바꾸지 않습니다.<br>
    멘토의 조언은 참고 사항입니다. 무엇을 만들지는 팀이 정합니다.<br>
    행동강령은 참가자·멘토·스태프·심사위원·협찬사 모두에게 똑같이 적용됩니다.
  </div></div>`;
}

const FOUND = ['캠퍼스픽', '위비티', '이벤터스', '학교 커뮤니티', '개발 커뮤니티', '아는 사람', '기타'];
/* 처음에는 두 칸만 받는다. 연락처도 안 묻는다.
   신청하고 나면 그다음에 나머지를 묻는다 — 이미 발을 들인 뒤라 부담이 적다. */
function applyForm() {
  return `<label>팀 이름 <span class="pill">필수</span></label>
    <input id="t-name" placeholder="혼자 오시면 본인 이름을 적으세요">
    <div class="agree">
      <div class="meta"><b>개인정보 수집·이용 안내</b><br>
        수집 항목 · 이름(팀 이름) · 연락처 · 참가 정보<br>
        이용 목적 · 대회 운영 · 참가 확인 · 결과 안내 · 상금 지급<br>
        보유 기간 · 대회 종료 후 <b>6개월</b>. 그 뒤 지웁니다<br>
        동의하지 않으시면 참가 신청을 받을 수 없습니다.</div>
      <label class="ck"><input type="checkbox" id="t-agree">
        <span>개인정보 수집·이용에 동의합니다 <span class="pill">필수</span></span></label>
    </div>
    <div style="height:10px"></div>
    <button class="btn sm" id="t-join">참가 신청</button>
    <div class="meta" style="margin-top:8px">지금은 이름만 받습니다.
      연락처와 나머지는 신청한 뒤에 여쭙겠습니다.</div>`;
}

   예전에는 안내가 사라질 때도 다시 그렸는데, 그 사이에 사용자가 쓰던 칸이 통째로 날아갔다. */
let toastTimer = null;
function flash(text, bad) {
  const box = $('#toast');
  box.innerHTML = `<div class="${bad ? 'err' : 'ok-msg'}" style="margin:0">${esc(text)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.innerHTML = ''; }, 2800);
  render();
}
function head() { return ''; }

/** 공유에 쓸 바깥 주소. 운영자가 localhost 로 보고 있어도 참가자용은 랜 주소로 준다. */
function shareBase() {
  if (!LIVE) return 'http://localhost:8788';
  const h = location.hostname;
  if (h !== 'localhost' && h !== '127.0.0.1') return location.origin;   // 이미 랜 주소로 보고 있다
  if (NET && NET.net && NET.net.length) return `http://${NET.net[0]}:${NET.port}`;
  return location.origin;
}

async function render() {
  if (LIVE && !NET) { try { NET = await api('/health'); } catch { NET = { net: [] }; } }
  $('#mode').textContent = LIVE ? '서버 연결됨' : '데모';
  $('#mode').className = 'chip' + (LIVE ? ' live' : '');
  // 팀 화면은 순위에서 들어가는 곳이라 아래 탭은 '순위'를 켜 둔다
  const navOn = tab === 'team' ? 'board' : tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === navOn));
  // innerHTML 을 쓰되 서버에서 온 값은 전부 esc() 를 거친다. 화면 조립이 문자열 한 곳에
  // 모여 있어야 라켓온처럼 "서버 호출이 사라졌는지"를 검사로 셀 수 있다.
  try { view.innerHTML = head() + await SCREEN[tab](); }
  catch (e) { view.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  wire();
  tickDue();
  document.body.dataset.ready = '1';   // 완주 테스트가 이 표시를 기다린다
}

        ${e.topic ? '· 주제 ' + esc(e.topic) : ''}<br>상금 ${won(e.prize)} · 참가 ${e.teams}팀</p>
      ${dueBox(e)}

      ${e.sponsors.length ? `<div class="card"><h3>함께한 곳</h3>
        <div class="meta">${e.sponsors.map(s => esc(s.name) + ' <span class="pill">' + esc(s.kind) + '</span>').join(' · ')}</div>
      </div>` : ''}

      <div class="stat">
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
        <div><b>${o.interview}</b><span>면접 연결</span></div>
        <div><b>${o.adoption}</b><span>도입 검토</span></div>
      </div>

      <h3 style="margin-top:16px">순위</h3>
      <table><tr><th>순위</th><th>팀</th><th class="n">점수</th></tr>
      ${d.rows.map(r => `<tr><td>${r.rank}</td><td>${esc(r.name)}</td>
        <td class="n">${r.score}</td></tr>`).join('')}</table>

      ${sup.rows.length ? `<h3 style="margin-top:16px">끝난 뒤에도 봐 드립니다</h3>

        <table><tr><th>팀</th><th>봐 줄 사람</th><th>언제까지</th></tr>

      ${done.length ? `<h3 style="margin-top:16px">제출작</h3>
        ${done.map(r => `<div class="card"><h3>${esc(r.name)}</h3>

          ${r.url ? `<div class="share">${esc(r.url)}</div>` : ''}</div>`).join('')}
        ` : ''}

      ${(e.plan || []).length ? `<div class="card"><h3>진행 순서</h3>
        <table>${e.plan.map(r => `<tr><td style="width:5.5em">${esc(r.at)}</td>
          <td>${esc(r.what)}</td></tr>`).join('')}</table></div>` : ''}

      ${rulesBox()}

      ${statusOf(e).k !== '끝남'
        ? (mine
            ? moreForm(mine)
            : `<div class="card"><h3>참가 신청</h3>
                 <div class="meta">이 페이지에서 바로 신청합니다. 이름만 있으면 됩니다.</div>
                 ${applyForm()}</div>`)
        : ''}

      <p class="sub" style="margin-top:14px">심사 기준 ·
        ${e.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}</p>`;
  },

  /* 행사장 큰 화면 — /tv/<대회id>. 노트북을 HDMI 로 꽂아 두는 용도다.
     참가자가 제일 자주 묻는 것 세 개(언제까지·지금 뭐 하는 시간·주소)를 종일 띄워 둔다. */
  async tv() {
    const d = await api(`/events/${cur}/tv`);
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    /* 지금 지난 것 중 마지막이 '지금', 그다음이 '다음'. 시각만 비교하면 된다. */
    const plan = d.plan || [];
    let at = -1;
    plan.forEach((r, i) => { if (r.at <= hhmm) at = i; });
    const cur1 = plan[at], nxt = plan[at + 1];

    return `<div class="tvwrap">
      <div class="tvtop">
        <div class="tvtitle">${esc(d.title)}</div>
        <div class="tvhost">${esc(d.host)}</div>
      </div>

      <div class="tvmid">
        <div class="tvbig">
          ${d.due
            ? `<div class="tvlabel">제출 마감까지</div>
               <div class="tvclock" data-due="${esc(d.due)}"></div>`
            : `<div class="tvlabel">오늘</div>
               <div class="tvclock" style="font-size:9vh">${esc(d.starts)}</div>`}
          <div class="tvsub" style="margin-top:2.4vh">
            제출 <em>${d.done}</em> / ${d.teams}팀
            ${d.waiting.length && d.waiting.length <= 6
              ? `<br><span style="font-size:2.1vh;color:#8E97B5">아직 —
                 ${d.waiting.map(esc).join(' · ')}</span>` : ''}
          </div>
        </div>

        <div class="tvside">
          <div class="tvnow">
            <div class="tvlabel">지금</div>
            <b>${cur1 ? esc(cur1.what) : '시작 전'}</b>
            ${nxt ? `<div class="tvnext">다음 · ${esc(nxt.at)} ${esc(nxt.what)}</div>` : ''}
          </div>
          ${d.ranks.length ? `<div class="tvnow" style="flex:1">
            <div class="tvlabel">순위</div>
            ${d.ranks.map(r => `<div class="tvsub" style="display:flex;gap:1vw">
              <em style="width:2ch">${r.rank}</em>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
              <em>${r.score}</em></div>`).join('')}
          </div>` : ''}
        </div>
      </div>

      <div class="tvbot">
        <div class="tvaddr">${esc(shareBase().replace(/^https?:\/\//, ''))}/e/${esc(cur)}
          <span>여기서 신청하고 제출합니다</span></div>
        <div class="tvrank">
          <div><b>${d.teams}</b><span>참가 팀</span></div>
          <div><b>${d.done}</b><span>제출</span></div>
        </div>
      </div>
    </div>`;
  },

  /* 심사위원 화면 — /j/<대회id> 로 연다. 점수만 넣는다.
     남의 점수와 순위는 서버가 아예 안 준다. 심사 중에 순위를 보면 점수가 끌려간다. */
  async judge() {
    const who = localStorage.getItem('hackon.judge') || '';
    if (!who) {
      const e = await api(`/events/${cur}/judge`);
      return `<h2>${esc(e.event.title)}</h2>
        <p class="sub">심사위원 화면입니다. 이름을 넣으면 시작합니다.<br>
          같은 이름으로 다시 들어오면 넣던 점수를 이어서 고칠 수 있습니다.</p>
        <label>심사위원 이름</label><input id="jn" placeholder="이름">
        <div style="height:10px"></div>
        <button class="btn" id="jn-go">시작</button>`;
    }
    const d = await api(`/events/${cur}/judge?judge=${encodeURIComponent(who)}`);
    return `<h2>${esc(d.event.title)}</h2>
      <p class="sub">${esc(who)} 님 · 아직 안 본 팀 <b>${d.left}팀</b> / ${d.teams.length}팀
        <button class="btn sec sm" id="jn-out" style="margin-left:6px">이름 바꾸기</button></p>
      ${dueBox(d.event)}
      <div class="card" style="padding:11px 13px"><div class="meta">
        심사 기준 · ${d.event.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}<br>
        시작한 뒤에는 기준이 바뀌지 않습니다. 다른 분 점수와 순위는 보이지 않습니다.<br>
        <b>한 줄이라도 심사평을 남겨 주세요.</b> 참가자가 가장 아쉬워하는 것이
        “왜 떨어졌는지 모른다” 입니다. 이름 없이 전달됩니다.
      </div></div>

      ${d.teams.map(t => `<div class="card">
        <h3>${esc(t.name)} ${t.doneByMe ? '<span class="pill ok">냈음</span>'
                                        : '<span class="pill warn">아직</span>'}</h3>
        ${t.note ? `<div class="meta">${esc(t.note)}</div>` : ''}
        ${t.url ? `<div class="share">${esc(t.url)}</div>`
                : '<div class="meta">아직 제출하지 않았습니다.</div>'}
        ${d.event.rubric.map(r => `
          <label>${esc(r.label)} <span class="pill">${r.weight}%</span></label>
          <input class="jv-${esc(t.id)}" data-key="${esc(r.key)}" type="number" min="0" max="100"
                 value="${t.mine[r.key] ?? 70}">`).join('')}
        <label>좋았던 점 <span class="pill ok">참가팀에게 전달됩니다</span></label>
        <textarea class="jg-${esc(t.id)}" rows="2"
          placeholder="한 줄이면 됩니다">${esc(t.review.good)}</textarea>
        <label>더 하면 좋을 것</label>
        <textarea class="jn2-${esc(t.id)}" rows="2"
          placeholder="한 줄이면 됩니다">${esc(t.review.next)}</textarea>
        <div style="height:10px"></div>
        <button class="btn sm" data-jsave="${esc(t.id)}">${t.doneByMe ? '점수 고치기' : '점수 저장'}</button>
      </div>`).join('')}`;
  },

  /* 결과 보고서 — 협찬사에게 보내는 물건. 인쇄하면 그대로 PDF 가 된다.
     빈칸이 생기지 않게 앞의 세 기능(마감·신청·사후지원)을 먼저 만들었다. */
  async report() {
    const d = await api(`/events/${cur}/board`);
    const o = await api(`/events/${cur}/outcomes`);
    const sup = await api(`/events/${cur}/support`);
    /* 심사 눈높이는 운영자 것이라 손님에게는 403 이 온다. 보고서는 나눠 주는 물건이라
       없는 부분은 빼고 그린다. 여기서 안 잡으면 보고서 전체가 안 뜬다. */
    let sp = { rows: [], gap: 0 };
    try { sp = await api(`/events/${cur}/spread`); } catch {}
    const e = d.event;
    const done = d.rows.filter(r => r.done);
    const money = e.sponsors.reduce((a, s) => a + (+s.amount || 0), 0);
    return `<div class="noprint" style="margin-bottom:14px">
        <button class="btn sm" id="b-print">인쇄 · PDF 로 저장</button>
        <div class="meta" style="margin-top:6px">이 주소를 그대로 보내셔도 됩니다.</div>
      </div>

      <h2>${esc(e.title)} 결과 보고서</h2>
      <p class="sub">${esc(e.host)} 주최 · ${esc(e.starts)}~${esc(e.ends)}
        ${e.topic ? '· 주제 ' + esc(e.topic) : ''}</p>

      <h3>하나. 무엇을 했나</h3>
      <div class="stat">
        <div><b>${e.teams}</b><span>참가 팀</span></div>
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
        <div><b>${sup.people.length}</b><span>봐 준 사람</span></div>
      </div>
      <p class="sub">참가 ${e.teams}팀 중 ${o.finished}팀이 끝까지 결과물을 냈습니다.
        ${o.solo ? `혼자 오신 분이 ${o.solo}명이었고 현장에서 팀을 짰습니다.` : ''}</p>

      ${(o.found || []).length ? `<h3>둘. 어디서 왔나</h3>
        <table><tr><th>경로</th><th class="n">신청</th></tr>
        ${o.found.map(f => `<tr><td>${esc(f.k)}</td><td class="n">${f.c}팀</td></tr>`).join('')}</table>
        <p class="sub">다음 회차 홍보는 위쪽 경로에 집중합니다.</p>` : ''}

      <h3>셋. 협찬해 주신 곳</h3>
      ${e.sponsors.length
        ? `<table><tr><th>회사</th><th>무엇을</th><th class="n">규모</th></tr>
           ${e.sponsors.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.kind)}</td>
             <td class="n">${s.amount ? won(s.amount) : '—'}</td></tr>`).join('')}</table>
           ${money ? `<p class="sub">합계 ${won(money)} 상당.</p>` : ''}`
        : '<p class="sub">이번 회차는 협찬 없이 진행했습니다.</p>'}

      <h3>넷. 돌려드리는 숫자</h3>
      <p class="sub">‘몇 명이 봤다’를 쓰지 않습니다. 아래 넷으로 정산합니다.</p>
      <table>
        <tr><th>항목</th><th class="n">건수</th></tr>
        <tr><td>완주 (끝까지 결과물을 낸 팀)</td><td class="n">${o.finished}/${o.teams}</td></tr>
        <tr><td>면접 연결</td><td class="n">${o.interview}</td></tr>
        <tr><td>도입 검토</td><td class="n">${o.adoption}</td></tr>
        <tr><td>채용</td><td class="n">${o.hired}</td></tr>
      </table>

      <h3>다섯. 끝난 뒤에 한 일</h3>
      ${sup.rows.length
        ? `<p class="sub">약속 ${sup.promised}건 중 ${sup.done}건을 지켰습니다.${
             sup.late ? ` <span class="late">${sup.late}건이 기한을 넘겼습니다.</span>` : ''}</p>
           <table><tr><th>팀</th><th>봐 준 사람</th><th>기한</th><th></th></tr>
           ${sup.rows.map(r => `<tr><td>${esc(r.team_name)}</td>
             <td>${esc(r.helper_name)}${r.org ? ' · ' + esc(r.org) : ''}</td>
             <td>${esc(r.due)}</td>
             <td>${r.done ? '<span class="pill ok">완료</span>'
                          : `<span class="pill ${r.late ? 'warn' : ''}">${r.late ? '늦음' : '진행'}</span>`}</td>
           </tr>`).join('')}</table>`
        : '<p class="sub">이번 회차는 사후 지원을 배정하지 않았습니다.</p>'}

      <h3>여섯. 결과물</h3>
      ${done.length
        ? done.map(r => `<div class="card"><h3>${r.rank}위 · ${esc(r.name)}</h3>
            ${r.note ? `<div class="meta">${esc(r.note)}</div>` : ''}
            ${r.url ? `<div class="share">${esc(r.url)}</div>` : ''}</div>`).join('')
        : '<p class="sub">제출작이 없습니다.</p>'}
      <p class="sub">심사 기준 · ${e.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}
        · 심사위원 ${(d.judges || []).length}명
        ${sp.rows.length > 1
          ? `<br>심사위원 사이 평균 차이 ${sp.gap}점${sp.warn ? '' : ' — 눈높이가 맞았습니다'}.`
          : ''}</p>

      <h3>일곱. 다음 회차</h3>
      <p class="sub">이번 숫자를 그대로 다음 제안서의 첫 줄로 씁니다.
        완주율 ${o.finishRate}% · 면접 ${o.interview}건 · 도입 검토 ${o.adoption}건.
        같은 조건으로 한 번 더 하실 의향이 있으시면 알려 주십시오.</p>
      <p class="meta">${esc(e.title)} · 작성 ${new Date().toISOString().slice(0, 10)}</p>`;
  },

  /* 팀 한 곳 — 참가팀은 제출하고, 심사위원은 점수를 넣는다. 같은 화면을 둘이 나눠 쓴다. */
  async team() {
    const d = LIVE ? await api(`/events/${cur}/board`) : { event: DEMO.event, rows: DEMO.board };
    const t = d.rows.find(r => String(r.id) === String(curTeam)) || d.rows[0];
    if (!t) return `<h2>팀이 없습니다</h2>`;
    const cardData = LIVE ? await api(`/teams/${t.id}/card`) : null;
    return `<button class="btn sec sm" data-go="board">← 순위로</button>
      <h2 style="margin-top:12px">${esc(t.name)}</h2>
      <p class="sub">${t.rank}위 · ${t.score}점 · 심사 ${t.judges}명</p>
      ${(d.judges || []).length ? `<div class="meta" style="margin:-8px 0 12px">
        본 사람 ${(t.by || []).map(esc).join(', ') || '없음'}${
          (() => { const no = (d.judges || []).filter(j => !(t.by || []).includes(j));
                   return no.length ? ' · 안 본 사람 ' + no.map(esc).join(', ') : ''; })()}
      </div>` : ''}

      ${dueBox(d.event)}
      <div class="card">
        <h3>결과물 제출</h3>
        <div class="meta">참가팀이 씁니다. 다시 내면 덮어써집니다.</div>
        ${d.event.due && new Date(d.event.due) < new Date()
          ? `<div class="err" style="margin:8px 0 0">마감이 지나 더는 낼 수 없습니다.
             진행자가 마감을 미루면 다시 열립니다.</div>` : ''}
        <label>링크</label><input id="s-url" value="${esc(t.url || '')}" placeholder="https://...">
        <label>설명</label><textarea id="s-note" rows="3" placeholder="무엇을 만들었는지 짧게">${esc(t.note || '')}</textarea>
        <div style="height:10px"></div>
        <button class="btn sm" id="s-save">제출하기</button>
      </div>

      ${LIVE && cardData ? (cardData.opened ? `<div class="card">
        <h3>내 점수</h3>
        <div class="meta">심사위원 ${cardData.judges}명의 평균입니다. 합계 <b>${cardData.total}점</b></div>
        ${cardData.items.map(i => `<div style="margin-top:10px">
          <div class="meta">${esc(i.label)} · 100점 만점에 ${i.avg}점
            <span style="float:right">${i.got} / ${i.weight}점</span></div>
          <div class="bar"><i style="width:${i.avg}%"></i></div>
        </div>`).join('')}
        ${cardData.reviews.length ? `<div style="margin-top:14px"><b style="font-size:13px">심사평</b>
          ${cardData.reviews.map(r => `<div class="rv">
            ${r.good ? `<div class="meta"><b>좋았던 점</b> ${esc(r.good)}</div>` : ''}
            ${r.next ? `<div class="meta"><b>더 하면</b> ${esc(r.next)}</div>` : ''}
          </div>`).join('')}</div>` : ''}
      </div>` : `<div class="card"><div class="meta">
        결과는 아직 공개되지 않았습니다. 공개되면 항목별 점수와 심사평을 여기서 보실 수 있습니다.
      </div></div>`) : ''}

      <div class="card">
        <h3>심사</h3>
        <div class="meta">심사위원이 씁니다. 이름이 같으면 이전 점수를 고칩니다.</div>
        <label>심사위원 이름</label>
        <input id="j-name" value="${esc(localStorage.getItem('hackon.judge') || '')}" placeholder="이름">
        ${d.event.rubric.map(r => `
          <label>${esc(r.label)} <span class="pill">${r.weight}%</span></label>
          <input class="j-v" data-key="${esc(r.key)}" type="number" min="0" max="100" value="70">`).join('')}
        <div style="height:10px"></div>
        <button class="btn sm" id="j-save">점수 저장</button>
      </div>`;
  },

  async spon() {

    const o = LIVE ? await api(`/events/${cur}/outcomes`) : DEMO.outcomes;
    const ev = LIVE ? await api(`/events/${cur}`) : DEMO.event;
    const sup = LIVE ? await api(`/events/${cur}/support`) : { people: [], rows: [] };
    const d = LIVE ? await api(`/events/${cur}/board`) : { rows: DEMO.board };
    return `<h2>협찬사에게 주는 숫자</h2>
      <p class="sub">‘몇 명이 봤다’를 쓰지 않습니다. 아래 넷으로 정산합니다.</p>
      <div class="stat">
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
        <div><b>${o.came ?? 0}/${o.teams}</b><span>온 팀</span></div>
      </div>
      <div class="stat">
        <div><b>${o.interview}</b><span>면접 연결</span></div>
        <div><b>${o.adoption}</b><span>도입 검토</span></div>
        <div><b>${o.hired}</b><span>채용</span></div>
      </div>
      ${(o.found || []).length ? `<div class="card">
        <h3>어디서 왔나</h3>
        <div class="meta">2회차 홍보를 어디에 할지 이 표가 정합니다.
          혼자 온 사람 ${o.solo || 0}명.</div>
        <table><tr><th>경로</th><th class="n">신청</th></tr>
        ${o.found.map(f => `<tr><td>${esc(f.k)}</td><td class="n">${f.c}팀</td></tr>`).join('')}</table>
      </div>` : ''}

<details open><summary>협찬사</summary><div class="in">
        <div class="meta">여기 넣은 곳이 공개 페이지 ‘함께한 곳’에 뜹니다.</div>
        ${ev.sponsors.length
          ? `<div class="meta" style="margin-top:8px">${ev.sponsors.map(s =>
              esc(s.name) + ' <span class="pill">' + esc(s.kind) + '</span>').join(' · ')}</div>`
          : `<div class="meta" style="margin-top:8px">아직 없습니다.</div>`}
        <label>회사 이름</label><input id="p-name" placeholder="예) 오픈에이아이">
        <div class="row">
          <div><label>무엇을 받았나</label>
            <select id="p-kind"><option>크레딧</option><option>상품</option><option>멘토</option><option>현금</option></select></div>
          <div><label>금액(원)</label><input id="p-amt" type="number" value="0"></div>
        </div>
        <div style="height:10px"></div>
        <button class="btn sm" id="p-add">협찬사 추가</button>
      </div></details>

      ${LIVE ? `<details><summary>사후 지원 <span class="when">행사 전에 정해 둔다</span></summary>
        <div class="in">
        <div class="meta">끝나고 팀을 봐 줄 사람을 <b>행사 전에</b> 정해 둡니다.
          끝나고 정하면 아무도 안 합니다.</div>
        ${sup.rows.length ? `<div class="stat" style="margin:10px 0">
            <div><b>${sup.promised}</b><span>약속</span></div>
            <div><b>${sup.done}</b><span>지킴</span></div>
            <div><b class="${sup.late ? 'late' : ''}">${sup.late}</b><span>늦음</span></div>
          </div>
          <table><tr><th>팀</th><th>봐 줄 사람</th><th>언제까지</th><th></th></tr>
          ${sup.rows.map(r => `<tr>
            <td>${esc(r.team_name)}</td>
            <td>${esc(r.helper_name)}${r.org ? ' <span class="meta">' + esc(r.org) + '</span>' : ''}</td>
            <td class="${r.late ? 'late' : ''}">${esc(r.due)}${r.late ? ' 늦음' : ''}</td>
            <td>${r.done
              ? '<span class="pill ok">완료</span>'
              : `<button class="btn sec sm" data-done="${r.id}">했음</button>`}</td>
          </tr>`).join('')}</table>` : '<div class="meta" style="margin-top:8px">아직 없습니다.</div>'}

        <label>봐 줄 사람 추가</label>
        <div class="row">
          <div><input id="h-name" placeholder="이름"></div>
          <div><input id="h-org" placeholder="소속 (선택)"></div>
        </div>
        <input id="h-can" placeholder="무엇을 도와줄 수 있나" style="margin-top:8px">
        <div style="height:8px"></div>
        <button class="btn sec sm" id="h-add">지원자 추가</button>

        ${sup.people.length && d.rows.length ? `
          <label style="margin-top:14px">팀에 짝지어 주기</label>
          <div class="row">
            <div><select id="a-team">${d.rows.map(r =>
              `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>
            <div><select id="a-help">${sup.people.map(h =>
              `<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div>
          </div>
          <label>언제까지 (비우면 대회 끝나고 14일)</label>
          <input id="a-due" type="date">
          <div style="height:8px"></div>
          <button class="btn sm" id="a-add">짝지어 주기</button>` : ''}
      </div></details>` : ''}

<details open><summary>성과 기록하기</summary><div class="in">
        <div class="meta">행사 뒤 2주 동안 여기에 쌓습니다. 이게 다음 해 제안서의 근거가 됩니다.</div>
        <label>무엇</label>
        <select id="o-kind"><option>면접</option><option>도입검토</option><option>채용</option><option>후속미팅</option></select>
        <label>어느 회사</label><input id="o-who" placeholder="회사 이름">
        <div style="height:10px"></div>
        <button class="btn sm" id="o-add">기록 추가</button>
      </div></details>`;
  },
};

function wire() {
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    cur = el.dataset.open; localStorage.setItem('hackon.event', cur); tab = 'board'; render();
  });
  const go = $('[data-go]'); if (go) go.onclick = () => { tab = go.dataset.go; render(); };

  const plg = $('#pl-go');
  if (plg) plg.onclick = async () => {
    const t = $('#pl-t').value, m = $('#pl-m').value;
    const r = LIVE ? await api(`/plan?teams=${t}&minutes=${m}`) : null;
    if (!r) return flash('데모에서는 안 됩니다', true);
    $('#pl-out').innerHTML = `심사위원 <b>${r.need}명</b>이 필요합니다.
      한 분이 ${r.perJudge}팀을 봅니다.` +
      (r.tight ? ` <span class="late">한 분이 너무 많이 봅니다.
        뒤로 갈수록 점수가 흐려집니다. 사람을 더 부르거나 시간을 늘리세요.</span>`
               : ' 무리 없는 양입니다.');
  };

  const msave = $('#m-save');
  if (msave) msave.onclick = async () => {
    const id = localStorage.getItem('hackon.team.' + cur);
    if (!id) return flash('신청 기록이 없습니다', true);
    const g = sel => { const el = $(sel); return el ? el.value : undefined; };
    try {
      const r = await api(`/teams/${id}/more`, { method: 'POST', body: {
        contact: g('#m-contact'), role: g('#m-role'), found: g('#m-found'), note: g('#m-note'),
        solo: $('#m-solo') ? !!$('#m-solo').value : undefined,
        photo: $('#m-photo') ? $('#m-photo').checked : undefined } });
      flash(r.filled ? '고맙습니다. 저장했습니다' : '이미 다 주셨습니다');
    } catch (e) { flash(e.message, true); }
  };

  const esave = $('#e-save');
  if (esave) esave.onclick = async () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    try {
      const plan = $('#e-plan').value.split('\n')
        .map(l => l.trim()).filter(Boolean)
        .map(l => { const i = l.indexOf(' ');
                    return i < 0 ? { at: l, what: '' }
                                 : { at: l.slice(0, i), what: l.slice(i + 1) }; });
      await api(`/events/${cur}`, { method: 'PATCH', body: {
        starts: $('#e-starts').value, ends: $('#e-ends').value,
        prize: $('#e-prize').value, cap: $('#e-cap').value,
        topic: $('#e-topic').value, due: $('#e-due').value, plan } });
      flash('채웠습니다');
    } catch (e) { flash(e.message, true); }
  };

  const okgo = $('#ok-go');
  if (okgo) okgo.onclick = async () => {
    const v = $('#ok-in').value.trim();
    if (!v) return flash('열쇠를 넣어 주세요', true);
    localStorage.setItem('hackon.okey.' + cur, v);
    try {
      const e = await api(`/events/${cur}`);
      if (!e.admin) { localStorage.removeItem('hackon.okey.' + cur);
                      return flash('열쇠가 맞지 않습니다', true); }
      flash('열었습니다'); render();
    } catch (e) { flash(e.message, true); }
  };

  const save = $('#f-save');
  if (save) save.onclick = async () => {
    const b = { title: $('#f-title').value.trim() };   // 처음엔 이름만 받는다
    if (!b.title) return flash('대회 이름을 넣어 주세요', true);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다. 서버를 켜고 다시 해 보세요', true);
    try {
      const r = await api('/events', { method: 'POST', body: b });
      cur = r.id;
      localStorage.setItem('hackon.event', cur);
      localStorage.setItem('hackon.okey.' + r.id, r.okey);   // 운영자 열쇠
      tab = 'board';
      flash('대회를 만들었습니다. 링크를 공유하세요');
    } catch (e) { flash(e.message, true); }
  };

  const join = $('#t-join');
  if (join) join.onclick = async () => {
    const name = $('#t-name').value.trim();
    if (!name) return flash('팀 이름을 넣어 주세요', true);
    if (!$('#t-agree').checked) return flash('개인정보 수집·이용에 동의해 주세요', true);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      const r = await api(`/events/${cur}/teams`, { method: 'POST', body: {
        name,
        agree: true } });
      localStorage.setItem('hackon.team.' + cur, r.id);   // 두 번째 칸을 보여 주려고 기억한다
      flash('신청됐습니다. 조금만 더 여쭙겠습니다');
    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-team]').forEach(tr => tr.onclick = () => {
    if (!tr.dataset.team) return flash('데모에서는 팀 화면을 못 엽니다', true);
    curTeam = tr.dataset.team; tab = 'team'; render();
  });

  const ssave = $('#s-save');
  if (ssave) ssave.onclick = async () => {
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/teams/${curTeam}/submit`, { method: 'POST',
        body: { url: $('#s-url').value.trim(), note: $('#s-note').value.trim() } });
      flash('제출했습니다');
    } catch (e) { flash(e.message, true); }
  };

  const jsave = $('#j-save');
  if (jsave) jsave.onclick = async () => {
    const judge = $('#j-name').value.trim();
    if (!judge) return flash('심사위원 이름을 넣어 주세요', true);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    const values = {};
    document.querySelectorAll('.j-v').forEach(i => { values[i.dataset.key] = +i.value; });
    try {
      await api(`/teams/${curTeam}/score`, { method: 'POST', body: { judge, values } });
      localStorage.setItem('hackon.judge', judge);
      flash('점수를 저장했습니다');
    } catch (e) { flash(e.message, true); }
  };

  const hadd = $('#h-add');
  if (hadd) hadd.onclick = async () => {
    const name = $('#h-name').value.trim();
    if (!name) return flash('이름을 넣어 주세요', true);
    try {
      await api(`/events/${cur}/support`, { method: 'POST', body: {
        name, org: $('#h-org').value, can: $('#h-can').value } });
      flash('지원자를 넣었습니다');
    } catch (e) { flash(e.message, true); }
  };

  const aadd = $('#a-add');
  if (aadd) aadd.onclick = async () => {
    try {
      const r = await api(`/events/${cur}/assign`, { method: 'POST', body: {
        team: $('#a-team').value, helper: $('#a-help').value, due: $('#a-due').value } });
      flash(`${r.due} 까지 봐 주기로 했습니다`);
    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-came]').forEach(b => b.onclick = async () => {
    try { const r = await api(`/teams/${b.dataset.came}/checkin`, { method: 'POST', body: {} });
          flash(r.came ? '체크인했습니다' : '체크인을 취소했습니다'); }
    catch (e) { flash(e.message, true); }
  });

  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    try { await api(`/assignments/${b.dataset.done}/done`, { method: 'POST', body: {} });
          flash('완료로 표시했습니다'); }
    catch (e) { flash(e.message, true); }
  });

  const jgo = $('#jn-go');
  if (jgo) jgo.onclick = () => {
    const v = $('#jn').value.trim();
    if (!v) return flash('이름을 넣어 주세요', true);
    localStorage.setItem('hackon.judge', v); render();
  };
  const jout = $('#jn-out');
  if (jout) jout.onclick = () => { localStorage.removeItem('hackon.judge'); render(); };

  document.querySelectorAll('[data-jsave]').forEach(b => b.onclick = async () => {
    const id = b.dataset.jsave, values = {};
    document.querySelectorAll('.jv-' + id).forEach(i => { values[i.dataset.key] = +i.value; });
    const g = document.querySelector('.jg-' + id), nx = document.querySelector('.jn2-' + id);
    try {
      await api(`/teams/${id}/score`, { method: 'POST',
        body: { judge: localStorage.getItem('hackon.judge'), values,
                good: g ? g.value : '', next: nx ? nx.value : '' } });
      flash('저장했습니다');
    } catch (e) { flash(e.message, true); }
  });

  const op = $('#b-open');
  if (op) op.onclick = async () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    try {
      const now = op.textContent.includes('닫기');
      const r = await api(`/events/${cur}/open`, { method: 'POST', body: { open: !now } });
      flash(r.opened ? '결과를 공개했습니다' : '결과 공개를 닫았습니다');
    } catch (e) { flash(e.message, true); }
  };

  const dmp = $('#b-dump');
  if (dmp) dmp.onclick = () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    // 열쇠가 필요해서 헤더를 실어야 한다. 링크로는 못 받으니 받아서 저장한다.
    fetch(`/api/events/${cur}/dump`, { headers: { 'x-okey': okeyOf(cur) } })
      .then(r => r.ok ? r.blob() : Promise.reject(new Error('열쇠가 필요합니다')))
      .then(bl => { const a = document.createElement('a');
                    a.href = URL.createObjectURL(bl);
                    a.download = `hackon-${cur}.json`; a.click(); URL.revokeObjectURL(a.href);
                    flash('내려받았습니다'); })
      .catch(e => flash(e.message, true));
  };

  const pr = $('#b-print');
  if (pr) pr.onclick = () => window.print();

  const rep2 = $('#b-report');
  if (rep2) rep2.onclick = () => {
    if (LIVE) location.href = `/e/${cur}/report`;
    else { tab = 'report'; render(); }
  };

  const ext = $('#b-ext');
  if (ext) ext.onclick = async () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    try {
      const r = await api(`/events/${cur}/extend`, { method: 'POST', body: { minutes: 30 } });
      flash(`마감을 ${r.minutes}분 미뤘습니다`);
    } catch (e) { flash(e.message, true); }
  };

  const copyAny = async (sel, msg) => {
    const t = $(sel).textContent.trim();
    // 보안 문맥이 아니면 clipboard 가 없다. 그때는 옛날 방식으로 떨어진다
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    flash(msg);
  };
  const copy = $('#b-copy');
  if (copy) copy.onclick = () => copyAny('.share', '공개 주소를 복사했습니다');
  const copyj = $('#b-copyj');
  if (copyj) copyj.onclick = () => copyAny('#jlink', '심사 주소를 복사했습니다');
  const copyt = $('#b-copyt');
  if (copyt) copyt.onclick = () => copyAny('#tvlink', '현장 화면 주소를 복사했습니다');

  const csv = $('#b-csv');
  if (csv) csv.onclick = async () => {
    if (!LIVE) return flash('데모에서는 못 내려받습니다', true);
    const d = await api(`/events/${cur}/board`);
    const head = ['순위', '팀', '연락처', '역할', '유입', '개인정보동의', '촬영동의', '왔음',
                  '제출', '링크', '설명', '점수', '심사'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;   // 쉼표·줄바꿈이 든 칸을 지킨다
    const body = d.rows.map(r =>
      [r.rank, r.name, r.contact, r.role, r.found,
       r.agreed ? '동의' : '', r.photo ? '동의' : '', r.came ? '왔음' : '',
       r.done ? '제출' : '미제출', r.url, r.note, r.score, r.judges].map(q).join(','));
    // 엑셀은 BOM 이 없으면 한글을 깬다. 줄바꿈은 CRLF 로 준다.
    // 이스케이프 대신 문자코드를 쓴다 — 이 파일이 스크립트로 여러 번 고쳐지는데
    // 역슬래시가 한 겹씩 먹혀서 한 번 깨진 적이 있다.
    const BOM = String.fromCharCode(0xFEFF), NL = String.fromCharCode(13, 10);
    const blob = new Blob([BOM + [head.map(q).join(','), ...body].join(NL)],
                          { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${d.event.title}_명단.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  };

  const padd = $('#p-add');
  if (padd) padd.onclick = async () => {
    const name = $('#p-name').value.trim();
    if (!name) return flash('회사 이름을 넣어 주세요', true);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/events/${cur}/sponsors`, { method: 'POST',
        body: { name, kind: $('#p-kind').value, amount: $('#p-amt').value } });
      flash('협찬사를 넣었습니다');
    } catch (e) { flash(e.message, true); }
  };

  const oadd = $('#o-add');
  if (oadd) oadd.onclick = async () => {
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/events/${cur}/outcomes`, { method: 'POST',
        body: { kind: $('#o-kind').value, who: $('#o-who').value } });
      flash('기록했습니다');
    } catch (e) { flash(e.message, true); }
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

/* 로고를 누르면 처음으로. 공개·심사·보고서 화면에서는 그 대회 안에 머문다 —
   손님을 남의 운영 화면으로 떨어뜨리지 않는다. */
const home = document.getElementById('b-home');
if (home) home.onclick = () => {
  if (location.pathname !== '/') { location.href = '/'; return; }
  tab = 'home'; curTeam = ''; render();
};

/* 주소가 /e/<대회id> 면 읽기 전용 공개 화면으로 연다. 아래 탭과 편집 칸을 감춘다. */
const PUB = location.pathname.match(/^\/e\/([a-z0-9]+)(\/report)?$/);
const JUD = location.pathname.match(/^\/j\/([a-z0-9]+)$/);
const TVM = location.pathname.match(/^\/tv\/([a-z0-9]+)$/);
if (PUB || JUD || TVM) {
  cur = (PUB || JUD || TVM)[1];
  tab = TVM ? 'tv' : JUD ? 'judge' : (PUB[2] ? 'report' : 'pub');
  document.querySelector('nav').style.display = 'none';
}
if (TVM) {
  document.body.classList.add('tv');
  /* 아무도 안 만져도 되게. 10초마다 스스로 새로 받는다. */
  setInterval(() => render(), 10000);
}
else if (location.hash.length > 1) { cur = location.hash.slice(1); tab = 'board'; }
render();
if (LIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
