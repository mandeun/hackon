      </section>
      ${rows.length ? rows.map(r => `<div class="card" id="pr-${esc(r.id)}">

          ${solved.has(r.id) ? '<span class="pill ok">보냈습니다</span>' : `<button class="btn sm" data-solve="${esc(r.id)}">풀었습니다</button>`}
        </div>

          <div class="row"><div><label>이름</label><input data-sol-name placeholder="팀·별명"></div><div><label>연락처 <span class="pill">낸 분만 봄</span></label><input data-sol-contact placeholder="선택"></div></div>
          <label>결과물 주소</label><input data-sol-url placeholder="https://... (누르면 열리는 주소)">

      <div class="card"><h3>문제를 내고 싶다면</h3><div class="meta">가게나 모임에서 매일 손이 가는 일 하나. 3분이면 올라갑니다.</div>

      <p class="meta" style="margin:14px 4px"><a href="/">처음으로</a> · <a href="/news">해커온뉴스</a></p>`;

      </section>
      ${!ev ? `<div class="card"><h3>아직 대회에 붙지 않았습니다</h3><div class="meta">운영자가 대회 주제로 고르면 여기에 대회와 만드는 팀이 보입니다. 이 주소를 적어 두세요.</div></div>`
      : `<div class="card"><h3>${esc(ev.title)}</h3><div class="meta">${esc(ev.starts)}${ev.due ? ' · 제출 마감 ' + esc(ev.due.replace('T', ' ')) : ''} · <a href="/e/${esc(ev.id)}">대회 페이지</a></div></div>
      ${!ev.closed ? `<div class="card"><h3>지금 ${v.teams.length}팀이 만들고 있습니다</h3>

          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-verdict="${t.id}" data-ok="1">이거면 됩니다</button><button class="btn sec sm" data-verdict="${t.id}" data-ok="0">아직 아니에요</button></div>

    return `<section class="hero">
        <h2>줄 수 있는 것이 있으신가요</h2>
        <p class="sub" style="margin-bottom:0">하나만 있어도 되고, 세 번만 고르면 끝납니다.</p>
      </section>
      ${giveBox()}
      <p class="meta" style="margin:14px 4px"><a href="/">처음으로</a></p>`;
  },

  /* 행사장 큰 화면 — /tv/<대회id>. 노트북을 HDMI 로 꽂아 두는 용도다.
     참가자가 제일 자주 묻는 것 세 개(언제까지·지금 뭐 하는 시간·주소)를 종일 띄워 둔다. */
  async tv() {
    const d = await api(`/events/${cur}/tv`);
    const now = new Date();
    /* 로고 벽 — 후원 로고·심사 이름·빈 자리를 6칸에. 후원이 하나라도 있으면 10분마다 30초 자동, L 키로 켜고 끈다 */
    const cells = [];
    for (const sp of (d.sponsors || []).slice(0, 5)) {
      const logo = /^(https?:\/\/|\/api\/sponsors\/\d+\/logo$)/i.test(String(sp.logo || '')) ? sp.logo : '';
      cells.push(`<div>${logo ? `<img src="${esc(logo)}" alt="${esc(sp.name)}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:this.alt}))">` : `<b>${esc(sp.name)}</b>`}<span class="who">함께한 곳</span></div>`);
    }
    if ((d.judges || []).length) cells.push(`<div class="names"><span class="who">심사·멘토</span><b>${d.judges.map(esc).join('<br>')}</b></div>`);
    const opens = (d.open || []).slice();
    while (cells.length < 6) {
      const n = opens.shift();
      cells.push(n
        ? `<div class="open"><span class="who">이 자리 비었습니다</span><b>${esc(needKind(n.kind))} · ${esc(n.label)}</b><span class="who" style="font-size:3vh;color:#fff;font-weight:900">${+n.price ? '희망가 ' + won(n.price) : '금액은 이야기해서'}</span><span class="who">${esc(shareBase().replace(/^https?:\/\//, ''))}/give/${esc(cur)} · 맡으면 여기 이름이 큽니다 · 돈은 주최자에게 직접</span></div>`
        : `<div class="open"><span class="who">이 자리 비었습니다</span><b>${esc(shareBase().replace(/^https?:\/\//, ''))}/give/${esc(cur)}</b><span class="who">장소 · 심사 · 간식 · 크레딧 — 맡아 주시면 여기 이름이 큽니다</span></div>`);
    }
    const wallOn = TVWALL || ((d.sponsors || []).length > 0 && now.getMinutes() % 10 === 0 && now.getSeconds() < 30);
    const wall = wallOn ? `<div class="tvwall" style="grid-template-columns:repeat(3,1fr)">${cells.slice(0, 6).join('')}</div>` : '';
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    /* 지금 지난 것 중 마지막이 '지금', 그다음이 '다음'. 시각만 비교하면 된다. */
    const plan = d.plan || [];
    let at = -1;
    plan.forEach((r, i) => { if (r.at <= hhmm) at = i; });
    const cur1 = plan[at], nxt = plan[at + 1];

    return `${wall}<div class="tvwrap">
      <div class="tvtop">
        <div class="tvtitle">${esc(d.title)}</div>
        <div class="tvhost">${esc(d.host)}</div>
      </div>
      ${(d.sponsors || []).length ? `<div class="tvspon"><small>함께한 곳</small>${logoBand(d.sponsors, true)}</div>` : ''}

      ${(cur1 && /팀 짜기|팀짜기/.test(cur1.what) && (d.crew.solo.length || d.crew.looking.length))
        ? `<div class="tvmid"><div class="tvnow" style="flex:1;overflow:hidden">
             <div class="tvlabel">같이 할 사람</div>
             <div style="display:flex;gap:2vw;margin-top:1vh">
               <div style="flex:1">
                 <div class="tvsub" style="color:#AEB6C8">혼자 오신 분</div>
                 ${d.crew.solo.slice(0, 8).map(r => `<div class="tvsub">
                   <em>${esc(r.name)}</em> ${esc(r.role || '')}</div>`).join('')}
               </div>
               <div style="flex:1">
                 <div class="tvsub" style="color:#AEB6C8">사람 찾는 팀</div>
                 ${d.crew.looking.slice(0, 8).map(r => `<div class="tvsub">
                   <em>${esc(r.name)}</em> ${r.size}명 · ${esc(r.want)}</div>`).join('')}
               </div>
             </div>
           </div></div>`
        : ''}

      <div class="tvmid">
        <div class="tvbig">
          ${(() => {
            /* 발표 시간이고 낸 팀이 있으면 «지금 발표 · 다음» 큐와 팀별 타이머. 팀당 분은 진행표 글에서 읽는다(기본 5분) */
            const pitch = cur1 && nxt && /발표|피칭|데모|시연/.test(cur1.what);
            if (pitch && (d.order || []).length) {
              const per = +((cur1.what.match(/팀당\s*(\d+)\s*분/) || [])[1] || 5);
              const [h, mi] = cur1.at.split(':').map(Number);
              const start = new Date(); start.setHours(h, mi, 0, 0);
              const idx = Math.max(0, Math.min(d.order.length - 1, Math.floor((now - start) / 60000 / per)));
              const end = new Date(start.getTime() + (idx + 1) * per * 60000);
              const due = `${ymd()}T${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')}`;
              return `<div class="tvlabel">지금 발표 · ${per}분</div>
               <div class="tvclock" id="tv-pitch" data-due="${due}"></div>
               <div class="tvsub" style="margin-top:1.2vh"><em>${d.order[idx].no}</em> ${esc(d.order[idx].name)}${d.order[idx + 1] ? ` <span style="color:#AEB6C8">· 다음 ${d.order[idx + 1].no} ${esc(d.order[idx + 1].name)}</span>` : ' <span style="color:#AEB6C8">· 마지막</span>'}</div>
               <div class="tvsub" style="font-size:2.1vh;color:#AEB6C8;margin-top:.6vh">${d.order.map((o, i) => `${i === idx ? '<b style="color:#fff">' : ''}${o.no} ${esc(o.name)}${i === idx ? '</b>' : ''}`).join(' → ')}</div>`;
            }
            return pitch
            ? `<div class="tvlabel">${esc(cur1.what)} · 다음(${esc(nxt.at)} ${esc(nxt.what)})까지</div>
               <div class="tvclock" id="tv-pitch" data-due="${ymd()}T${esc(nxt.at)}"></div>`
            : d.due
            ? `<div class="tvlabel">제출 마감까지</div>
               <div class="tvclock" data-due="${esc(d.due)}"></div>`
            : `<div class="tvlabel">오늘</div>
               <div class="tvclock" style="font-size:9vh">${esc(d.starts)}</div>`; })()}
          <div class="tvsub" style="margin-top:2.4vh">
            제출 <em>${d.done}</em> / ${d.teams}팀
            ${d.waiting.length && d.waiting.length <= 6
              ? `<br><span style="font-size:2.1vh;color:#AEB6C8">아직 —
                 ${d.waiting.map(esc).join(' · ')}</span>` : ''}
          </div>
        </div>

        <div class="tvside">
          <div class="tvnow">
            <div class="tvlabel">지금</div>
            <b>${cur1 ? esc(cur1.what) : '시작 전'}</b>
            ${nxt ? `<div class="tvnext">다음 · ${esc(nxt.at)} ${esc(nxt.what)}</div>` : ''}
          </div>
          ${d.ranks.length ? `<div class="tvnow" style="flex:1">
            <div class="tvlabel">순위</div>
            ${d.ranks.map(r => `<div class="tvsub" style="display:flex;gap:1vw">
              <em style="width:2ch">${r.rank}</em>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
              <em>${r.score}</em></div>`).join('')}
          </div>` : ''}
        </div>
      </div>

      ${(d.seats || []).length ? `<div class="tvseats" id="tv-seats">${d.seats.map(x => `<span><em>${x.no}</em>${esc(x.name)}</span>`).join('')}</div>` : ''}
      ${d.notice ? `<div class="tvnotice">${esc(d.notice)}</div>` : ''}
      ${d.wifi ? `<div class="tvwifi"><span>와이파이</span>${esc(d.wifi)}</div>` : ''}

      <div class="tvbot">
        ${qrTag(`${shareBase()}/e/${cur}`, 'big')}
        <div class="tvaddr">${esc(shareBase().replace(/^https?:\/\//, ''))}/e/${esc(cur)}
          <span>휴대폰으로 QR 을 찍으세요 · 여기서 신청하고 제출합니다</span></div>
        <div class="tvrank">
          <div><b>${d.teams}</b><span>참가 팀</span></div>
          <div><b>${d.done}</b><span>제출</span></div>
        </div>
      </div>
      ${(d.sponsors || []).length ? `<div class="tvbot" style="padding-top:1.6vh">
        <span style="font-size:1.6vh;color:#8A91A3;flex:none">함께한 곳</span>
        ${logoBand(d.sponsors, true)}
      </div>` : ''}
    </div>`;
  },

  /* 심사위원 화면 — /j/<대회id> 로 연다. 점수만 넣는다.
     남의 점수와 순위는 서버가 아예 안 준다. 심사 중에 순위를 보면 점수가 끌려간다. */
  async judge() {
    /* 심사 열쇠가 없으면 화면 자체가 안 열린다 — 공개 링크만으로 아무나 점수를 넣던 것을 막았다.
       운영자가 보낸 /j/<id>?k=… 를 열면 열쇠가 자동으로 담긴다. 직접 받은 열쇠를 넣어도 된다. */
    const keyPrompt = (err) => `<h2>심사위원 화면</h2>
      <p class="sub">${err ? '<b class="late">' + esc(err) + '</b><br>' : ''}
        운영자에게 받은 <b>심사 링크</b>를 여세요(열쇠가 들어 있습니다). 열쇠만 받으셨다면 여기에 넣으세요.</p>
      <label>심사 열쇠</label><input id="jk-in" placeholder="영문과 숫자 10자">
      <div style="height:12px"></div>
      <button class="btn" id="jk-go">열기</button>`;
    if (!jkeyOf(cur)) return keyPrompt('');
    const who = localStorage.getItem('hackon.judge') || '';
    if (!who) {
      let e;
      try { e = await api(`/events/${cur}/judge`); }
      catch (err) { return keyPrompt('열쇠가 맞지 않습니다. 다시 확인해 주세요.'); }
      return `<h2>${esc(e.event.title)}</h2>
        <p class="sub">이름을 넣으면 시작합니다. 같은 이름으로 다시 들어오면 이어서 고칩니다.</p>
        <label>심사위원 이름</label><input id="jn" placeholder="이름">
        <div style="height:10px"></div>
        <button class="btn" id="jn-go">시작</button>`;
    }
    const d = await api(`/events/${cur}/judge?judge=${encodeURIComponent(who)}`);
    const done = d.teams.length - d.left;
    const head = `<p class="sub">${esc(who)} 님 · ${done}/${d.teams.length}팀 봤습니다
      <button class="btn sec sm" id="jn-out" style="margin-left:6px">이름 바꾸기</button></p>
      <div class="jbar"><div class="grow"><i style="width:${
        d.teams.length ? Math.round(done / d.teams.length * 100) : 0}%"></i></div>
        <button class="btn sec sm" id="j-all">${jAll ? '심사로 돌아가기' : '전체 비교'}</button></div>`;

    /* 전체 비교 - 앞 팀에 90점을 줬는데 뒤에 더 잘한 팀이 나오면 앞을 고쳐야 한다.
       그 길이 없으면 심사위원은 처음부터 점수를 짜게 준다. */
    if (jAll) {
      const my = d.teams.map(t => ({
        t, sum: d.event.rubric.reduce(
          (a, r) => a + (t.mine[r.key] ?? 0) * r.weight / 100, 0),
      })).sort((a, b) => b.sum - a.sum);
      return `<h2>${esc(d.event.title)}</h2>${head}
        <p class="sub">제가 준 점수만 보입니다. 팀을 누르면 고칠 수 있습니다.</p>
        <table><tr><th>팀</th><th class="n">내 점수</th></tr>
        ${my.map(x => `<tr data-jgo="${x.t.id}" style="cursor:pointer">
          <td>${esc(x.t.name)}${x.t.doneByMe ? '' : ' <span class="pill warn">아직</span>'}</td>
          <td class="n">${x.t.doneByMe ? Math.round(x.sum * 10) / 10 : '—'}</td></tr>`).join('')}
        </table>`;
    }

    /* 지금 볼 팀. 정해 둔 게 없으면 아직 안 본 팀부터, 다 봤으면 첫 팀으로. */
    let t = d.teams.find(x => String(x.id) === String(jTeam));
    if (!t) t = d.teams.find(x => !x.doneByMe) || d.teams[0];
    if (!t) return `<h2>${esc(d.event.title)}</h2>${head}
      <p class="sub">아직 참가 팀이 없습니다.</p>`;
    jTeam = t.id;
    const at = d.teams.findIndex(x => x.id === t.id);

    return `<h2><span class="pill" id="j-seat" title="자리 번호 — 큰 화면과 같습니다">자리 ${t.no || at + 1}</span> ${esc(t.name)}</h2>${head}
      ${d.first ? `<div class="notice" id="j-first">첫 팀은 <b>옆 심사위원과 같이 채점</b>하고 차이를 맞춰 보세요. 그다음부터 따로 매깁니다. (눈높이 맞추기)</div>` : ''}
      ${dueBox(d.event)}
      <div class="card">
        ${t.note ? `<div class="meta" style="font-size:14px">${esc(t.note)}</div>` : ''}
        ${t.url ? `<div class="shrow" style="margin-top:8px">
            <div class="share">${esc(t.url)}</div>
            <a class="btn sec sm" href="${esc(/^https?:\/\//i.test(t.url) ? t.url : '#')}"
               target="_blank" rel="noopener noreferrer">열기</a>
          </div>`
          : '<div class="meta">아직 제출하지 않았습니다.</div>'}
        ${(t.aiuse || t.aidrop) ? `<div class="meta" style="margin-top:9px">
          ${t.aiuse ? `<b>AI 를 쓴 곳</b> ${esc(t.aiuse)}<br>` : ''}
          ${t.aidrop ? `<b>버린 판단</b> ${esc(t.aidrop)}` : ''}
        </div>` : ''}
      </div>

      <div class="card">
        ${d.event.rubric.map(r => { const v = t.mine[r.key] ?? ''; return `
          <label>${esc(r.label)} <span class="pill">${r.weight}%</span></label>
          <div class="sl">
            <input type="range" min="0" max="100" step="5" value="${v}"
                   style="--p:${v}%" class="jv-${esc(t.id)}" data-key="${esc(r.key)}">
            <b>${v}</b>
          </div>${hintLine(r)}`; }).join('')}
      </div>

      <div class="card">
        <label>좋았던 점 <span class="pill ok">참가팀에게 전달됩니다</span></label>
        <div class="tags">${GOOD_TAGS.map(x =>
          `<button data-tag="jg-${esc(t.id)}" data-txt="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <textarea class="jg-${esc(t.id)}" rows="2"
          placeholder="위에서 누르거나 직접 쓰세요">${esc(t.review.good)}</textarea>
        <label>더 하면 좋을 것</label>
        <div class="tags">${NEXT_TAGS.map(x =>
          `<button data-tag="jn2-${esc(t.id)}" data-txt="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <textarea class="jn2-${esc(t.id)}" rows="2"
          placeholder="위에서 누르거나 직접 쓰세요">${esc(t.review.next)}</textarea>
        <div class="meta">참가자가 가장 아쉬워하는 것이 “왜 떨어졌는지 모른다” 입니다.</div>
      </div>

      <div class="shrow">
        <button class="btn sec sm" id="j-skip">건너뛰기</button>
        <button class="btn" id="j-next" data-jsave="${esc(t.id)}" style="flex:1">
          ${t.doneByMe ? '고치고 다음 팀' : '저장하고 다음 팀'}</button>
      </div>
      <p class="sub" style="margin-top:8px">${at + 1}번째 · 심사 기준
        ${d.event.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}</p>`;
  },

  /* 프로필 - 누구나 열 수 있다. 연락처는 서버가 애초에 안 내려보낸다. */
  async prof() {
    const d = await api(`/people/${curPerson}`);
    const mine = myContact();
    const T = d.tier || { name: '새싹', level: 0, next: '' };
    const TC = ['#AEB6C8', '#B87333', '#8E9BB0', '#D4A017', '#1F6F5C'][T.level] || '#AEB6C8';
    return `<h2>${esc(d.handle || '이름 없음')}</h2>
      <p class="sub">${d.level ? esc(d.level) + ' · ' : ''}${
        d.placed ? `대회 ${d.events}번` : `대회 ${d.events}번 · 아직 배치 중`}</p>
      <div class="card" id="tier" style="text-align:center;padding:22px 16px;border:2px solid ${TC}">
        <div class="meta">HACK:ON 티어</div>
        <div style="font-size:34px;font-weight:900;color:${TC};letter-spacing:-.02em;line-height:1.1;margin:4px 0">${esc(T.name)}</div>
        <div class="meta">완주 ${d.finished} · 수상 ${d.wins || 0}${d.skill && d.skill.show ? ' · 동료 실력 ' + d.skill.score : ''}</div>
        ${T.next ? `<div class="meta" style="margin-top:6px">${esc(T.next)}</div>` : ''}
        <div class="meta" style="margin-top:10px;font-family:var(--mono,monospace)">${esc(location.host)}/p/${esc(d.id)}</div>
        <div class="meta">이 주소를 이력서·프로필에 붙이세요. 숫자는 대회 기록에서만 나옵니다.</div>
      </div>
      <div class="card" id="xp"><h3>기여 ${(d.xp && d.xp.total) || 0} <span class="pill">채굴량</span></h3>
        <div class="meta">남을 위해 한 일이 그대로 내 기록입니다 — 완주뿐 아니라 평가를 주고, 문제를 올리고, 풀이를 보내고, 판정하고, 자리를 맡은 것까지.</div>
        ${(d.xp && d.xp.items.length) ? `<table style="margin-top:8px"><tr><th>한 일</th><th>횟수</th><th>기여</th></tr>${d.xp.items.map(x => `<tr><td>${esc(x.label)}</td><td>${x.count}</td><td><b>${x.xp}</b></td></tr>`).join('')}</table>` : '<div class="meta" style="margin-top:6px">아직 없습니다. 대회에 나오거나 <a href="/problems">문제를 풀면</a> 쌓입니다.</div>'}
        <div class="meta" style="margin-top:8px"><a href="/rank">순위 보기</a></div>
      </div>

      <div class="stat">
        <div><b>${d.finished}</b><span>완주</span></div>
        <div><b>${d.events ? d.finishRate + '%' : '—'}</b><span>완주율</span></div>
        <div><b>${d.noshow}</b><span>안 온 횟수</span></div>
      </div>
      <p class="sub">완주율은 <b>온 대회</b> 기준입니다.
        신청하고 안 온 것은 실력이 아니라 매너로 따로 셉니다.</p>

      <div class="card">
        <h3>다른 참가자가 준 평가</h3>
        <div class="meta">${repLine('실력', d.skill)}<br>${repLine('매너', d.manner)}</div>
        <div class="meta" style="margin-top:7px">누가 줬는지는 안 보이고, 같은 대회에 있던 분만 남깁니다.</div>
      </div>

      ${d.history.length ? `<h3 style="margin-top:16px">나온 대회</h3>
        <table><tr><th>대회</th><th>팀</th><th>결과</th></tr>
        ${d.history.map(h => `<tr><td>${esc(h.title)}<br>
            <span class="meta">${esc(h.ends)}</span></td>
          <td>${esc(h.team)}${h.role ? `<br><span class="meta">${esc(h.role)}</span>` : ''}</td>
          <td>${h.made ? '<span class="pill ok">완주</span>'
               : h.came ? '<span class="pill warn">미완</span>'
                        : '<span class="pill">안 옴</span>'}</td></tr>`).join('')}</table>` : ''}

      <div class="card">
        <h3>제 프로필인가요</h3>
        <div class="meta">참가할 때 쓴 연락처를 넣으면 이름과 실력을 고칠 수 있습니다.</div>
        <label>연락처</label><input id="pf-c" value="${esc(mine)}" placeholder="참가할 때 쓴 것">
        <div class="row">
          <div><label>보여 줄 이름</label><input id="pf-h" value="${esc(d.handle)}"></div>
          <div><label>실력</label><select id="pf-l">
            <option value="">안 고름</option>
            ${LEVELS.map(l => `<option${d.level === l ? ' selected' : ''}>${l}</option>`).join('')}
          </select></div>
        </div>
        <div style="height:10px"></div>
        <button class="btn sm" id="pf-save">고치기</button>
      </div>`;
  },

  /* 관객 평가 화면 — /v/<대회id>?k=<투표 열쇠>. 심사위원을 못 구했을 때 그 자리를 대신한다.
     현장 큰 화면의 QR 을 찍어 연다. 한 팀에 한 번, 별 1~5. 언제든 고친다. */
  async vote() {
    const keyPrompt = (err) => `<h2>관객 평가</h2>
      <p class="sub">${err ? '<b class="late">' + esc(err) + '</b><br>' : ''}
        운영자가 큰 화면에 띄운 <b>투표 링크</b>(QR)를 여세요. 링크에 투표 열쇠가 들어 있습니다.</p>
      <label>투표 열쇠</label><input id="vk-in" placeholder="영문과 숫자 10자">
      <div style="height:12px"></div><button class="btn" id="vk-go">열기</button>`;
    /* 상호평가면 투표 열쇠가 아니라 팀 열쇠다 — 신청한 브라우저에만 있다. 공개 대회 정보로 먼저 가른다. */
    const pubE = LIVE ? await api(`/events/${cur}`).catch(() => null) : null;
    const peer = !!(pubE && pubE.vpeer);
    const myT = localStorage.getItem('hackon.team.' + cur);
    const tk = myT ? tkeyOf(myT) : '';
    if (peer && !tk) return `<h2>참가팀 상호평가</h2>
      <p class="sub">참가 신청한 브라우저에서만 표를 줄 수 있습니다 — 신청할 때 쓴 폰으로 여세요.</p>`;
    if (!peer && !vkeyOf(cur)) return keyPrompt('');
    let d;
    try { d = await api(`/events/${cur}/vote`, peer ? { tkey: tk } : {}); }
    catch (e) { return keyPrompt('아직 안 켜졌거나 열쇠가 맞지 않습니다.'); }
    VOTE_TK = peer ? tk : '';
    const teams = d.teams.filter(t => !d.me || t.id !== d.me);
    if (!teams.length) return `<h2>${esc(d.event.title)}</h2>
      <p class="sub">아직 별점을 줄 팀이 없습니다.</p>`;
    return `<h2>${esc(d.event.title)}</h2>
      <p class="sub">${peer ? '참가팀끼리 서로 평가합니다. 자기 팀은 목록에 없고, 팀당 한 표라 팀원이 다시 찍으면 나중 것이 남습니다.'
                           : '마음에 드는 작품에 별점을 주세요. 한 팀에 한 번, 언제든 고칠 수 있습니다. 누가 줬는지는 남기지 않습니다.'}</p>
      ${teams.map(t => { const mine = +(localStorage.getItem('hackon.vote.' + t.id) || 0);
        return `<div class="card"><h3>${esc(t.name)}</h3>
        <div class="stars" data-vote="${t.id}">${[1, 2, 3, 4, 5].map(i =>
          `<button data-vs="${i}" class="${i <= mine ? 'on' : ''}">★</button>`).join('')}</div>
        <input data-vnote="${t.id}" maxlength="80" placeholder="한 줄 (선택) — 마감 뒤 공개, 누가 썼는지는 안 남습니다" style="margin-top:8px">
      </div>`; }).join('')}`;
  },

  /* 결과 보고서 — 협찬사에게 보내는 물건. 인쇄하면 그대로 PDF 가 된다.
     빈칸이 생기지 않게 앞의 세 기능(마감·신청·사후지원)을 먼저 만들었다. */
  async report() {
    const d = await api(`/events/${cur}/board`);
    const o = await api(`/events/${cur}/outcomes`);
    const sup = LIVE ? await api(`/events/${cur}/support`) : { rows:[] };
    const pk = await api(`/events/${cur}/pack`).catch(() => null);
    const fw = await api(`/events/${cur}/follow`).catch(() => null);
    /* 절 번호를 손으로 적으면 조건부로 빠지는 절 때문에 반드시 어긋난다. 세면서 붙인다. */
    const KR = ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
    let sec = 0;
    const S = () => KR[sec++] || String(sec);
    /* 심사 눈높이는 운영자 것이라 손님에게는 403 이 온다. 보고서는 나눠 주는 물건이라
       없는 부분은 빼고 그린다. 여기서 안 잡으면 보고서 전체가 안 뜬다. */
    let sp = { rows: [], gap: 0 };
    try { sp = await api(`/events/${cur}/spread`); } catch {}
    const e = d.event;
    const done = d.rows.filter(r => r.done);
    const money = e.sponsors.reduce((a, s) => a + (+s.amount || 0), 0);
    return `<div class="noprint" style="margin-bottom:14px">
        <button class="btn sm" id="b-print">인쇄 · PDF 로 저장</button>
        <div class="meta" style="margin-top:6px">이 주소를 그대로 보내셔도 됩니다.</div>
      </div>

      <h2>${esc(e.title)} 결과 보고서</h2>
      <p class="sub">${esc(e.host)} 주최 · ${esc(e.starts)}~${esc(e.ends)}
        ${e.topic ? '· 주제 ' + esc(e.topic) : ''}</p>

      ${(pk && pk.top && pk.top.length) ? `<h3>${S()}. 이런 것이 나왔습니다</h3>
        
        ${pk.top.map(t => `<div class="card">
          <h3>${t.rank}위 · ${esc(t.name)}
            ${t.reachable ? '<span class="pill ok">연락 받겠다고 했습니다</span>' : ''}</h3>
          ${t.note ? `<div class="meta" style="font-size:14px">${esc(t.note)}</div>` : ''}
          ${t.url ? `<div class="share">${esc(t.url)}</div>` : ''}
          ${t.aidrop ? `<div class="meta" style="margin-top:7px">
            <b>AI 가 준 것 중 버린 판단</b> ${esc(t.aidrop)}</div>` : ''}
        </div>`).join('')}
        ${pk.top.some(t => t.reachable) ? `<p class="sub">
          <b>연락 받겠다고 한 팀이 있습니다.</b> 주최자에게 말씀하시면 동의한 팀만 연결해 드립니다.</p>` : ''}` : ''}

      <h3>${S()}. 무엇을 했나</h3>
      <div class="stat">
        <div><b>${e.teams}</b><span>신청</span></div>
        <div><b>${o.came ?? 0}</b><span>온 팀</span></div>
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
      </div>
      ${o.solo ? `<p class="sub">혼자 오신 분 ${o.solo}명은 현장에서 팀을 짰습니다.</p>` : ''}

      ${(o.found || []).length ? `<h3>${S()}. 어디서 왔나</h3>
        <table><tr><th>경로</th><th class="n">신청</th></tr>
        ${o.found.map(f => `<tr><td>${esc(f.k)}</td><td class="n">${f.c}팀</td></tr>`).join('')}</table>
        <p class="sub">다음 회차 홍보는 위쪽 경로에 집중합니다.</p>` : ''}

      <h3>${S()}. 약속드린 것과 실제로 한 것</h3>
      ${(pk && pk.sponsors.length)
        ? `${pk.sponsors.map(sp => `<div class="card">
             <h3>${esc(sp.name)} <span class="pill">${esc(sp.kind)}</span>
               <span class="pill ${sp.kept === sp.total ? 'ok' : 'warn'}">${sp.kept}/${sp.total}</span>
               ${sp.amount ? `<span class="pill">${won(sp.amount)}</span>` : ''}</h3>
             <table><tr><th>약속</th><th style="width:5em">했나</th></tr>
             ${sp.promises.map(pr => `<tr>
               <td${pr.done ? '' : ' style="color:var(--warn)"'}>${esc(pr.text)}</td>
               <td>${pr.done ? '<span class="pill ok">함</span>'
                             : '<span class="pill warn">못 함</span>'}</td></tr>`).join('')}</table>
             ${sp.proof ? `<div class="meta" style="margin-top:8px"><b>증빙</b>
               <span class="share">${esc(sp.proof)}</span></div>` : ''}
           </div>`).join('')}
           ${money ? `<p class="sub">합계 ${won(money)} 상당.</p>` : ''}
           ${logoBand(e.sponsors)}`
        : e.sponsors.length
          ? `<table><tr><th>회사</th><th>무엇을</th><th class="n">규모</th></tr>
             ${e.sponsors.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.kind)}</td>
               <td class="n">${s.amount ? won(s.amount) : '—'}</td></tr>`).join('')}</table>
             ${logoBand(e.sponsors)}`
          : '<p class="sub">이번 회차는 협찬 없이 진행했습니다.</p>'}

      <h3>${S()}. 돌려드리는 숫자</h3>
      <p class="sub">‘몇 명이 봤다’를 쓰지 않습니다.</p>
      <table>
        <tr><th>항목</th><th class="n">건수</th></tr>
        <tr><td>완주 (끝까지 결과물을 낸 팀)</td><td class="n">${o.finished}/${o.teams}</td></tr>
        <tr><td>면접 연결 ${how('hand')}</td><td class="n">${o.interview}</td></tr>
        <tr><td>도입 검토 ${how('hand')}</td><td class="n">${o.adoption}</td></tr>
        <tr><td>채용 ${how('hand')}</td><td class="n">${o.hired}</td></tr>
        ${fw && fw.asked12 ? `<tr><td><b>90일 뒤에도 이어가는 팀</b></td>
            <td class="n">${fw.alive12}/${fw.asked12}</td></tr>
          <tr><td>낸 결과물이 아직 열리는 팀</td><td class="n">${fw.liveNow}</td></tr>` : ''}
      </table>
      <p class="sub">${how('hand')} 는 주최자가 넣은 숫자, 나머지는 앱이 센 것입니다. 노출 수는 쓰지 않습니다.</p>

      ${(pk && pk.mix.role.length) ? `<h3>${S()}. 어떤 분들이 왔나</h3>
        <p class="sub">이름과 연락처는 담지 않습니다. ${pk.minCell}건 미만은 뭉쳐서 씁니다.</p>
        <table><tr><th>맡은 일</th><th class="n">팀</th></tr>
        ${pk.mix.role.map(r => `<tr><td>${esc(r.k)}</td><td class="n">${r.c}</td></tr>`).join('')}
        </table>` : ''}

      ${fw && fw.asked12 ? `<h3>${S()}. 90일 뒤에 다시 물어봤습니다</h3>
        <p class="sub">결과물이 시상식에서 끝나지 않게, 끝난 뒤 2주 · 6주 · 12주에 세 번 물었습니다.</p>
        <div class="stat">
          <div><b>${fw.aliveRate}%</b><span>90일 생존</span></div>
          <div><b>${fw.liveNow}</b><span>링크 살아있음</span></div>
        </div>
        <table><tr><th>팀</th><th>2주</th><th>6주</th><th>12주</th></tr>
        ${fw.rows.map(r => `<tr><td>${esc(r.name)}</td>
          ${r.weeks.map(w => `<td>${w.asked ? (w.alive
            ? '<span class="pill ok">이어감</span>' : '<span class="pill">중단</span>')
            : '—'}</td>`).join('')}</tr>`).join('')}</table>` : ''}

      <h3>${S()}. 끝난 뒤에 한 일</h3>
      ${sup.rows.length
        ? `<p class="sub">약속 ${sup.promised}건 중 ${sup.done}건을 지켰습니다.${
             sup.late ? ` <span class="late">${sup.late}건이 기한을 넘겼습니다.</span>` : ''}</p>
           <table><tr><th>팀</th><th>봐 준 사람</th><th>기한</th><th></th></tr>
           ${sup.rows.map(r => `<tr><td>${esc(r.team_name)}</td>
             <td>${esc(r.helper_name)}${r.org ? ' · ' + esc(r.org) : ''}</td>
             <td>${esc(r.due)}</td>
             <td>${r.done ? '<span class="pill ok">완료</span>'
                          : `<span class="pill ${r.late ? 'warn' : ''}">${r.late ? '늦음' : '진행'}</span>`}</td>
           </tr>`).join('')}</table>`
        : '<p class="sub">이번 회차는 끝난 뒤 멘토를 정하지 않았습니다.</p>'}

      <h3>${S()}. 결과물</h3>
      ${done.length
        ? done.map(r => `<div class="card"><h3>${r.rank}위 · ${esc(r.name)}</h3>
            ${r.note ? `<div class="meta">${esc(r.note)}</div>` : ''}
            ${r.url ? `<div class="share">${esc(r.url)}</div>` : ''}</div>`).join('')
        : '<p class="sub">제출작이 없습니다.</p>'}
      <p class="sub">심사 기준 · ${e.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}
        · 심사위원 ${(d.judges || []).length}명
        ${sp.rows.length > 1
          ? `<br>심사위원 사이 평균 차이 ${sp.gap}점${sp.warn ? '' : ' — 눈높이가 맞았습니다'}.`
          : ''}</p>

      <h3>${S()}. 다음 회차</h3>
      <p class="sub">완주율 ${o.finishRate}% · 면접 ${o.interview}건 · 도입 검토 ${o.adoption}건. 같은 조건으로 한 번 더 하실 의향이 있으시면 알려 주십시오.</p>
      <p class="meta">${esc(e.title)} · 작성 ${new Date().toISOString().slice(0, 10)}</p>`;
  },

  /* 팀 한 곳 — 참가팀은 제출하고, 심사위원은 점수를 넣는다. 같은 화면을 둘이 나눠 쓴다. */
  async team() {
    const d = LIVE ? await api(`/events/${cur}/board`) : { event: DEMO.event, rows: DEMO.board };
    const t = d.rows.find(r => String(r.id) === String(curTeam)) || d.rows[0];
    if (!t) return `<h2>팀이 없습니다</h2>`;
    const cardData = LIVE ? await api(`/teams/${t.id}/card`) : null;
    const reqs = LIVE ? await api(`/events/${cur}/requests`).catch(() => []) : [];
    return `<button class="btn sec sm" data-go="board">← 순위로</button>
      <h2 style="margin-top:12px">${esc(t.name)}</h2>
      ${(d.event.sponsors || []).length ? `<div class="meta">함께하는 곳</div>${logoBand(d.event.sponsors)}<div style="height:6px"></div>` : ''}
      <p class="sub">${t.rank}위 · ${t.score}점 · 심사 ${t.judges}명</p>
      ${(d.judges || []).length ? `<div class="meta" style="margin:-8px 0 12px">
        본 사람 ${(t.by || []).map(esc).join(', ') || '없음'}${
          (() => { const no = (d.judges || []).filter(j => !(t.by || []).includes(j));
                   return no.length ? ' · 안 본 사람 ' + no.map(esc).join(', ') : ''; })()}
      </div>` : ''}

      ${dueBox(d.event)}
      <div class="card">
        <h3>결과물 제출</h3>
        <div class="meta">참가팀이 씁니다. 다시 내면 덮어써집니다.</div>
        ${d.event.due && new Date(d.event.due) < new Date()
          ? `<div class="err" style="margin:8px 0 0">마감이 지나 더는 낼 수 없습니다.
             진행자가 마감을 미루면 다시 열립니다.</div>` : ''}
        <label>링크 <span class="pill">배포한 주소</span></label>

        <div class="meta" id="s-url-hint"></div>
        <div class="meta">제출해야 후원 크레딧과 프로필 «완주»가 남습니다. 미완이어도 주소는 내세요.</div>
        ${t.seats ? `<label>팀 자리 <span class="pill">밖에서 구한 분은 게스트로</span></label>
          <div class="seats">
            ${t.seats.mem.map((m, i) => `<span class="seat${m.g ? ' g' : ''}">${esc(m.n)}
              <button data-seatdel="${i}" style="margin-left:5px;color:var(--ink3)">×</button></span>`).join('')}
            ${Array(t.seats.free).fill(0).map(() =>
              '<span class="seat free">＋ 빈자리</span>').join('')}
          </div>
          <div class="shrow" style="margin-top:8px">
            <input id="st-n" placeholder="이름 (밖에서 구했으면 비우세요)">
            <button class="btn sec sm" id="st-add">채우기</button>
          </div>
          <div class="meta">이름을 비우고 누르면 <b>게스트</b>로 자리만 잡습니다.</div>
          <div style="height:12px"></div>` : ''}
        <label>설명</label>
        <textarea id="s-note" rows="3"
          placeholder="가장 중요한 것을 첫 줄에. 길게 쓰는 게 좋은 게 아닙니다">${esc(t.note || '')}</textarea>
        <label>AI 를 어디에 쓰셨나요 <span class="pill ok">눌러만 주세요</span></label>
        <div class="picks" id="s-ai-picks">${AI_WHERE.map((w) => {
          const on = (t.aiuse || '').split('·').map((x) => x.trim()).includes(w);

        }).join('')}</div>
        <input type="hidden" id="s-aiuse" value="${esc(t.aiuse || '')}">
        <label>버린 판단이 있으면 한 줄 <span class="pill">선택</span></label>
        <input id="s-aidrop" maxlength="200"
          placeholder="예) 추천 로직이 우리 문제와 안 맞아서 버렸습니다" value="${esc(t.aidrop || '')}">
        ${reqs.length ? `<label>어느 주제·요청으로 만들었나요 <span class="pill">선택</span></label>
          <select id="s-request"><option value="">자유 주제</option>${reqs.map(r => `<option value="${esc(r.id)}"${t.request === r.id ? ' selected' : ''}>${esc(r.kind === 'sponsor' ? '후원자' : '의뢰자')} · ${esc(r.topic || r.pain)}</option>`).join('')}</select>
          <div class="meta">고르면 마감 뒤 결과물을 받고 «됐다/아니다»를 답합니다.</div>` : ''}
        <div style="height:14px"></div>

function wire() {
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    cur = el.dataset.open; localStorage.setItem('hackon.event', cur);
    /* 내 대회면 운영 화면(순위), 남의 대회면 대회 페이지(신청이 거기 있다).
       전에는 손님도 순위로 갔다가 «공개 페이지» 단추를 한 번 더 눌러야 신청 칸을 봤다. */
    tab = okeyOf(cur) ? 'board' : 'pub'; render();
  });
  /* div 로 만든 카드는 키보드로 못 닿는다. 탭으로 다니는 사람은 자기 대회를 영영 못 연다. */
  document.querySelectorAll('[data-open]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
  const go = $('[data-go]'); if (go) go.onclick = () => { tab = go.dataset.go; render(); };
  const bpub = $('#b-pub'); if (bpub) bpub.onclick = () => { tab = 'pub'; render(); };

  /* 예산 나누기 - 두 단계. 먼저 미리 보여 주고(dry), «판에 올리기»를 눌러야 굽는다.
     손으로 올린 자리·손고침·맡은 사람 있는 줄은 서버가 안 건드린다. */
  const bgo = $('#bg-go');
  if (bgo) bgo.onclick = async () => {
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    const v = $('#bg-in').value.trim();
    if (v === '') return flash('금액을 넣어 주세요. 0 이면 온라인판이 됩니다', true);
    try {
      const a = await api(`/events/${cur}/allocate?dry=1`, { method: 'POST', body: { budget: +v } });
      const box = $('#bg-preview'); box.hidden = false;
      box.innerHTML = a.rows.length
        ? `<table style="margin-top:10px"><tr><th>자리</th><th>수</th><th class="n">계획</th></tr>
            ${a.rows.map(r => `<tr><td>${esc(needKind(r.kind))} · ${esc(r.label)}</td><td>${r.qty}</td><td class="n">${r.amount ? won(r.amount) : '무료'}</td></tr>`).join('')}
            <tr><td colspan="2">남는 돈</td><td class="n">${won(a.left)}</td></tr></table>
           <div class="meta" style="margin-top:6px">추정값입니다. 올린 뒤 고칠 수 있습니다.</div>
           <div style="height:8px"></div><button class="btn sm" id="bg-ok">이대로 판에 올리기</button>`
        : `<div class="meta" style="margin-top:8px"><b>0원 — 온라인 제출 대회</b>가 되고 관객 평가가 켜집니다. 올린 뒤 <b>제출 마감</b>을 정하세요.</div>
           <div style="height:8px"></div><button class="btn sm" id="bg-ok">온라인판으로 바꾸기</button>`;
      $('#bg-ok').onclick = async () => {
        try {
          const r = await api(`/events/${cur}/allocate`, { method: 'POST', body: { budget: +v } });
          flash(r.tier === 'zero' ? '온라인 제출 대회로 바꿨습니다. 관객 평가가 켜졌습니다 — 제출 마감을 정하세요'
            : `자리 ${r.made}장을 깔았습니다${r.kept ? ' · 손댄 ' + r.kept + '줄은 그대로' : ''}${r.skipped.length ? ' · 건너뜀 ' + r.skipped.map(needKind).join(',') + '(손으로 올린 자리 있음)' : ''}${r.over ? ' · ⚠️ 판 전체 합이 예산을 넘습니다' : ''}`, r.over);
          render();
        } catch (e) { flash(e.message, true); }
      };
    } catch (e) { flash(e.message, true); }
  };
  document.querySelectorAll('[data-need-amount-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.needAmountSave;
    const inp = document.querySelector(`[data-need-amount="${id}"]`);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/needs/${id}`, { method: 'PATCH', body: { amount: +inp.value } });
      flash('금액을 저장했습니다. 이 줄은 다시 나눠도 안 바뀝니다'); render();
    } catch (e) { flash(e.message, true); }
  });
  document.querySelectorAll('[data-need-price-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.needPriceSave;
    const inp = document.querySelector(`[data-need-price="${id}"]`);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/needs/${id}`, { method: 'PATCH', body: { price: +inp.value } });

  const surl = $('#s-url'), shint = $('#s-url-hint');
  if (surl && shint) {
    const REPO = /^https?:\/\/(www\.)?(github\.com|gitlab\.com|bitbucket\.org)\//i;
    const tell = () => {
      const v = surl.value.trim();

                  '제출', '링크', '설명', '점수', '심사'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;   // 쉼표·줄바꿈이 든 칸을 지킨다
    const body = d.rows.map(r =>
      [r.rank, r.name, r.contact, r.role, r.found,
       r.agreed ? '동의' : '', r.photo ? '동의' : '', r.came ? '왔음' : '',
       r.done ? '제출' : '미제출', r.url, r.note, r.score, r.judges].map(q).join(','));

    // 역슬래시가 한 겹씩 먹혀서 한 번 깨진 적이 있다.
    const BOM = String.fromCharCode(0xFEFF), NL = String.fromCharCode(13, 10);

    try {
      await api(`/people/${curPerson}`, { method: 'POST',
        body: { contact: c, handle: $('#pf-h').value.trim(), level: $('#pf-l').value } });
      localStorage.setItem('hackon.contact', c);
      flash('고쳤습니다');
    } catch (e) { flash(e.message, true); }
  };

  const sendNotice = async txt => {
    try {
      await api(`/events/${cur}/notice`, { method: 'POST', body: { notice: txt } });
      flash(txt ? '띄웠습니다. 큰 화면에 곧 뜹니다' : '내렸습니다');
    } catch (e) { flash(e.message, true); }
  };
  const ntgo = $('#nt-go');
  if (ntgo) ntgo.onclick = () => {
    const v = $('#nt-in').value.trim();
    if (!v) return flash('무엇을 알릴지 적어 주세요', true);
    sendNotice(v);
  };
  const ntoff = $('#nt-off');
  if (ntoff) ntoff.onclick = () => sendNotice('');
  document.querySelectorAll('[data-nt]').forEach(b => b.onclick = () => sendNotice(b.dataset.nt));

  /* 장소 문의 메일. 전화가 싫은 사람이 훨씬 많다. */
  document.querySelectorAll('[data-vmail]').forEach(b => b.onclick = async () => {
    const ev2 = (LIVE && cur) ? await api(`/events/${cur}`).catch(() => null) : null;
    const txt = mailFor('장소', 1, ev2)
      .replace('(인원)', localStorage.getItem('hackon.size') || '24')
      .replace('대관 문의드립니다', b.dataset.vmail + ' 대관 문의드립니다');
    const box = $('#f-mail');
    box.innerHTML = `<div class="card" style="border-color:#AECFB8;background:var(--ok-l)">
      <h3>${esc(b.dataset.place)}에 보낼 메일</h3>
      <div class="meta">받는 곳 주소는 <b>예약 페이지</b>에 있습니다.</div>
      <textarea id="f-mailtx" rows="16" style="font-size:13px;margin-top:9px">${esc(txt)}</textarea>
      <div style="height:9px"></div>
      <button class="btn sm" id="f-mailcp">복사</button>
    </div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#f-mailcp').onclick = async () => {
      try {
        await navigator.clipboard.writeText($('#f-mailtx').value);
        flash('복사했습니다');
      } catch { flash('복사가 안 됩니다. 직접 긁어서 복사해 주세요', true); }
    };
  });

  const varea = $('#v-area');
  if (varea) varea.onchange = () => { vArea = varea.value; render(); };

  const fn = $('#f-n');
  if (fn) fn.onchange = () => {
    localStorage.setItem('hackon.size', String(Math.max(1, +fn.value || 24)));
    render();
  };

  document.querySelectorAll('[data-mail]').forEach(b => b.onclick = async () => {
    const ev = (LIVE && cur) ? await api(`/events/${cur}`).catch(() => null) : null;
    const txt = mailFor(b.dataset.mail, b.dataset.cnt, ev);
    if (!txt) return flash('이 역할은 초안이 없습니다', true);
    const box = $('#f-mail');
    box.innerHTML = `<div class="card" style="border-color:#AECFB8;background:var(--ok-l)">
      <h3>${esc(b.dataset.mail)}에게 보낼 메일</h3>
      <div class="meta"><b>괄호 안을 채우고 한 줄은 직접 고치세요.</b> 받는 사람은 복사한 메일을 압니다.</div>
      <textarea id="f-mailtx" rows="16"
        style="font-size:13px;margin-top:9px">${esc(txt)}</textarea>
      <div style="height:9px"></div>
      <button class="btn sm" id="f-mailcp">복사</button>
    </div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#f-mailcp').onclick = async () => {
      try {
        await navigator.clipboard.writeText($('#f-mailtx').value);
        flash('복사했습니다. 메일에 붙여 넣으세요');
      } catch { flash('복사가 안 됩니다. 직접 긁어서 복사해 주세요', true); }
    };
  });

  document.querySelectorAll('[data-lead]').forEach(b => b.onclick = async () => {
    const name = b.dataset.name || prompt('어디에 연락하시겠습니까');
    if (!name) return;
    try {
      await api(`/events/${cur}/leads`, { method: 'POST',
        body: { kind: b.dataset.lead, name, how: b.dataset.how || '' } });
      flash('대장에 넣었습니다');
    } catch (e) { flash(e.message, true); }
  });

  const ladd = $('#l-add');
  if (ladd) ladd.onclick = async () => {
    const name = $('#l-name').value.trim();
    if (!name) return flash('이름을 넣어 주세요', true);
    try {
      await api(`/events/${cur}/leads`, { method: 'POST',
        body: { kind: $('#l-kind').value, name, how: $('#l-how').value.trim() } });
      flash('대장에 넣었습니다');
    } catch (e) { flash(e.message, true); }
  };

  /* 상태는 누를 때마다 한 칸씩 돈다. 고르는 칸을 따로 두면 아무도 안 누른다. */
  const STATES = ['보냄', '답장', '확정', '거절'];
  document.querySelectorAll('[data-state]').forEach(b => b.onclick = async () => {
    const next = STATES[(STATES.indexOf(b.dataset.now) + 1) % STATES.length];
    try {
      await api(`/leads/${b.dataset.state}`, { method: 'POST', body: { state: next } });
      render();
    } catch (e) { flash(e.message, true); }
  });
  document.querySelectorAll('[data-drop]').forEach(b => b.onclick = async () => {
    try {
      await api(`/leads/${b.dataset.drop}`, { method: 'POST', body: { remove: true } });
      flash('지웠습니다');
    } catch (e) { flash(e.message, true); }
  });

  /* 약속 하나를 눌렀다 뗄 때마다 그 협찬사의 지킨 목록을 통째로 다시 보낸다.
     칸 하나만 보내면 순서가 엉킬 수 있고, 어차피 다섯 개짜리 목록이다. */
  document.querySelectorAll('[data-pr]').forEach(b => b.onchange = async () => {
    const id = b.dataset.pr;
    const on = [...document.querySelectorAll(`[data-pr="${id}"]`)]
      .filter(x => x.checked).map(x => x.dataset.i).join(',');
    const pf = document.querySelector(`[data-proof="${id}"]`);
    try {
      await api(`/sponsors/${id}`, { method: 'POST',
        body: { done: on, proof: pf ? pf.value.trim() : '' } });
      render();
    } catch (e) { flash(e.message, true); }
  });
  document.querySelectorAll('[data-proof]').forEach(b => b.onchange = async () => {
    const id = b.dataset.proof;
    const on = [...document.querySelectorAll(`[data-pr="${id}"]`)]
      .filter(x => x.checked).map(x => x.dataset.i).join(',');
    try {
      await api(`/sponsors/${id}`, { method: 'POST', body: { done: on, proof: b.value.trim() } });
      flash(b.value.trim() ? '증빙을 넣었습니다' : '증빙을 비웠습니다');
    } catch (e) { flash(e.message, true); }
  });

  const xsum = $('#x-sum');
  if (xsum) xsum.onclick = async () => {
    const k = await api(`/events/${cur}/pack`);
    const n = k.numbers;
    const rows = [
      ['항목', '값', '설명'],
      ['대회', k.event.title, `${k.event.starts} ~ ${k.event.ends}`],
      ['주최', k.event.host, ''],
      ['참가 팀', n.teams, '신청한 팀'],
      ['온 팀', n.came, '당일 확인된 팀'],
      ['완주 팀', n.finished, '결과물을 낸 팀'],
      ['완주율', n.finishRate + '%', '완주 팀 / 참가 팀'],
      ['면접 연결', n.interview, '협찬사가 실제로 만난 건수'],
      ['도입 검토', n.adoption, '협찬사가 회의에 올린 건수'],
      ['채용', n.hired, ''],
      ['사후 지원 약속', n.promised, '행사 전에 정해 둔 건수'],
      ['사후 지원 이행', n.keptSupport, '실제로 봐 준 건수'],
      ['90일 뒤 물어본 팀', n.asked90, '2·6·12주 세 번 점검'],
      ['90일 뒤 이어가는 팀', n.alive90, ''],
      ['90일 생존율', n.aliveRate + '%', '이어가는 팀 / 물어본 팀'],
      ['링크 살아있음', n.liveDemo, '낸 결과물이 아직 열리는 팀'],
      [], ['협찬 약정 이행'], ['협찬사', '등급', '약속', '지킴', '증빙'],
    ];
    for (const sp of k.sponsors)
      for (const pr of sp.promises)
        rows.push([sp.name, sp.kind, pr.text, pr.done ? '지킴' : '아직', sp.proof || '']);
    rows.push([], [`참가자 구성 (${k.minCell}건 미만은 뭉침 · 개인 식별 정보 없음)`]);
    rows.push(['맡은 일', '팀 수']);
    for (const r of k.mix.role) rows.push([r.k, r.c]);
    rows.push(['어디서 왔나', '팀 수']);
    for (const r of k.mix.found) rows.push([r.k, r.c]);
    saveCsv(`${k.event.title}_협찬사용집계.csv`, rows);
    flash('집계를 내려받았습니다. 이름·연락처는 안 들어 있습니다');
  };

  const xlead = $('#x-lead');
  if (xlead) xlead.onclick = async () => {
    const r = await api(`/events/${cur}/consented`);
    if (!r.rows.length)
      return flash('협찬사 제공에 동의한 팀이 없습니다. 한 줄도 못 넘깁니다', true);
    saveCsv(`동의자연락처_${r.rows.length}팀.csv`,
      [['팀', '연락처', '맡은 일', '동의'],
       ...r.rows.map(x => [x.name, x.contact, x.role, '협찬사 제공 동의'])]);
    flash(`동의한 ${r.rows.length}팀만 내려받았습니다`);
  };

  /* 로고 파일 — 브라우저에서 320px 로 줄여 data: 주소로 보낸다. 큰 원본은 안 올린다 */
  const pfile = $('#p-file');
  if (pfile) pfile.onchange = () => {
    const f = pfile.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      P_LOGO_DATA = c.toDataURL('image/png'); URL.revokeObjectURL(url);
      $('#p-logopv').innerHTML = `<div class="qrline"><div class="qr" style="width:70px"><img src="${P_LOGO_DATA}" alt="" style="width:100%;height:auto;display:block"></div><div class="meta">이 파일로 들어갑니다.</div></div>`;
    };
    img.src = url;
  };
  const pfind = $('#p-find');
  if (pfind) pfind.onclick = async () => {
    const d = $('#p-dom').value.trim();
    if (!d) return flash('회사 홈페이지 주소를 넣어 주세요', true);
    try {
      const r = await api(`/logo?domain=${encodeURIComponent(d)}`);
      if (!r.ok) return flash('주소 모양이 아닙니다. openai.com 처럼 넣어 주세요', true);
      $('#p-logo').value = r.url;
      if (!$('#p-link').value.trim()) $('#p-link').value = 'https://' + r.domain;
      $('#p-logopv').innerHTML = `<div class="qrline">
        <div class="qr" style="width:70px"><img src="${esc(r.url)}" alt=""
          style="width:100%;height:auto;display:block"></div>
        <div class="meta">${r.good ? '이 로고로 들어갑니다.'
          : '<b>임시로 찾은 것입니다.</b> 작고 거칠 수 있습니다. 협찬사에게 받은 파일이 있으면 그 주소로 바꾸세요.'}
          </div></div>`;
    } catch (e) { flash(e.message, true); }
  };

  const padd = $('#p-add');
  if (padd) padd.onclick = async () => {
    const name = $('#p-name').value.trim();
    if (!name) return flash('회사 이름을 넣어 주세요', true);
    if ($('#p-logo').value.trim() && !$('#p-perm').checked)
      return flash('로고를 쓰기로 합의했는지 확인해 주세요', true);
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      const r = await api(`/events/${cur}/sponsors`, { method: 'POST',
        body: { name, kind: $('#p-kind').value, amount: $('#p-amt').value, domain: $('#p-dom').value.trim(),
                logo: $('#p-logo').value.trim(), link: $('#p-link').value.trim(), logoData: P_LOGO_DATA || undefined } });
      P_LOGO_DATA = '';
      flash(r.logo ? '협찬사를 넣었습니다. 로고도 붙었습니다' : '협찬사를 넣었습니다. 로고는 못 찾았습니다 — 파일로 올려 주세요');
    } catch (e) { flash(e.message, true); }
  };

  const oadd = $('#o-add');
  if (oadd) oadd.onclick = async () => {
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/events/${cur}/outcomes`, { method: 'POST',
        body: { kind: $('#o-kind').value, who: $('#o-who').value } });
      flash('기록했습니다');
    } catch (e) { flash(e.message, true); }
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

/* 로고를 누르면 처음으로. 공개·심사·보고서 화면에서는 그 대회 안에 머문다 —
   손님을 남의 운영 화면으로 떨어뜨리지 않는다. */
const home = document.getElementById('b-home');
if (home) home.onclick = () => {
  if (location.pathname !== '/app') { location.href = '/app'; return; }
  tab = 'home'; curTeam = ''; render();
};

/* 주소가 /e/<대회id> 면 읽기 전용 공개 화면으로 연다. 아래 탭과 편집 칸을 감춘다. */
const PRO = location.pathname.match(/^\/p\/([0-9a-f]{12})$/);
const PUB = location.pathname.match(/^\/e\/([a-z0-9]+)(\/report)?$/);
const JUD = location.pathname.match(/^\/j\/([a-z0-9]+)$/);
const VOT = location.pathname.match(/^\/v\/([a-z0-9]+)$/);
const TVM = location.pathname.match(/^\/tv\/([a-z0-9]+)$/);
/* /give 는 «줄 수 있는 것» 세 화면(첫 화면 입구가 온다).
   /give/<대회id> 는 그 대회의 협찬 안내 한 장 — 인스타 프로필에 거는 주소다. */
const GIV = location.pathname.match(/^\/give(?:\/([a-z0-9]+))?$/);
const ASKP = location.pathname === '/ask';
const PRB = location.pathname === '/problems';   // 문제 은행 — 올라온 문제를 대회 없이도 푼다
const RNK = location.pathname === '/rank';       // 기여 순위 — 백준 랭킹처럼   // «받는 사람» — 후원자·의뢰자가 주제·문제를 올리는 세 화면
const RCV = location.pathname.match(/^\/r\/([a-z0-9]+)$/);   // 받는 화면 /r/<id>?k=<열쇠>
const GFT = location.pathname.match(/^\/s\/([po]\d+)$/);   // 준 사람의 화면 /s/<ref>?k=<열쇠>
if (PRO) {
  curPerson = PRO[1];
  tab = 'prof';
  document.querySelector('nav').style.display = 'none';
}
else if (PUB || JUD || VOT || TVM) {
  cur = (PUB || JUD || VOT || TVM)[1];
  tab = TVM ? 'tv' : JUD ? 'judge' : VOT ? 'vote' : (PUB[2] ? 'report' : 'pub');
  document.querySelector('nav').style.display = 'none';
  /* 손님 화면. '서버 연결됨' 은 운영자 말이라 손님에게는 안 보인다. */
  document.body.classList.add('guest');
  /* 심사·투표 링크는 /j|v/<id>?k=<열쇠>. 열쇠를 받아 두면 다음에 주소만으로도 열린다. */
  /* 팀 링크(?t=열쇠)로 들어오면 «내 팀»을 되찾는다. 서버가 열쇠를 확인한 뒤에만 팀 id 를 준다 */
  if (PUB) { const tk = new URLSearchParams(location.search).get('t');
             if (tk) fetch('/api/events/' + cur + '/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tkey: tk }) })
               .then(r => r.ok ? r.json() : null).then(r => { if (!r) return;
                 try { localStorage.setItem('hackon.team.' + cur, r.id); localStorage.setItem('hackon.tkey.' + r.id, tk); } catch (_) {}
                 history.replaceState(null, '', location.pathname); render(); }).catch(() => {}); }
  if (JUD) { const k = new URLSearchParams(location.search).get('k');
             if (k) try { localStorage.setItem('hackon.jkey.' + cur, k); } catch (_) {} }
  if (VOT) { const k = new URLSearchParams(location.search).get('k');
             if (k) try { localStorage.setItem('hackon.vkey.' + cur, k); } catch (_) {} }
}
if (TVM) {
  document.body.classList.add('tv');
  /* 아무도 안 만져도 되게. 10초마다 스스로 새로 받는다. */
  setInterval(() => render(), 10000);
}
else if (PRB) { tab = 'problems'; document.querySelector('nav').style.display = 'none'; document.body.classList.add('guest'); }
else if (RNK) { tab = 'rank'; document.querySelector('nav').style.display = 'none'; document.body.classList.add('guest'); }
else if (GIV || ASKP) {
  tab = GIV ? 'give' : 'ask';
  /* cur 은 localStorage 에서 미리 채워져 있다. 대회 없는 /give 로 들어왔는데 그걸 그대로 두면
     지난번에 보던 남의 대회 협찬 안내가 뜬다. 주소에 있는 것만 믿는다. */
  if (GIV) cur = GIV[1] || '';
  document.querySelector('nav').style.display = 'none';
  document.body.classList.add('guest');
}
else if (RCV) {
  curReq = RCV[1]; tab = 'recv';
  document.querySelector('nav').style.display = 'none';
  document.body.classList.add('guest');
  const k = new URLSearchParams(location.search).get('k');
  if (k) { try { localStorage.setItem('hackon.rkey.' + curReq, k); } catch (_) {} history.replaceState(null, '', location.pathname); }
  RKEY = rkeyOf(curReq);
}
else if (GFT) {
  curGift = GFT[1]; tab = 'gift';
  document.querySelector('nav').style.display = 'none';
  document.body.classList.add('guest');
  const k = new URLSearchParams(location.search).get('k');
  if (k) { try { localStorage.setItem('hackon.pkey.' + curGift, k); } catch (_) {} history.replaceState(null, '', location.pathname); }   // 열쇠는 주소창·기록에 안 남긴다
  GKEY = localStorage.getItem('hackon.pkey.' + curGift) || '';
}
else if (location.hash.length > 1 && new URLSearchParams(location.search).get('k')) {
  /* 비상용 뒷문 — 서비스 운영자가 서버에서 꺼낸 대회 열쇠를 주소로 넣는다. 화면 어디에도 안내하지 않는다 */
  cur = location.hash.slice(1); try { localStorage.setItem('hackon.okey.' + cur, new URLSearchParams(location.search).get('k')); } catch (_) {}
  history.replaceState(null, '', location.pathname + location.hash); tab = 'board';
}
else if (new URLSearchParams(location.search).get('req')) { MAKE_REQ = new URLSearchParams(location.search).get('req'); tab = 'make'; history.replaceState(null, '', location.pathname); }
else if (location.hash.length > 1) { cur = location.hash.slice(1); tab = 'board'; }

/* 친구에게 보내기 — 폰이면 공유 시트, 아니면 주소 복사. 톡방 한 번이 광고비보다 싸다 */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('#share-ev'); if (!b) return; ev.preventDefault();
  const url = location.origin + '/e/' + cur, text = `${b.dataset.title} — 같이 갈래? 혼자 와도 팀이 생겨. 코딩 몰라도 됨. ${url}`;
  try { if (navigator.share) { await navigator.share({ title: b.dataset.title, text, url }); return; } } catch (_) { return; }
  try { await navigator.clipboard.writeText(text); flash('복사했습니다. 톡방에 붙여 넣으세요'); } catch (_) { flash(url); }
});
/* 문제 은행 «풀었습니다» — 화면 어디서 눌러도 이 하나가 받는다 */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-solve]'); if (b) { const box = document.getElementById('sol-' + b.dataset.solve); if (box) { box.hidden = !box.hidden; } return; }
  const g = ev.target.closest('[data-sol-go]'); if (!g) return;
  const box = g.closest('.solbox'); const v = k => (box.querySelector(`[data-sol-${k}]`) || {}).value || '';
  if (!v('name').trim()) return flash('이름을 넣어 주세요', true);
  if (!/^https?:\/\//i.test(v('url').trim())) return flash('https:// 로 시작하는 주소를 넣어 주세요', true);
  try {
    await api(`/requests/${g.dataset.solGo}/solutions`, { method: 'POST', body: { name: v('name').trim(), url: v('url').trim(), note: v('note').trim(), contact: v('contact').trim() } });
    const solved = JSON.parse(localStorage.getItem('hackon.solved') || '[]'); solved.push(g.dataset.solGo); localStorage.setItem('hackon.solved', JSON.stringify(solved));
    flash('보냈습니다. 낸 분이 판정하면 그쪽 화면에 뜹니다'); render();
  } catch (e) { flash(e.message, true); }
});
const wideBtn = document.getElementById('b-wide');
wideBtn.onclick = () => {
  localStorage.setItem('hackon.wide',
    document.body.classList.contains('wide') ? 'off' : 'on');
  applyWide();
};
applyWide();
addEventListener('resize', applyWide);
render();
if (LIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
