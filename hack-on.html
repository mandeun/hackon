  /* 슬라이더를 끌면 옆 숫자와 채워진 길이가 따라온다. 화면을 다시 그리지 않는다. */
  document.querySelectorAll('.sl input[type=range]').forEach(r => {
    const num = r.parentElement.querySelector('b');
    r.oninput = () => { num.textContent = r.value; r.style.setProperty('--p', r.value + '%'); };

  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => {
    const box = document.querySelector('.' + b.dataset.tag);
    if (!box) return;
    const line = b.dataset.txt;
    if (box.value.includes(line)) return;
    box.value = (box.value.trim() ? box.value.trim() + ' ' : '') + line + '.';
    box.focus();
  });

  const jskip = $('#j-skip');
  if (jskip) jskip.onclick = async () => {

    const i = d.teams.findIndex(x => String(x.id) === String(jTeam));
    jTeam = d.teams[(i + 1) % d.teams.length].id;
    render();
  };
  const jall = $('#j-all');

    jTeam = r.dataset.jgo; jAll = false; render();

  const lst = $('#b-list'), unlst = $('#b-unlist');

      await api(`/events/${cur}/list`, { method: 'POST', body: { list: on } });
      flash(on ? '첫 화면 목록에 올렸습니다' : '목록에서 내렸습니다');
    } catch (e) { flash(e.message, true); }
  };
  if (lst) lst.onclick = () => setList(true);
  if (unlst) unlst.onclick = () => setList(false);

  const op = $('#b-open');
  if (op) op.onclick = async () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    try {
      const now = op.textContent.includes('닫기');
      const r = await api(`/events/${cur}/open`, { method: 'POST', body: { open: !now } });
      flash(r.opened ? '결과를 공개했습니다' : '결과 공개를 닫았습니다');
    } catch (e) { flash(e.message, true); }
  };

    fetch(`/api/events/${cur}/dump`, { headers: { 'x-okey': okeyOf(cur) } })
      .then(r => r.ok ? r.blob() : Promise.reject(new Error('열쇠가 필요합니다')))
      .then(bl => { const a = document.createElement('a');
                    a.href = URL.createObjectURL(bl);
                    a.download = `hackon-${cur}.json`; a.click(); URL.revokeObjectURL(a.href);
                    flash('내려받았습니다'); })
      .catch(e => flash(e.message, true));

  const pr = $('#b-print');
  if (pr) pr.onclick = () => window.print();

  const rep2 = $('#b-report');
  if (rep2) rep2.onclick = () => {
    if (LIVE) location.href = `/e/${cur}/report`;
    else { tab = 'report'; render(); }

  const ext = $('#b-ext');
  if (ext) ext.onclick = async () => {
    if (!LIVE) return flash('데모에서는 안 됩니다', true);
    try {
      const r = await api(`/events/${cur}/extend`, { method: 'POST', body: { minutes: 30 } });
      flash(`마감을 ${r.minutes}분 미뤘습니다`);
    } catch (e) { flash(e.message, true); }
  };

  const copyAny = async (sel, msg) => {
    const t = $(sel).textContent.trim();
    // 보안 문맥이 아니면 clipboard 가 없다. 그때는 옛날 방식으로 떨어진다
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    flash(msg);
  };
  const copy = $('#b-copy');
  if (copy) copy.onclick = () => copyAny('.share', '공개 주소를 복사했습니다');
  const copyj = $('#b-copyj');
  if (copyj) copyj.onclick = () => copyAny('#jlink', '심사 주소를 복사했습니다');
  const copyt = $('#b-copyt');

  /* 주소를 복사해서 어딘가에 붙이는 것이 아니라 그냥 여는 것이다. 새 창으로 띄운다. */

  if (tvb) tvb.onclick = () => window.open(`${shareBase()}/tv/${cur}`, '_blank');
  const jb = $('#b-jopen');
  if (jb) jb.onclick = () => window.open(`${shareBase()}/j/${cur}`, '_blank');

  const csv = $('#b-csv');
  if (csv) csv.onclick = async () => {
    if (!LIVE) return flash('데모에서는 못 내려받습니다', true);
    const d = await api(`/events/${cur}/board`);
    const head = ['순위', '팀', '연락처', '역할', '유입', '개인정보동의', '촬영동의', '왔음',
                  '제출', '링크', '설명', '점수', '심사'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;   // 쉼표·줄바꿈이 든 칸을 지킨다
    const body = d.rows.map(r =>
      [r.rank, r.name, r.contact, r.role, r.found,
       r.agreed ? '동의' : '', r.photo ? '동의' : '', r.came ? '왔음' : '',
       r.done ? '제출' : '미제출', r.url, r.note, r.score, r.judges].map(q).join(','));
    // 엑셀은 BOM 이 없으면 한글을 깬다. 줄바꿈은 CRLF 로 준다.
    // 이스케이프 대신 문자코드를 쓴다 — 이 파일이 스크립트로 여러 번 고쳐지는데
    // 역슬래시가 한 겹씩 먹혀서 한 번 깨진 적이 있다.
    const BOM = String.fromCharCode(0xFEFF), NL = String.fromCharCode(13, 10);
    const blob = new Blob([BOM + [head.map(q).join(','), ...body].join(NL)],
                          { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${d.event.title}_명단.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  };

  /* 표준 진행표를 넣어 준다. 넣고 나서 직접 고치면 된다 -
     빈 칸에서 시작하는 것과 고칠 것이 있는 상태에서 시작하는 것은 완전히 다르다. */
  const edraft = $('#e-draft');
  if (edraft) edraft.onclick = async () => {
    const teams = (await api(`/events/${cur}/board`)).rows.length || 6;
    const d = await api(`/draft?start=${$('#e-t1').value}&end=${$('#e-t2').value}&teams=${teams}`);
    planFill(d.rows);
    /* flash 는 화면을 다시 그린다. 방금 채운 칸이 통째로 날아간다 - 여기서는 부르면 안 된다. */
    $('#e-warn').innerHTML = d.tight
      ? nudge('시간이 빠듯합니다. 끝 시각을 늦춰 보세요')
      : `<div class="meta">${teams}팀 기준입니다. 고치고 아래 ‘저장’ 을 누르세요.</div>`;
    if (!d.tight) checkPlan();
  };

  /* 고칠 때마다 표준에서 벗어난 곳만 알려 준다. 맞으면 아무 말도 안 한다. */
  async function checkPlan() {
    const box = $('#e-warn'); if (!box) return;
    const plan = planRead();
    try {
      const teams = (await api(`/events/${cur}/board`)).rows.length || 1;
      const w = await api(`/plan-check`, { method: 'POST', body: { plan, teams } });
      box.innerHTML = w.warn.map(x => nudge(esc(x))).join('');
    } catch { box.innerHTML = ''; }
  }
  const eplan = $('#e-plan');
  if (eplan) {
    planFill(PLAN_NOW);
    eplan.addEventListener('change', checkPlan);
    checkPlan();
  }
  const eadd = $('#e-add');
  if (eadd) eadd.onclick = () => {
    /* 마지막 순서 30분 뒤에 새 줄을 놓는다. 빈 시각을 주면 어디에 넣을지 또 생각해야 한다. */
    const rows = planRead();
    const last = rows.length ? rows[rows.length - 1].at : '10:00';
    const m = last.match(/^(\d{1,2}):(\d{2})$/);
    const t = m ? (+m[1] * 60 + +m[2] + 30) % 1440 : 600;
    const hh = String(Math.floor(t / 60)).padStart(2, '0');
    const mm = String(t % 60).padStart(2, '0');
    const el = planRow(`${hh}:${mm}`, '');
    $('#e-plan').appendChild(el);
    planRedraw();
    el.querySelector('.what').focus();
  };

  /* 이어가기 - 누를 때마다 안 물어봄 → 이어감 → 중단 순으로 돈다. */
  document.querySelectorAll('[data-chk]').forEach(b => b.onclick = async () => {
    const now = b.textContent.trim();
    const body = now === '·'      ? { alive: 1, live: 1 }
               : now === '이어감' ? { alive: 0, live: 0 }
               :                    { remove: true };
    try {
      await api(`/teams/${b.dataset.chk}/check`,
        { method: 'POST', body: { week: +b.dataset.w, ...body } });
      render();
    } catch (e) { flash(e.message, true); }
  });

  /* 별점 - 누르면 그 자리까지 채워진다. 화면을 다시 그리지 않는다. */
  document.querySelectorAll('[data-star]').forEach(box => {
    box.querySelectorAll('button').forEach(btn => btn.onclick = () => {
      const v = +btn.dataset.i;
      box.dataset.v = v;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.i <= v));
    });
  });
  const starOf = name => {
    const el = document.querySelector(`[data-star="${name}"]`);
    return el ? +el.dataset.v : 0;
  };

  /* 대회 평가. 필수가 아니다 - 안 해도 아무 일도 안 생긴다. */
  const rvgo = $('#rv-go');
  if (rvgo) rvgo.onclick = async () => {
    const c = $('#rv-c').value.trim();
    if (!c) return flash('참가할 때 쓴 연락처를 넣어 주세요', true);
    if (!starOf('run') && !starOf('worth')) return flash('별을 하나라도 눌러 주세요', true);
    try {
      await api(`/events/${cur}/rate`, { method: 'POST', body: {
        contact: c, run: starOf('run'), worth: starOf('worth'), note: $('#rv-n').value.trim() } });
      localStorage.setItem('hackon.contact', c);
      flash('남겨 주셔서 고맙습니다');
    } catch (e) { flash(e.message, true); }
  };

  /* 팀 자리. 이름을 비우고 누르면 게스트로 자리만 잡는다. */
  const stadd = $('#st-add');

    const v = $('#st-n').value.trim();

  document.querySelectorAll('[data-seatdel]').forEach(b => b.onclick = async () => {

  document.querySelectorAll('[data-mail]').forEach(b => b.onclick = async () => {

      <textarea id="f-mailtx" rows="16"
        style="font-size:13px;margin-top:9px">${esc(txt)}</textarea>
      <div style="height:9px"></div>
      <button class="btn sm" id="f-mailcp">복사</button>
    </div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#f-mailcp').onclick = async () => {
      try {
        await navigator.clipboard.writeText($('#f-mailtx').value);
        flash('복사했습니다. 메일에 붙여 넣으세요');
      } catch { flash('복사가 안 됩니다. 직접 긁어서 복사해 주세요', true); }
    };
  });

  document.querySelectorAll('[data-lead]').forEach(b => b.onclick = async () => {
    const name = b.dataset.name || prompt('어디에 연락하시겠습니까');

    try {
      await api(`/events/${cur}/leads`, { method: 'POST',

  const ladd = $('#l-add');

    const name = $('#l-name').value.trim();

      await api(`/events/${cur}/leads`, { method: 'POST',

      flash('대장에 넣었습니다');
    } catch (e) { flash(e.message, true); }
  };

  /* 상태는 누를 때마다 한 칸씩 돈다. 고르는 칸을 따로 두면 아무도 안 누른다. */
  const STATES = ['보냄', '답장', '확정', '거절'];
  document.querySelectorAll('[data-state]').forEach(b => b.onclick = async () => {
    const next = STATES[(STATES.indexOf(b.dataset.now) + 1) % STATES.length];
    try {

      render();
    } catch (e) { flash(e.message, true); }
  });
  document.querySelectorAll('[data-drop]').forEach(b => b.onclick = async () => {
    try {
      await api(`/leads/${b.dataset.drop}`, { method: 'POST', body: { remove: true } });
      flash('지웠습니다');
    } catch (e) { flash(e.message, true); }

  /* 약속 하나를 눌렀다 뗄 때마다 그 협찬사의 지킨 목록을 통째로 다시 보낸다.
     칸 하나만 보내면 순서가 엉킬 수 있고, 어차피 다섯 개짜리 목록이다. */
  document.querySelectorAll('[data-pr]').forEach(b => b.onchange = async () => {
    const id = b.dataset.pr;
    const on = [...document.querySelectorAll(`[data-pr="${id}"]`)]
      .filter(x => x.checked).map(x => x.dataset.i).join(',');
    const pf = document.querySelector(`[data-proof="${id}"]`);
    try {
      await api(`/sponsors/${id}`, { method: 'POST',
        body: { done: on, proof: pf ? pf.value.trim() : '' } });
      render();
    } catch (e) { flash(e.message, true); }

  document.querySelectorAll('[data-proof]').forEach(b => b.onchange = async () => {
    const id = b.dataset.proof;
    const on = [...document.querySelectorAll(`[data-pr="${id}"]`)]
      .filter(x => x.checked).map(x => x.dataset.i).join(',');
    try {
      await api(`/sponsors/${id}`, { method: 'POST', body: { done: on, proof: b.value.trim() } });

  const xsum = $('#x-sum');
  if (xsum) xsum.onclick = async () => {

    const rows = [

      ['대회', k.event.title, `${k.event.starts} ~ ${k.event.ends}`],
      ['주최', k.event.host, ''],
      ['참가 팀', n.teams, '신청한 팀'],
      ['온 팀', n.came, '당일 확인된 팀'],
      ['완주 팀', n.finished, '결과물을 낸 팀'],
      ['완주율', n.finishRate + '%', '완주 팀 / 참가 팀'],
      ['면접 연결', n.interview, '협찬사가 실제로 만난 건수'],
      ['도입 검토', n.adoption, '협찬사가 회의에 올린 건수'],
      ['채용', n.hired, ''],
      ['사후 지원 약속', n.promised, '행사 전에 정해 둔 건수'],
      ['사후 지원 이행', n.keptSupport, '실제로 봐 준 건수'],
      ['90일 뒤 물어본 팀', n.asked90, '2·6·12주 세 번 점검'],

      ['링크 살아있음', n.liveDemo, '낸 결과물이 아직 열리는 팀'],
      [], ['협찬 약정 이행'], ['협찬사', '등급', '약속', '지킴', '증빙'],
    ];

    for (const r of k.mix.found) rows.push([r.k, r.c]);

  const xlead = $('#x-lead');
  if (xlead) xlead.onclick = async () => {
    const r = await api(`/events/${cur}/consented`);
    if (!r.rows.length)
      return flash('협찬사 제공에 동의한 팀이 없습니다. 한 줄도 못 넘깁니다', true);

          : '<b>임시로 찾은 것입니다.</b> 작고 거칠 수 있습니다. 협찬사에게 받은 파일이 있으면 그 주소로 바꾸세요.'}

        body: { kind: $('#o-kind').value, who: $('#o-who').value } });
      flash('기록했습니다');
    } catch (e) { flash(e.message, true); }
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

/* 로고를 누르면 처음으로. 공개·심사·보고서 화면에서는 그 대회 안에 머문다 —
   손님을 남의 운영 화면으로 떨어뜨리지 않는다. */
const home = document.getElementById('b-home');
if (home) home.onclick = () => {
  if (location.pathname !== '/app') { location.href = '/app'; return; }
  tab = 'home'; curTeam = ''; render();
};

/* 주소가 /e/<대회id> 면 읽기 전용 공개 화면으로 연다. 아래 탭과 편집 칸을 감춘다. */
const PRO = location.pathname.match(/^\/p\/([0-9a-f]{12})$/);
const PUB = location.pathname.match(/^\/e\/([a-z0-9]+)(\/report)?$/);
const JUD = location.pathname.match(/^\/j\/([a-z0-9]+)$/);
const TVM = location.pathname.match(/^\/tv\/([a-z0-9]+)$/);
if (PRO) {
  curPerson = PRO[1];
  tab = 'prof';
  document.querySelector('nav').style.display = 'none';
}
else if (PUB || JUD || TVM) {
  cur = (PUB || JUD || TVM)[1];
  tab = TVM ? 'tv' : JUD ? 'judge' : (PUB[2] ? 'report' : 'pub');
  document.querySelector('nav').style.display = 'none';
}
if (TVM) {
  document.body.classList.add('tv');
  /* 아무도 안 만져도 되게. 10초마다 스스로 새로 받는다. */
  setInterval(() => render(), 10000);
}
else if (location.hash.length > 1) { cur = location.hash.slice(1); tab = 'board'; }

const wideBtn = document.getElementById('b-wide');
wideBtn.onclick = () => {
  localStorage.setItem('hackon.wide',
    document.body.classList.contains('wide') ? 'off' : 'on');
  applyWide();
};
applyWide();
addEventListener('resize', applyWide);
render();
if (LIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
