<!doctype html>
<!-- ┌─ 편집 구역 ────────────────────────────────────────────────┐
     │ AGENT-EDIT : 화면 마크업 · CSS · 렌더 함수 · 예시 데이터    │
     │ ASK-FIRST  : api() 와 LIVE 분기 — 승인 없이 지우지 않는다   │
     └───────────────────────────────────────────────────────────┘
     라켓온과 같은 규칙. 파일을 통째로 새로 짜면 서버 호출이 소리 없이 사라진다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141824">
<link rel="manifest" href="/manifest.webmanifest">
<title>HACK:ON — 누구나 5분 만에 대회를 연다</title>
<style>
:root{
  /* mandeun 색을 그대로 쓴다. 밝은 방에서 오래 보는 화면이라 크림 종이에 올리브 글자다.
     차가운 남색·회색은 다 걷어냈다 - 몇 시간 보면 눈이 시리다. */
  --navy:#141824; --navy-d:#0C0F18; --navy-l:#E8EDFB;   /* 먹. 큰 화면 바탕과 제목 */
  --acc:#2350F5;   /* 켜짐 파랑. 켜진 점·주 버튼·링크에만 쓴다 (BRAND.md) */
  --ok:#12A36B; --ok-l:#E3F5EC; --warn:#E8A317; --warn-l:#FDF3DC; --bad:#D6453D;
  --ink:#141824; --ink2:#4A5163; --ink3:#8A91A3;
  --rule:#DDE2EC; --bg:#F4F6FA; --bg2:#EAEEF5;
  --kr:'Pretendard','Apple SD Gothic Neo','맑은 고딕','Malgun Gothic',sans-serif; --r:12px;
  --paper:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--kr);background:#E4E8F0;color:var(--ink);font-size:15px;
     display:flex;justify-content:center;min-height:100vh;
     -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
input,select,textarea{border:1px solid var(--rule);border-radius:9px;padding:9px 11px;width:100%;background:#fff}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#app{width:100%;max-width:460px;background:var(--paper);min-height:100vh;
     box-shadow:0 8px 40px rgba(43,51,40,.13);display:flex;flex-direction:column}

/* PC 모드. 폰 폭 그대로 두면 모니터에서 가운데 기둥 하나가 된다.
   행사장 큰 화면(body.tv)은 원래 전체 폭이라 여기서 제외한다. */
body.wide:not(.tv) #app{max-width:1120px}
/* 격자로 두 칸을 만들면 한 줄의 높이가 큰 카드에 맞춰져 옆칸에 구멍이 크게 남는다.
   신문처럼 단을 나누면 카드가 알아서 채워진다. break-inside 로 카드가 잘리는 것만 막는다. */
body.wide:not(.tv) main{columns:2;column-gap:24px;padding:22px 22px 26px}
body.wide:not(.tv) main > *{break-inside:avoid}
body.wide:not(.tv) main > h2,
body.wide:not(.tv) main > h3,
body.wide:not(.tv) main > table,
body.wide:not(.tv) main > .stat{column-span:all}
body.wide:not(.tv) main > h2 + .sub{column-span:all}
body.wide:not(.tv) nav{justify-content:center}
/* 보고서는 위에서 아래로 읽는 문서다. 두 단으로 갈리면 읽는 순서가 무너지고,
   인쇄하면 카드가 단 경계에서 잘린다. */
body.doc main{columns:auto !important}
body.wide:not(.tv) nav button{flex:none;min-width:132px}

/* QR. 찍으면 바로 열린다 — 링크를 따로 보내거나 부르지 않아도 된다. */
.qrline{display:flex;gap:11px;align-items:center;margin-top:9px}
.qr{width:96px;flex:none;background:#fff;border:1px solid var(--rule);
    border-radius:9px;padding:5px;line-height:0}
.qr svg{display:block;width:100%;height:auto}
.qr.big{width:20vh;border-color:#44503E;background:#fff}

/* 협찬 로고 띠. 개인이 후원을 받았을 때 돌려줄 수 있는 실물이다. */
/* 표준에서 벗어난 값. 설명 대신 색으로 알린다. */
/* 진행표. 왼쪽에 시간 축을 세우고 한 줄이 카드 하나가 된다. */
.plan{position:relative;padding-left:15px;margin-top:4px}
.plan::before{content:'';position:absolute;left:4px;top:12px;bottom:12px;width:2px;
  background:var(--rule);border-radius:2px}
.prow{position:relative;display:flex;gap:7px;align-items:center;margin-bottom:7px}
.prow::before{content:'';position:absolute;left:-15px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--paper);
  border:2px solid var(--ink3)}
.prow.key::before{border-color:var(--navy);background:var(--navy)}
.prow.hot::before{border-color:var(--bad);background:var(--bad)}
.prow input[type=time]{width:94px;flex:none;padding:8px 5px;font-size:14px;
  font-variant-numeric:tabular-nums}
/* 시계 아이콘이 칸을 다 먹는다. 눌러서 고르는 것은 그대로 된다. */
.prow input[type=time]::-webkit-calendar-picker-indicator{display:none}
.prow .len{margin-left:auto}
.prow input.what{flex:1;min-width:0}
.prow .len{flex:none;width:4.4em;text-align:right;font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.prow .del{flex:none;width:26px;color:var(--ink3);font-size:19px;line-height:1}
.prow .del:hover{color:var(--bad)}

/* 확성기. 벽에서도 읽혀야 하니 크고 노랗게. */
.notice{background:#FFF4D6;border:1px solid #E8C766;border-radius:11px;padding:12px 14px;
  font-weight:700;color:#6B4A05;margin-bottom:12px;line-height:1.5}
.tvnotice{background:#F4C24B;color:#1A1400;border-radius:1.2vh;padding:1.6vh 2vw;
  font-size:3.4vh;font-weight:800;margin-bottom:1.6vh;line-height:1.3}

/* 팀 자리. 라켓온의 빈자리 방식이다 - 채워진 자리와 빈 자리가 한눈에 보인다. */
.seats{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-top:8px}
.seat{border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:12.5px;
  background:#fff;white-space:nowrap}
.seat.g{border-style:dashed;color:var(--ink3)}
.seat.free{border-style:dashed;border-color:var(--ok);color:var(--ok);font-weight:700}
/* 별점. 누르는 것 말고 다른 일을 시키지 않는다. */
.stars{display:flex;gap:4px;margin-top:5px}
.stars button{font-size:26px;line-height:1;color:var(--rule);padding:2px}
.stars button.on{color:#E8A33D}

/* 심사 - 손가락으로 끌어서 점수를 준다. 폰에서 숫자를 치는 것보다 훨씬 빠르다. */
.sl{display:flex;align-items:center;gap:11px;margin-top:5px}
.sl input[type=range]{flex:1;appearance:none;height:6px;border-radius:3px;padding:0;
  background:linear-gradient(90deg,var(--navy) var(--p,70%),var(--rule) var(--p,70%))}
.sl input[type=range]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;
  border-radius:50%;background:var(--navy);border:3px solid #fff;
  box-shadow:0 1px 5px rgba(43,51,40,.35);cursor:pointer}
.sl b{width:2.6em;text-align:right;font-size:17px;font-variant-numeric:tabular-nums}
/* 추천 태그. 누르면 아래 칸에 문장이 들어간다. 빈 칸을 마주하면 아무도 안 쓴다. */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags button{border:1px solid var(--rule);background:#fff;border-radius:999px;
  padding:6px 11px;font-size:12.5px;color:var(--ink2)}
.tags button:hover{border-color:var(--navy);color:var(--navy)}
.jbar{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
.jbar .grow{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.jbar .grow i{display:block;height:100%;background:var(--ok)}

/* 놓치면 안 되는 줄. 참가자가 표를 훑을 때 눈이 여기 먼저 간다. */
tr.row-hot td{color:var(--bad);font-weight:800}
tr.row-key td{color:var(--navy);font-weight:700}
.off{color:var(--warn);font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.55}
.off b{color:var(--bad)}
.logos{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.logos > *{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#fff;
     border:1px solid var(--rule);border-radius:10px;text-decoration:none;color:inherit;
     font-weight:700;font-size:13px}
.logos img{height:24px;width:auto;max-width:120px;display:block;object-fit:contain}
.tvlogos{display:flex;flex-wrap:wrap;gap:1.4vw;align-items:center}
.tvlogos > *{display:flex;align-items:center;gap:.7vw;font-size:1.9vh;font-weight:700;
     color:#C9D3BE;text-decoration:none}
.tvlogos img{height:3.4vh;width:auto;display:block;object-fit:contain;
     background:#fff;border-radius:5px;padding:3px}

header{padding:14px 16px 0;border-bottom:1px solid var(--rule);flex:none;background:var(--paper)}
.hrow{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.logo{color:var(--navy);display:flex;background:none;padding:0;border-radius:6px;
      transition:opacity .15s}
.logo:hover{opacity:.55}
.logo:active{opacity:.35}
.logo svg{height:19px;display:block}
.chip{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--bg2);color:var(--ink3)}
.chip.live{background:var(--ok-l);color:var(--ok);font-weight:700}

main{flex:1;overflow:auto;padding:20px 16px 24px}
/* 화면마다 큰 한 문장. 레퍼런스들이 전부 이걸로 시작한다. */
h2{font-size:23px;margin:0 0 6px;letter-spacing:-.035em;line-height:1.25;font-weight:800}
.sub{color:var(--ink2);font-size:13px;margin-bottom:18px;line-height:1.7}
/* 누르면 열리는 카드. 아무 표시가 없으면 아무도 안 누른다. */
.card[data-open]{cursor:pointer;position:relative;padding-right:34px;transition:border-color .12s}
.card[data-open]:hover{border-color:var(--navy)}
.card[data-open]::after{content:'›';position:absolute;right:14px;top:50%;
  transform:translateY(-50%);font-size:26px;color:var(--ink3);line-height:1}
.card{border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:10px;
      background:var(--bg)}
.card h3{font-size:15px;margin-bottom:3px;letter-spacing:-.02em}
.meta{font-size:12.5px;color:var(--ink3);line-height:1.7}
/* 나란한 숫자. 60fps 가 항목 옆에 작은 수를 위로 올려 붙인다 */
.sup{font-size:10px;vertical-align:super;color:var(--ink3);margin-left:2px;font-weight:700}
/* 안내는 화면 위에 겹쳐 띄운다. 화면을 다시 그리면 사용자가 쓰던 칸이 날아간다. */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:9;
       max-width:420px;width:calc(100% - 32px);pointer-events:none}
#toast div{border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;
           box-shadow:0 6px 20px rgba(43,51,40,.16)}
/* 접어 둔다. 지금 안 쓰는 것을 다 펼쳐 놓으면 아무것도 안 보이는 것과 같다.
   브라우저가 원래 해 주는 것이라 자바스크립트가 필요 없다. */
details{border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);margin-bottom:10px}
details>summary{padding:13px 14px;font-weight:700;font-size:14.5px;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:7px;letter-spacing:-.02em}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'＋';margin-left:auto;color:var(--ink3);font-weight:400;font-size:15px}
details[open]>summary::after{content:'－'}
details>summary:hover{color:var(--navy)}
details .in{padding:0 14px 14px}
details .in>.card{border:0;padding:0;margin:0;background:none}
.when{font-size:11px;color:var(--ink3);font-weight:600;margin-left:2px}

/* 행사장 큰 화면. 여기만 검은 바탕이고 글씨가 크다.
   멀리서 보이는 것이 전부라 다른 화면의 규칙을 따르지 않는다. */
body.tv{background:#2B3328;display:block}
body.tv #app{max-width:none;background:#2B3328;box-shadow:none;color:#F0ECDC;
             height:100vh;min-height:0}
body.tv header,body.tv nav,body.tv #toast{display:none}
/* main 에 height 를 또 주면 #app 이 100vh 보다 커져서 아래가 빈다. flex 로만 채운다. */
body.tv main{padding:3.2vh 3vw;overflow:hidden;flex:1;min-height:0;
             display:flex;flex-direction:column}
.tvwrap{display:flex;flex-direction:column;height:100%;gap:2.4vh}
.tvtop{display:flex;align-items:baseline;gap:1.4vw}
.tvtitle{font-size:3.4vh;font-weight:800;letter-spacing:-.03em}
.tvhost{font-size:1.9vh;color:#9DAB92}
.tvmid{display:flex;gap:2.4vw;flex:1;min-height:0}
.tvbig{flex:1.15;display:flex;flex-direction:column;justify-content:center}
.tvlabel{font-size:2vh;color:#9DAB92;letter-spacing:.02em;margin-bottom:.6vh}
.tvclock{font-size:15vh;font-weight:800;line-height:.95;letter-spacing:-.05em;
         font-variant-numeric:tabular-nums}
.tvclock.hot{color:#FF7A4D}
.tvclock.over{color:#FF5A5A}
.tvside{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.tvnow{background:#3B4537;border-radius:1.4vh;padding:2vh 2vw}
.tvnow b{display:block;font-size:4.2vh;font-weight:800;line-height:1.15;letter-spacing:-.03em}
.tvnext{font-size:2vh;color:#9DAB92;margin-top:.8vh}
.tvsub{font-size:2.6vh;line-height:1.5;color:#C7CDE4}
.tvsub em{font-style:normal;color:#fff;font-weight:800}
.tvbot{display:flex;align-items:center;gap:2vw;border-top:1px solid #44503E;padding-top:2vh}
/* 오프라인 행사에서 제일 많이 나오는 질문이다. 늘 떠 있어야 한다. */
.tvwifi{font-family:Consolas,monospace;font-size:2.4vh;font-weight:700;color:#C9D3BE;
        border-top:1px solid #44503E;padding-top:1.4vh;margin-top:1vh}
.tvwifi span{font-family:var(--kr);font-size:1.6vh;color:#8B9A80;margin-right:1vw;font-weight:400}
.tvaddr{font-family:Consolas,monospace;font-size:3.4vh;font-weight:700;letter-spacing:-.02em}
.tvaddr span{display:block;font-size:1.7vh;color:#9DAB92;font-family:var(--kr);
             font-weight:600;letter-spacing:0}
.tvrank{margin-left:auto;display:flex;gap:1.6vw}
.tvrank div{text-align:right}
.tvrank b{display:block;font-size:2.8vh;font-weight:800}
.tvrank span{font-size:1.6vh;color:#9DAB92}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
.btn{background:var(--navy);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;
     width:100%;text-align:center;transition:opacity .12s}
.btn:hover{opacity:.88}
.btn:active{opacity:.75}
.btn.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:7px 11px;font-size:13px;width:auto;border-radius:8px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--navy-l);color:var(--navy);font-weight:700}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.stat{display:flex;gap:8px;margin:12px 0}
.stat div{flex:1;border:1px solid var(--rule);border-radius:10px;padding:9px 10px;background:var(--bg2)}
.stat b{display:block;font-size:22px;color:var(--navy);line-height:1.15;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:left}
th{color:var(--ink3);font-weight:700;font-size:12px}
td.n,th.n{text-align:right}
.err{background:#FCF1F1;color:var(--bad);border:1px solid #F0D6D6;border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:13px}
.ok-msg{background:var(--ok-l);color:var(--ok);border:1px solid #BFD8C6;border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:13px}
nav{display:flex;border-top:1px solid var(--rule);flex:none;background:var(--bg)}
nav button{flex:1;padding:11px 0 13px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .12s}
nav button.on{color:var(--navy);font-weight:700}
nav .i{font-size:17px}
.share{font-family:Consolas,monospace;font-size:12px;background:var(--bg2);border:1px solid var(--rule);
       border-radius:8px;padding:8px 10px;word-break:break-all;margin-top:8px}
.due{font-size:13px;font-weight:700;color:var(--ink2);background:var(--bg2);
     border:1px solid var(--rule);border-radius:9px;padding:8px 11px;margin-bottom:10px}
.due.hot{color:var(--acc);border-color:#F6CFC2;background:#FDF3EF}
.due.over{color:var(--bad);border-color:#F0D6D6;background:#FCF1F1}
.late{color:var(--bad);font-weight:700}
.agree{border:1px solid var(--rule);border-radius:9px;padding:11px;background:var(--bg2);margin-top:12px}
.agree .meta{line-height:1.6}
.ck{display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:13px;font-weight:600}
.ck input{width:16px;height:16px;flex:none;margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--navy)}
.rv{border-left:3px solid var(--rule);padding:2px 0 2px 10px;margin:8px 0}
.shrow{display:flex;gap:6px;align-items:flex-start;margin-top:8px}
/* 카카오 노란색은 그쪽 규정 색이라 그대로 쓴다 */
.kko{background:#FEE500;color:#191600;font-weight:800;border-radius:10px;padding:11px 16px;
     display:inline-block;text-decoration:none;font-size:14.5px}
.kko:hover{filter:brightness(.96)}
/* 열쇠는 가려 둔다. 어깨너머로 보이면 그걸로 끝이다 */
.hid{filter:blur(5px);transition:filter .15s;cursor:pointer;user-select:none}
.hid.on{filter:none;user-select:text}
.shrow .share{flex:1;margin-top:0}
@media print{
  body{background:#fff}
  #app{max-width:none;box-shadow:none;min-height:0}
  header,nav,.noprint{display:none!important}
  main{overflow:visible;padding:0;columns:auto !important}
  .card,table{break-inside:avoid}
}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.tabnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 자리 점판 — BRAND.md 시그니처. 꺼짐=테두리, 기다림=노랑 테두리, 켜짐=파랑으로 찬 점 */
.dots{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px 18px 14px;margin:14px 0}
.dots .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dots .top b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

.dots .dotrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 12px}
.dot{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid #5A6275;box-sizing:border-box}

.dot.pop{animation:dotpop .25s ease-out}
@keyframes dotpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

<body>
<div id="app">
  <header>
    <div class="hrow">
      <button class="logo" id="b-home" title="처음으로" aria-label="처음 화면으로">

    <button data-t="board"><span class="i">▤</span>순위</button>
    <button data-t="spon"><span class="i">◆</span>협찬 성과</button>

</div>

<script src="qr.js"></script>
<script>
/* ═══════ ASK-FIRST : 서버 연결부 ═══════
   라켓온과 같은 두 갈래. file:// 로 열면 데모 데이터, http:// 면 진짜 서버. */
const LIVE = location.protocol.startsWith('http');
const okeyOf = id => localStorage.getItem('hackon.okey.' + id) || '';
/* 주최자 열쇠. 대회 열쇠와 다르다 —
   대회 열쇠는 그 대회 하나만 열고, 이건 내가 연 것 전부를 연다.
   로그인 대신 이 열쇠 하나가 계정 노릇을 한다. */
const myKey = () => localStorage.getItem('hackon.owner') || '';
/* 팀 열쇠. 신청할 때 한 번 받아 두고, 그 팀 칸을 고칠 때마다 같이 보낸다. */
const tkeyOf = tid => localStorage.getItem('hackon.tkey.' + tid) || '';
async function api(path, opt) {
  const r = await fetch('/api' + path, {
    method: opt?.method || 'GET',
    headers: { 'content-type': 'application/json',
               ...(cur && okeyOf(cur) ? { 'x-okey': okeyOf(cur) } : {}),
               ...(opt?.tkey ? { 'x-tkey': opt.tkey } : {}),
               ...(myKey() ? { 'x-owner': myKey() } : {}) },
    body: opt?.body ? JSON.stringify(opt.body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '서버 오류');
  return d;
}
/* ═══════ ASK-FIRST 끝 ═══════ */

/* 데모 데이터 — 서버 없이 화면을 확인할 때만 쓴다 */
const DEMO = {
  events: [{ id: 'demo01', title: '우리 동네 문제 해결 해커톤', host: '유재원',
             starts: '2026-10-11', ends: '2026-10-12', prize: 3000000 }],
  event: { id: 'demo01', title: '우리 동네 문제 해결 해커톤', host: '유재원', topic: '생활 불편',
           starts: '2026-10-11', ends: '2026-10-12', prize: 3000000, cap: 20, teams: 3,
           rubric: [{key:'idea',label:'독창성',weight:30},{key:'make',label:'완성도',weight:30},
                    {key:'use',label:'실용성',weight:25},{key:'tell',label:'전달력',weight:15}],
           sponsors: [{ name: '오픈에이아이', kind: '크레딧', amount: 2000000,
                        logo: '', link: '' },
                      { name: '동네카페', kind: '상품', amount: 300000 }] },
  board: [{ rank:1, name:'가나다팀', score:82.5, judges:2, done:true },
          { rank:2, name:'하나팀', score:71.0, judges:2, done:true },
          { rank:3, name:'셋팀', score:0, judges:0, done:false }],
  outcomes: { teams:3, finished:2, finishRate:66.7, interview:2, adoption:1, hired:0, followup:1, list:[] },
};

let tab = 'home', cur = localStorage.getItem('hackon.event') || '', curTeam = '';
/* 참가자 폰은 localhost 로 못 온다. 서버가 알려 준 랜 주소로 공유 링크를 만든다. */
let NET = null;
let AUTH = null;   // 카카오 로그인을 쓸 수 있는지, 지금 로그인했는지
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const won = n => (+n || 0).toLocaleString('ko-KR') + '원';
const NEED_KIND = { venue:'장소', judge:'심사', prize:'상품', mentor:'멘토', snack:'간식', other:'기타' };
const needKind = k => NEED_KIND[k] || k || '기타';
const needProgress = n => `${Math.min(+n.filled || 0, +n.qty || 0)}/${+n.qty || 0}`;
/* 자리 점판. needs 의 qty 만큼 점을 그리고, 확인된 수만큼 켜고, 기다리는 수만큼 노랑 테두리. */
function dotBoard(needs, title) {
  let total = 0, on = 0, wait = 0; const dots = []; const per = {};
  (needs || []).forEach(n => {
    const q = Math.max(0, +n.qty || 0);
    const f = Math.min(q, +n.filled || 0);
    const w = Math.min(q - f, (n.pledges || []).filter(p => p.status === 'pending').length);
    total += q; on += f; wait += w;
    const k = needKind(n.kind); per[k] = per[k] || [0, 0]; per[k][0] += f; per[k][1] += q;
    for (let i = 0; i < q; i++) dots.push(i < f ? 'on' : i < f + w ? 'wait' : '');
  });
  if (!total) return `<div class="dots"><div class="top"><b>${esc(title || '필요한 자리')}</b><span>0개</span></div>
    <div class="empty">운영자가 아직 자리를 올리지 않았습니다.</div></div>`;
  const prev = +(sessionStorage.getItem('hackon.dots.' + cur) || 0);
  try { sessionStorage.setItem('hackon.dots.' + cur, on); } catch (_) {}
  let lit = 0;
  const html = dots.map(c => { if (c === 'on') lit++; const pop = c === 'on' && lit > prev ? ' pop' : '';
    return `<i class="dot ${c}${pop}" aria-hidden="true"></i>`; }).join('');
  const sum = Object.entries(per).map(([k, v]) => `${esc(k)} <b>${v[0]}/${v[1]}</b>`).join(' · ');
  return `<div class="dots" role="img" aria-label="필요한 자리 ${total}개 중 ${on}개 채움, ${wait}개 확인 대기">
    <div class="top"><b>${on}/${total} 켜짐</b><span>${on >= total ? '자리가 다 켜졌습니다' : (total - on) + '자리 남음'}${wait ? ' · 확인 대기 ' + wait : ''}</span></div>
    <div class="dotrow">${html}</div><div class="sum">${sum}</div></div>`;
}


/* 오늘 날짜(YYYY-MM-DD). toISOString() 은 언제나 UTC 라서 한국 새벽 0~9시에 하루 전을 내놓는다 —
   하필 대회 당일 아침이 그 시간대다. 보는 사람의 현지 날짜로 만든다. */
const ymd = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* 대회 상태는 날짜에서 바로 나온다. 서버에 칸을 하나 더 두지 않는다. */
function statusOf(e) {
  const t = ymd();
  if (t < e.starts) return { k: '모집중', c: 'ok' };
  if (t > e.ends) return { k: '끝남', c: '' };
  return { k: '진행 중', c: 'warn' };
}
const badge = e => { const s = statusOf(e); return `<span class="pill ${s.c}">${s.k}</span>`; };

/* 마감까지 남은 시간. 1시간을 끊으면 색이 바뀐다. */
function dueText(due) {
  const ms = new Date(due) - new Date();
  if (ms <= 0) return { t: '제출 마감이 지났습니다', c: 'over' };
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  /* 이틀이 넘으면 날로 끊는다. '1718시간 56분' 은 행사장 큰 화면에서 두 줄로 깨진다. */
  const t = d >= 2 ? d + '일 ' + (h % 24) + '시간'
          : h      ? h + '시간 ' + (m % 60) + '분'
          :          m + '분';
  return { t: '제출 마감까지 ' + t, c: ms < 3600000 ? 'hot' : '' };
}
/* 화면 전체를 다시 그리지 않고 그 칸의 글자만 갈아 끼운다. */
function tickDue() {
  document.querySelectorAll('[data-due]').forEach(el => {
    if (!el.dataset.due) return;
    const r = dueText(el.dataset.due);
    if (el.classList.contains('tvclock')) {
      /* 큰 화면에서는 '제출 마감까지' 를 위에 따로 적어 두었으니 숫자만 남긴다. */
      el.textContent = r.t.replace('제출 마감까지 ', '').replace('제출 마감이 지났습니다', '마감');
      el.className = 'tvclock ' + r.c;
    } else {
      el.textContent = r.t; el.className = 'due ' + r.c;
    }
  });
}
setInterval(tickDue, 1000);
const dueBox = e => e.due ? `<div class="due" data-due="${esc(e.due)}"></div>` : '';

/* 참가 신청 칸. 운영 화면과 공개 화면이 같은 것을 쓴다 — 두 벌로 두면 한쪽만 고치게 된다.
   '어디서 보셨나' 가 이 폼의 핵심이다. 2회차 홍보를 어디에 할지 이 한 칸이 정한다. */
/* 대회 규칙. 참가자가 가장 크게 데는 곳이 결과물 권리다.
   해외에서 주최사가 결과물 권리를 통째로 가져가는 조항을 넣었다가 사과한 일이 있었다.
   기본값을 참가자 쪽에 두고 그것을 눈에 보이게 적는다. */
/* 참가자가 제일 먼저 묻는 것은 규칙이 아니라 '내가 나가도 되나' 다.
   2026-09-04 모두의 창업 설명회 질의응답이 처음부터 끝까지 자격 질문이었다.
   답이 '아무나' 인데 그걸 안 적어 두면 사람은 안 온다. */
function whoBox() {
  return `<div class="card" style="border-color:#AECFB8;background:var(--ok-l)">
    <h3>누가 나올 수 있나요</h3><div class="meta">
    <b>아무나 됩니다.</b> 나이·학교·소속·경력 제한이 없습니다.<br>
    <b>혼자 오셔도 됩니다.</b> 당일 팀 짜는 시간에 팀이 생깁니다.<br>
    <b>처음이어도 됩니다.</b> 대단한 기술이 아니어도 됩니다 —
    평소 불편했던 것 하나면 충분합니다.<br>
    <b>못 만들어도 됩니다.</b> 중간에 떨어뜨리지 않습니다.
  </div></div>`;
}

function rulesBox() {
  return `<div class="card"><h3>규칙</h3><div class="meta">
    <b>만든 것은 팀의 것입니다.</b> 주최 측은 결과물의 권리를 가져가지 않습니다.
    홍보에 쓸 때도 먼저 물어봅니다.<br>
    <b>생성형 AI 를 써도 됩니다.</b> 검사기로 잡아내지 않습니다.
    대신 <b>어디에 썼고 무엇을 버렸는지</b>를 직접 적어 주세요. 그게 심사에서 가장 크게 보는 곳입니다.<br>
    중간에 떨어뜨리는 라운드가 없습니다. 모든 팀이 같은 시간을 씁니다.<br>
    심사 기준은 시작 전에 공개하고, 시작한 뒤에는 바꾸지 않습니다.<br>
    멘토의 조언은 참고 사항입니다. 무엇을 만들지는 팀이 정합니다.<br>
    행동강령은 참가자·멘토·스태프·심사위원·협찬사 모두에게 똑같이 적용됩니다.
  </div></div>`;
}

const FOUND = ['캠퍼스픽', '위비티', '이벤터스', '학교 커뮤니티', '개발 커뮤니티', '아는 사람', '기타'];
/* 처음에는 두 칸만 받는다. 연락처도 안 묻는다.
   신청하고 나면 그다음에 나머지를 묻는다 — 이미 발을 들인 뒤라 부담이 적다. */
function applyForm() {
  return `<label>팀 이름 <span class="pill">필수</span></label>
    <input id="t-name" placeholder="혼자 오시면 본인 이름을 적으세요">
    <div class="agree">
      <div class="meta"><b>개인정보 수집·이용 안내</b><br>
        수집 항목 · 이름(팀 이름) · 연락처 · 참가 정보<br>
        이용 목적 · 대회 운영 · 참가 확인 · 결과 안내 · 상금 지급<br>
        보유 기간 · 대회 종료 후 <b>6개월</b>. 그 뒤 지웁니다<br>
        동의하지 않으시면 참가 신청을 받을 수 없습니다.</div>
      <label class="ck"><input type="checkbox" id="t-agree">
        <span>개인정보 수집·이용에 동의합니다 <span class="pill">필수</span></span></label>
    </div>
    <div style="height:10px"></div>
    <button class="btn sm" id="t-join">참가 신청</button>
    <div class="meta" style="margin-top:8px">지금은 이름만 받습니다.
      연락처와 나머지는 신청한 뒤에 여쭙겠습니다.</div>`;
}

/* 신청을 마친 사람에게만 보이는 두 번째 칸. 여기서 진짜 정보를 받는다. */
function moreForm(t) {
  const need = [];
  if (!t.contact) need.push('연락처');
  if (!t.role) need.push('역할');
  if (!t.found) need.push('어디서 보셨는지');
  if (!need.length) return `<div class="card"><h3>신청 완료</h3>
    <div class="meta">필요한 것을 다 주셨습니다. 확정 메일을 기다려 주세요.</div></div>`;
  return `<div class="card">
    <h3>신청됐습니다. 조금만 더</h3>
    <div class="meta">${esc(t.name)} 팀으로 접수됐습니다.
      아래를 채워 주시면 확정 안내를 드리고 팀을 짜 드릴 수 있습니다.
      안 채우셔도 신청은 유효합니다.</div>
    ${!t.contact ? `<label>연락처 <span class="pill warn">확정 안내를 여기로 보냅니다</span></label>
      <input id="m-contact" placeholder="이메일 또는 전화">` : ''}
    ${!t.role ? `<div class="row">
      <div><label>주로 하는 것</label>
        <select id="m-role"><option value="">고르기</option>
          <option>만들기</option><option>기획</option><option>디자인</option></select></div>
      <div><label>혼자 오시나요</label>
        <select id="m-solo"><option value="">팀이 있습니다</option>
          <option value="1">혼자 옵니다</option></select></div>
    </div>` : ''}
    <div class="row">
      <div><label>지금 몇 명이신가요</label>
        <input id="m-size" type="number" min="1" max="9" value="${t.size || 1}"></div>
      <div><label>사람을 더 찾으시나요</label>
        <select id="m-want-on"><option value="">아니요</option>
          <option value="1">네, 찾습니다</option></select></div>
    </div>
    ${!t.want ? `<label>어떤 분을 찾으시나요</label>
      <input id="m-want" placeholder="예) 화면 만드는 분 한 분">` : ''}
    ${!t.found ? `<label>어디서 보셨나요</label>
      <select id="m-found"><option value="">고르기</option>
        ${FOUND.map(f => `<option>${f}</option>`).join('')}</select>` : ''}
    ${!t.note ? `<label>하고 싶은 것 (선택)</label>
      <textarea id="m-note" rows="2" placeholder="어떤 불편을 풀고 싶은지 한 줄"></textarea>` : ''}
    <label class="ck"><input type="checkbox" id="m-photo"${t.photo ? ' checked' : ''}>
      <span>행사 사진·영상 촬영과 공개에 동의합니다 <span class="pill ok">선택</span></span></label>
    <label class="ck"><input type="checkbox" id="m-spon"${t.sponsor_ok ? ' checked' : ''}>
      <span>협찬사가 채용·인턴·협업 제안으로 연락하는 것에 동의합니다
        <span class="pill ok">선택</span></span></label>
    <div class="meta">동의하신 분의 연락처만 전달됩니다. 언제든 끌 수 있습니다.</div>
    <div style="height:10px"></div>
    <button class="btn sm" id="m-save">보내기</button>
  </div>`;
}
let msg = null;

/* 안내를 띄우고 화면을 한 번만 다시 그린다.

/** CSV 로 내려준다. 엑셀은 BOM 이 없으면 한글을 깨고, 줄바꿈은 CRLF 를 원한다.
    역슬래시를 안 쓰는 이유 - 이 파일이 스크립트로 여러 번 고쳐지는데 한 겹씩 먹혀서 깨진 적이 있다. */
function saveCsv(name, rows) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const BOM = String.fromCharCode(0xFEFF), NL = String.fromCharCode(13, 10);
  const blob = new Blob([BOM + rows.map(r => r.map(q).join(',')).join(NL)],
                        { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* 앱이 센 것이 기본이다. 그러니 표시하지 않는다.

/** 별 다섯 개. name 은 어느 항목인지. 고른 값은 data-v 에 남는다. */
function stars(name, val) {
  return `<div class="stars" data-star="${name}" data-v="${val || 0}">
    ${[1, 2, 3, 4, 5].map(i =>
      `<button data-i="${i}" class="${i <= (val || 0) ? 'on' : ''}">★</button>`).join('')}
  </div>`;
}

/** 평가 결과 한 줄. 세 건 미만이면 숫자 대신 건수만. */
function repLine(label, r) {
  if (!r || !r.n) return `${label} <span class="pill">아직 없음</span>`;
  return r.show
    ? `${label} <b>${r.score}</b> <span class="meta">(${r.n}건)</span>`
    : `${label} <span class="pill">${r.n}건 · 3건부터 보여 드립니다</span>`;
}

/* 심사평 추천 태그. 빈 칸을 주면 아무도 안 쓴다 - 누를 것을 준다.
   문장을 그대로 넣는다. 심사위원은 고르고 고치기만 하면 된다. */
/* 진행표를 카드로 그린다. 화면 전체를 다시 그리지 않는다 -
   다시 그리면 방금 고치던 칸에서 커서가 튕겨 나간다. */
function planRow(at, what) {
  const el = document.createElement('div');
  el.className = 'prow';
  el.innerHTML = `<input type="time" value="${esc(at || '')}">
    <input class="what" value="${esc(what || '')}" placeholder="무엇을 하나요" maxlength="60">
    <span class="len"></span>
    <button class="del" title="지우기">×</button>`;
  el.querySelector('.del').onclick = () => { el.remove(); planRedraw(); };
  el.querySelectorAll('input').forEach(i => i.onchange = planRedraw);
  return el;
}

/** 소요 시간을 대신 센다. '만들기 4시간' 이 보여야 길고 짧음을 판단한다. */
function planRedraw() {
  const box = document.getElementById('e-plan');
  if (!box) return;
  const rows = [...box.children];
  const m = el => {
    const v = el.querySelector('input[type=time]').value;
    const p = v.match(/^(\d{1,2}):(\d{2})$/);
    return p ? +p[1] * 60 + +p[2] : null;
  };
  rows.sort((a, b) => (m(a) ?? 9999) - (m(b) ?? 9999)).forEach(r => box.appendChild(r));
  rows.forEach((r, i) => {
    const a = m(r), b = i + 1 < rows.length ? m(rows[i + 1]) : null;
    const d = (a !== null && b !== null && b > a) ? b - a : null;
    r.querySelector('.len').textContent = d === null ? ''
      : d >= 60 ? (d % 60 ? `${Math.floor(d / 60)}시간 ${d % 60}분` : `${d / 60}시간`)
                : `${d}분`;
    const w = r.querySelector('.what').value;
    r.classList.toggle('hot', /제출 마감|코드 프리즈/.test(w));
    r.classList.toggle('key', /^발표|시상|등록/.test(w));
  });
}

/** 화면에 있는 것을 그대로 읽어 낸다. */
function planRead() {
  const box = document.getElementById('e-plan');
  if (!box) return [];
  return [...box.children].map(r => ({
    at: r.querySelector('input[type=time]').value,
    what: r.querySelector('.what').value.trim(),
  })).filter(x => x.at && x.what);
}

function planFill(rows) {
  const box = document.getElementById('e-plan');
  if (!box) return;
  box.innerHTML = '';
  (rows || []).forEach(r => box.appendChild(planRow(r.at, r.what)));
  planRedraw();
}

function nudge(text) {

}

/** 협찬사 로고 띠. 로고 주소가 없으면 이름만 글자로 낸다. */
function logoBand(list, tv) {
  if (!list || !list.length) return '';
  /* 서버가 넣을 때 걸러도 여기서 다시 본다.
     걸러지기 전에 저장된 줄이 있을 수 있고, 그 한 줄이면 보는 사람 전부가 당한다. */
  const web = v => (/^https?:\/\//i.test(String(v || '').trim()) ? String(v).trim() : '');
  return `<div class="${tv ? 'tvlogos' : 'logos'}">` + list.map(sp => {
    const logo = web(sp.logo), link = web(sp.link);
    /* 로고는 바깥에서 온다. 행사장 와이파이가 죽으면 안 온다.
       그때 빈 자리만 남으면 협찬사가 돈 낸 자리가 통째로 사라진다 - 이름 글자로 떨어뜨린다.
       텍스트 노드로 바꾼다. alt 를 innerHTML 로 넣으면 이름에 든 꺾쇠가 그대로 산다. */
    const inner = logo
      ? `<img src="${esc(logo)}" alt="${esc(sp.name)}" loading="eager"
             onerror="this.replaceWith(document.createTextNode(this.alt))">`
      : esc(sp.name);
    return link
      ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<span>${inner}</span>`;
  }).join('') + '</div>';
}

/** 주소 하나를 QR 로. 오류정정 M — 프로젝터로 쏴도, 좀 가려져도 읽힌다.
    라이브러리가 없으면(파일을 따로 떼어 열면) 조용히 아무것도 안 낸다.
    QR 이 안 나온다고 화면이 통째로 죽으면 안 된다. */
function qrTag(url, cls) {
  if (typeof qrcode !== 'function') return '';
  try {
    const q = qrcode(0, 'M');
    q.addData(url);
    q.make();
    return `<div class="qr ${cls || ''}">`
      + q.createSvgTag({ cellSize: 4, margin: 1, scalable: true }) + '</div>';
  } catch { return ''; }
}

/** 주소 + 복사 단추 + QR 한 벌. 세 군데(공개·큰 화면·심사위원)가 같은 모양을 쓴다. */
function linkBox(url, id, btn, tip) {
  /* QR 이 주인공이다. 주소는 아래에 작게 둔다 -
     현장에서 주소를 손으로 치는 사람은 없다. 찍거나, 복사하거나 둘 중 하나다. */
  return `${qrTag(url) ? `<div class="qrline">${qrTag(url)}
      <div class="meta">${tip}</div></div>` : ''}
    <div class="shrow" style="margin-top:7px">
      <div class="share"${id ? ` id="${id}"` : ''}>${esc(url)}</div>
      <button class="btn sec sm" id="${btn}">복사</button>
    </div>`;
}

/** PC 모드 · 폰 모드. 좁은 화면에서는 단추 자체를 안 보여 준다 —
    폰에서 PC 모드를 켜면 아무것도 못 읽는다. */
function applyWide() {
  const btn = document.getElementById('b-wide');
  const can = window.innerWidth >= 900 && !document.body.classList.contains('tv');
  if (!btn) return;
  btn.style.display = can ? '' : 'none';
  if (!can) { document.body.classList.remove('wide'); return; }
  const on = localStorage.getItem('hackon.wide') !== 'off';
  document.body.classList.toggle('wide', on);
  btn.textContent = on ? '▭ PC 모드' : '▯ 폰 모드';
  btn.title = on ? '눌러서 폰 모양으로' : '눌러서 화면 넓게';
}

/** 공유에 쓸 바깥 주소. 운영자가 localhost 로 보고 있어도 참가자용은 랜 주소로 준다. */
function shareBase() {
  if (!LIVE) return 'http://localhost:8788';
  const h = location.hostname;
  if (h !== 'localhost' && h !== '127.0.0.1') return location.origin;   // 이미 랜 주소로 보고 있다
  if (NET && NET.net && NET.net.length) return `http://${NET.net[0]}:${NET.port}`;
  return location.origin;
}

      ${f.need.map(r => `<div class="card">

      <div id="f-mail"></div>

      ${lead ? `<h3 style="margin-top:18px">연락한 곳</h3>

          같은 데 두 번 보내는 것보다, 아무 데도 안 보낸 채 날짜가 오는 게 더 흔합니다.</p>
        ${lead.rows.length ? `<table><tr><th>무엇</th><th>어디</th><th>상태</th><th></th></tr>
          ${lead.rows.map(r => `<tr>
            <td>${esc(r.kind)}</td>
            <td>${esc(r.name)}${r.how ? `<br><span class="meta">${esc(r.how)}</span>` : ''}</td>
            <td><button class="btn sec sm" data-state="${r.id}" data-now="${esc(r.state)}"
                  style="padding:4px 9px">${esc(r.state)}</button></td>

          </tr>`).join('')}</table>
          <p class="sub">상태를 누르면 보냄 → 답장 → 확정 → 거절 순으로 바뀝니다.</p>`
        : '<p class="sub">아직 없습니다. 위에서 넣거나 아래에 직접 적으세요.</p>'}
        <div class="card">
          <div class="row">
            <div><label>무엇</label><select id="l-kind">
              <option>장소</option><option>심사위원</option><option>강사</option>
              <option>스태프</option><option>멘토</option><option>협찬</option></select></div>
            <div><label>이름</label><input id="l-name" placeholder="예) 마포청년센터"></div>

          <button class="btn sm" id="l-add">대장에 넣기</button>

  },

  async board() {
    if (!cur && !LIVE) cur = 'demo01';

    const d = LIVE ? await api(`/events/${cur}/board`) : { event: DEMO.event, rows: DEMO.board };
    const e = d.event;
    const needs = LIVE ? await api(`/events/${cur}/needs`).catch(() => []) : DEMO.needs;

    /* 운영자 열쇠가 있을 때만 연락처가 붙은 명단을 받는다. 없으면 빈 배열. */

    (LIVE ? await api(`/events/${cur}/pledges`).catch(() => []) : (DEMO.pledges || [])).forEach(p => { pledgeInfo[p.id] = p; });
    /* 열쇠가 없으면 순위와 공유 주소까지만 보여 준다. 연락처는 서버가 이미 안 준다. */
    if (LIVE && !e.admin) return `<h2>${esc(e.title)} ${badge(e)}</h2>
      <p class="sub">${esc(e.starts)}~${esc(e.ends)} · 참가 ${e.teams}팀</p>

    const sp = LIVE ? await api(`/events/${cur}/spread`) : { rows: [], gap: 0 };
    /* 심사평을 몇 팀에게 남겼는지. 참가자 불만 1위가 '왜 떨어졌는지 모른다' 인데,
       심사위원이 점수만 넣고 가면 그 불만이 그대로 남는다. */
    const noWord = d.rows.filter(r => (r.judges || 0) > 0 && !(r.words || 0)).length;
    /* 이 브라우저로 신청한 팀. 있으면 두 번째 칸을 펼쳐 둔다. */
    const myId = localStorage.getItem('hackon.team.' + cur);
    const mine = myId ? d.rows.find(r => String(r.id) === String(myId)) : null;
    const js = d.judges || [];

    /* ── 지금 할 것 하나만 펼친다 ──────────────────────────────

       화면을 열면 서너 묶음이 한꺼번에 펴진 채로 떴다. 그게 벽처럼 보인 원인이다.

       기업용 해커톤 플랫폼들의 약점을 모아 보니 '기능이 없다' 가 아니라 전부 '무겁다' 였다

    const 오늘 = ymd();
    const 단계 = !e.starts || 오늘 < e.starts ? '모집'

    const todo = !e.due || !e.prize || (e.starts === e.ends && !e.topic);
    const 할일 = todo ? '정보'                       // 안 정한 것이 있으면 그것부터
               : 단계 === '모집' ? '주소'
               : 단계 === '당일' ? '등록'
               : '정산';
    const 폄 = k => (할일 === k ? ' open' : '');

    return `<h2>${esc(e.title)} ${badge(e)}</h2>

        <div class="tags" style="margin-top:8px">
          ${NOTICES.map(x => `<button data-nt="${esc(x)}">${esc(x)}</button>`).join('')}
        </div>
        <div class="shrow" style="margin-top:8px">
          <input id="nt-in" maxlength="120" placeholder="예) 점심 도착했습니다. 3층으로 오세요">
          <button class="btn sm" id="nt-go">띄우기</button>
        </div>
      </div></details>

      ${e.listed
        ? `<div class="card" style="border-color:#BFD8C6;background:var(--ok-l)">
             <div class="meta"><b style="color:var(--ok)">첫 화면 목록에 보입니다.</b>
               아무나 들어와서 이 대회를 찾을 수 있습니다.</div>
             <div style="height:10px"></div>
             <button class="btn sec sm" id="b-unlist">목록에서 내리기</button>
           </div>`
        : `<div class="card" style="border-color:#EBD3AE;background:var(--warn-l)">
             <h3 style="color:var(--warn)">아직 첫 화면 목록에 안 보입니다</h3>
             <div class="meta">${(e.missing || []).length
                 ? `먼저 채우세요 — <b>${(e.missing || []).map(esc).join(' · ')}</b>`
                 : '채울 것은 다 채우셨습니다.'}</div>
             <div style="height:10px"></div>
             <button class="btn sm" id="b-list">첫 화면 목록에 올리기</button>
           </div>`}

      ${(() => { return `<details${폄('정보')}>
        <summary>${todo ? '아직 안 정한 것' : '대회 정보 고치기'}

      ${e.due ? `<button class="btn sec sm" id="b-ext">마감 30분 미루기</button>

      ${sp.rows.length > 1 ? `<div class="card" style="padding:11px 13px">

      </div>` : ''}
      <details open><summary>필요한 자리 <span class="when">${needs.reduce((a,n) => a + Math.max(0,(+n.qty||0)-(+n.filled||0)),0)}자리 남음</span></summary><div class="in">
        ${dotBoard(needs, '내 대회의 자리')}
        <div class="meta">장소·심사·상품·멘토·간식을 공개 페이지에 올립니다. 누가 맡겠다고 하면 여기서 연락처를 보고 확인하거나 거절합니다.</div>
        ${needs.length ? needs.map(n => `<div class="card" style="margin-top:9px">
          <h3>${esc(needKind(n.kind))} · ${esc(n.label)} <span class="pill ${(+n.filled||0) >= (+n.qty||0) ? 'ok' : 'warn'}">${needProgress(n)}</span></h3>
          ${n.note ? `<div class="meta">${esc(n.note)}</div>` : ''}
          ${(n.pledges || []).length ? `<div style="margin-top:8px">${(n.pledges || []).map(p => `<div class="shrow" style="align-items:center">

              ${pledgeInfo[p.id] && pledgeInfo[p.id].contact ? `<div class="contact">연락처 <b>${esc(pledgeInfo[p.id].contact)}</b>${pledgeInfo[p.id].note ? ' · ' + esc(pledgeInfo[p.id].note) : ''}</div>` : ''}</div>
            ${p.status === 'pending' ? `<button class="btn sm" data-pledge-status="${esc(p.id)}" data-status="ok">확인</button>
              <button class="btn sec sm" data-pledge-status="${esc(p.id)}" data-status="no">거절</button>` : ''}
          </div>`).join('')}</div>` : '<div class="meta" style="margin-top:7px">아직 맡겠다는 사람이 없습니다.</div>'}
        </div>`).join('') : '<div class="meta" style="margin-top:8px">아직 올린 자리가 없습니다.</div>'}
        <div class="card" style="margin-top:10px">
          <h3>자리 추가</h3>
          <div class="row"><div><label>종류</label><select id="n-kind">

            <option value="mentor">멘토</option><option value="snack">간식</option><option value="other">기타</option>
          </select></div><div><label>몇 자리</label><input id="n-qty" type="number" min="1" value="1"></div></div>
          <label>무엇이 필요한가</label><input id="n-label" maxlength="80" placeholder="예) 20명이 6시간 쓸 장소">
          <label>메모</label><input id="n-note" maxlength="160" placeholder="예) 콘센트 20개 · 와이파이">
          <div style="height:9px"></div><button class="btn sm" id="n-add">자리 올리기</button>
        </div>
        ${ledger.length ? `<h3 style="margin-top:16px">확인된 공개 장부</h3><table><tr><th>자리</th><th>이름</th><th>소속</th></tr>
          ${ledger.map(x => `<tr><td>${esc(needKind(x.kind))} · ${esc(x.label)}</td><td>${esc(x.name)}</td><td>${esc(x.org || '—')}</td></tr>`).join('')}</table>` : ''}
      </div></details>

      <details${폄('주소')}><summary>보낼 주소 <span class="when">모집·심사</span></summary><div class="in">
        <div class="meta">
          ${NET && NET.net && NET.net.length > 1
            ? `<br>랜 주소가 여러 개입니다. 안 열리면 다른 것을 쓰세요 —
               ${NET.net.slice(1).map(ip => `http://${esc(ip)}:${NET.port}`).join(' · ')}`
            : ''}
          ${NET && NET.net && !NET.net.length
            ? '<br><b class="late">랜 주소를 못 찾았습니다.</b> 와이파이 연결을 확인하세요. 지금 주소는 이 노트북에서만 열립니다.'
            : ''}</div>
        ${linkBox(`${shareBase()}/e/${e.id}`, '', 'b-copy',
          '<b>참가자용.</b> 찍으면 바로 열립니다.')}
        <div class="meta" style="margin-top:10px">
          <b>운영자 열쇠</b> <span class="pill warn">참가자에게 주지 마세요</span><br>
          <code class="hid" data-reveal>${esc(okeyOf(e.id) || '이 기기에 없음')}</code>
        </div>

        ${/* 나머지 둘은 '보내는' 주소가 아니다. 큰 화면은 이 노트북에서 열기만 하고,
              심사 주소는 심사 직전에 그 자리에서 보여 준다.
              셋을 나란히 늘어놓으면 주최자가 볼 때마다 '지금 뭘 복사하지'를 판단해야 한다.
              QR 은 접힌 채로도 그려져 있다 - 펴면 바로 찍을 수 있다. */''}
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sec sm" id="b-tv">행사장 큰 화면 띄우기</button>
          <button class="btn sec sm" id="b-jopen">심사위원 화면 열기</button>
        </div>
        <div class="meta" style="margin-top:6px">
          큰 화면은 당일 아침에 이 노트북에서 열고 F11 을 누르세요.
          심사 주소는 심사 직전에 심사위원 폰으로 QR 을 찍게 하면 됩니다.</div>

        <details style="margin-top:12px"><summary>주소를 직접 복사해야 한다면</summary><div class="in">
          ${linkBox(`${shareBase()}/tv/${e.id}`, 'tvlink', 'b-copyt',
            '<b>행사장 큰 화면용.</b>')}
          ${linkBox(`${shareBase()}/j/${e.id}`, 'jlink', 'b-copyj',
            '<b>심사위원용.</b> 순위는 안 보입니다.')}
        </div></details>
      </div></details>
      ${/* 이 브라우저로 신청한 사람에게만 펴 준다. 이어서 채울 칸이 있기 때문이다.
            주최자에게는 접어 둔다 - 주최자가 자기 대회에 신청할 일은 드물다. */''}
      <details${mine ? ' open' : ''}><summary>참가 신청
        <span class="when">${mine ? '조금만 더' : d.rows.length ? '대신 넣어 줄 때' : '아직 아무도 없습니다'}</span>
        </summary><div class="in">${mine ? moreForm(mine) : applyForm()}</div></details>
      <table><tr><th>순위</th><th>팀</th><th class="n">점수</th><th class="n">심사</th></tr>
      ${d.rows.map(r => `<tr data-team="${r.id ?? ''}" style="cursor:pointer"><td>${r.rank}</td>
        <td>${esc(r.name)} ${r.done ? '<span class="pill ok">제출</span>' : '<span class="pill warn">미제출</span>'}</td>
        <td class="n">${r.score}</td><td class="n">${r.judges}명</td></tr>`).join('')}</table>
      <p class="sub" style="margin-top:12px">팀을 누르면 제출과 심사 화면이 열립니다.</p>
      <details${폄('등록')}><summary>등록 데스크 <span class="when">당일 아침</span></summary><div class="in">
        <div class="meta">온 팀을 누르세요. 절반쯤 오는 게 정상입니다.</div>
        <table><tr><th>팀</th><th>연락처</th><th>촬영</th><th></th></tr>
        ${d.rows.map(r => `<tr>
          <td>${esc(r.name)}</td>
          <td class="meta">${esc(r.contact || '—')}</td>
          <td>${r.photo ? '<span class="pill ok">동의</span>' : '<span class="pill">비동의</span>'}</td>
          <td><button class="btn ${r.came ? 'sec' : ''} sm" data-came="${r.id}">${
            r.came ? '왔음' : '체크인'}</button></td>
        </tr>`).join('')}</table>
        <div class="meta" style="margin-top:8px">촬영에 동의하지 않은 팀은 사진에서 빼 주세요.</div>
      </div></details>

      ${/* 전에는 단추 넷이 평평하게 놓여 있었다. 순서가 없으니 시상 직후에
            무엇부터 눌러야 하는지 알 수가 없고, 정작 참가자들이 기다리는 '결과 공개'가
            맨 아래에 있었다. 실제로 할 일 순서대로 1·2·3 을 매기고,
            안 눌러도 되는 것은 안 눌러도 된다고 적는다. */''}
      <details${폄('정산')}><summary>끝난 뒤에 <span class="when">시상 · 정산</span></summary><div class="in">
        <h3 style="font-size:15px;margin-bottom:3px">1. 결과 공개</h3>
        <div class="meta">시상이 끝난 뒤에 켜세요. 각 팀이 자기 점수와 심사평만 봅니다.${
          d.rows.length ? ` 지금 <b>${d.rows.length}팀</b>이 이걸 기다립니다.` : ''}</div>
        <div style="height:10px"></div>
        <button class="btn ${e.opened ? 'sec' : ''}" id="b-open">${
          e.opened ? '공개 중 — 다시 닫기' : '결과 공개하기'}</button>

        <h3 style="font-size:15px;margin:20px 0 3px">2. 협찬사와 참가자에게 보낼 것</h3>
        <div class="meta">협찬사에게는 보고서 하나면 됩니다. 명단은 정산이나 다음 회차 모집에 씁니다.</div>
        <div style="height:10px"></div>
        <button class="btn sec sm" id="b-report">결과 보고서 보기</button>
        <button class="btn sec sm" id="b-csv">명단 내려받기 (엑셀)</button>

        <h3 style="font-size:15px;margin:20px 0 3px">3. 백업</h3>
        <div class="meta">서버가 10분마다 알아서 받아 둡니다. <b>안 눌러도 됩니다.</b>
          이 컴퓨터에도 한 벌 두고 싶을 때만 쓰세요.</div>
        <div style="height:10px"></div>
        <button class="btn sec sm" id="b-dump">통째로 내려받기 (백업)</button>
      </div></details>`;
  },

  /* 공개 화면 — 로그인 없이 링크만으로 보는 읽기 전용. 협찬사와 참가자에게 뿌리는 주소다. */
  async pub() {
    const d = LIVE ? await api(`/events/${cur}/board`) : { event: DEMO.event, rows: DEMO.board, closed:false };
    const o = LIVE ? await api(`/events/${cur}/outcomes`) : DEMO.outcomes;
    const e = d.event;
    const done = d.rows.filter(r => r.done);
    const sup = LIVE ? await api(`/events/${cur}/support`) : { rows:[] };
    /* 이 브라우저로 신청한 팀. 있으면 두 번째 칸을 보여 준다. */
    const myId = localStorage.getItem('hackon.team.' + cur);
    const mine = myId ? d.rows.find(r => String(r.id) === String(myId)) : null;
    const cw = LIVE ? await api(`/events/${cur}/crew`) : { solo:[], looking:[] };
    const rec = LIVE ? await api(`/events/${cur}/record`).catch(() => null) : null;
    const hrep = LIVE ? await api(`/events/${cur}/rep`).catch(() => null) : null;
    const needs = LIVE ? await api(`/events/${cur}/needs`).catch(() => []) : DEMO.needs;
    const ledger = LIVE ? await api(`/events/${cur}/ledger`).catch(() => []) : DEMO.ledger;
    return `<h2>${esc(e.title)} ${badge(e)}</h2>
      <p class="sub">${esc(e.host)} 주최 · ${esc(e.starts)}~${esc(e.ends)}
        ${e.topic ? '· 주제 ' + esc(e.topic) : ''}<br>상금 ${won(e.prize)} · 참가 ${e.teams}팀</p>
      ${dotBoard(needs, '이 대회를 함께 여는 자리')}
      ${e.notice ? `<div class="notice">${esc(e.notice)}</div>` : ''}
      ${dueBox(e)}

      ${e.sponsors.length ? `<div class="card"><h3>함께한 곳</h3>

        ${logoBand(e.sponsors)}
      </div>` : ''}

      <h3 style="margin-top:16px">필요한 자리</h3>
      <p class="sub">한 자리씩 맡아서 같이 엽니다. 연락처는 운영자에게만 전달되고 공개 장부에는 나오지 않습니다.</p>
      ${needs.length ? needs.map(n => `<div class="card">
        <h3>${esc(needKind(n.kind))} · ${esc(n.label)} <span class="pill ${(+n.filled||0) >= (+n.qty||0) ? 'ok' : 'warn'}">${needProgress(n)} 채움</span></h3>
        ${n.note ? `<div class="meta">${esc(n.note)}</div>` : ''}
        ${(n.pledges || []).filter(p => p.status === 'ok' || p.status === 'done').length ? `<div class="meta" style="margin-top:6px">확인됨 · ${(n.pledges || []).filter(p => p.status === 'ok' || p.status === 'done').map(p => `<b>${esc(p.name)}</b>${p.org ? ' (' + esc(p.org) + ')' : ''}`).join(' · ')}</div>` : ''}
        ${(+n.filled||0) < (+n.qty||0) ? `<div style="height:9px"></div><button class="btn sec sm" data-pledge-open="${esc(n.id)}">내가 맡겠다</button>
          <div id="pledge-${esc(n.id)}" hidden>
            <label>이름</label><input data-p-name="${esc(n.id)}" placeholder="이름 또는 팀/가게 이름">
            <label>소속</label><input data-p-org="${esc(n.id)}" placeholder="선택">
            <label>연락처 <span class="pill warn">운영자에게만 보임</span></label><input data-p-contact="${esc(n.id)}" placeholder="이메일 또는 전화">
            <label>메모</label><input data-p-note="${esc(n.id)}" placeholder="가능한 시간·수량 등">
            <div style="height:9px"></div><button class="btn sm" data-pledge-send="${esc(n.id)}">맡겠다고 보내기</button>
          </div>` : '<div class="meta" style="margin-top:7px"><b>필요한 만큼 채워졌습니다.</b></div>'}
      </div>`).join('') : '<div class="card"><div class="meta">아직 올린 자리가 없습니다.</div></div>'}

      <h3 style="margin-top:16px">공개 장부</h3>
      <p class="sub">운영자가 확인한 것만 이름과 함께 남습니다. 연락처는 공개하지 않습니다.</p>
      ${ledger.length ? `<table><tr><th>자리</th><th>이름</th><th>소속</th></tr>${ledger.map(x => `<tr><td>${esc(needKind(x.kind))} · ${esc(x.label)}</td><td>${esc(x.name)}</td><td>${esc(x.org || '—')}</td></tr>`).join('')}</table>` : '<div class="card"><div class="meta">아직 확인된 기여가 없습니다.</div></div>'}

      <div class="stat">
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
        <div><b>${o.interview}</b><span>면접 연결</span></div>
        <div><b>${o.adoption}</b><span>도입 검토</span></div>
      </div>

      ${d.closed ? `<h3 style="margin-top:16px">순위</h3>
        <table><tr><th>순위</th><th>팀</th><th class="n">점수</th></tr>
        ${d.rows.map(r => `<tr><td>${r.rank}</td><td>${esc(r.name)}</td>
          <td class="n">${r.score}</td></tr>`).join('')}</table>`
      : `<h3 style="margin-top:16px">참가한 팀</h3>
        <p class="sub">순위와 점수는 <b>제출 마감 뒤</b>에 함께 공개됩니다.</p>
        <table><tr><th>팀</th><th>제출</th></tr>
        ${d.rows.map(r => `<tr><td>${esc(r.name)}</td>
          <td>${(r.done || r.hidden) ? '<span class="pill ok">냈습니다</span>'
                                     : '<span class="pill">아직</span>'}</td></tr>`).join('')}</table>`}

      ${sup.rows.length ? `<h3 style="margin-top:16px">끝난 뒤에도 봐 드립니다</h3>
        <p class="sub">대회가 끝나고 버려지지 않게, 팀마다 봐 줄 사람을 미리 정해 뒀습니다.</p>
        <table><tr><th>팀</th><th>봐 줄 사람</th><th>언제까지</th></tr>
        ${sup.rows.map(r => `<tr><td>${esc(r.team_name)}</td>
          <td>${esc(r.helper_name)}${r.org ? ' · ' + esc(r.org) : ''}</td>
          <td>${r.done ? '<span class="pill ok">완료</span>' : esc(r.due)}</td></tr>`).join('')}</table>` : ''}

      ${(() => {
        /* 마감 전에는 무엇을 만들고 있는지만 보이고 링크는 안 보인다.
           서버가 아예 안 내려보낸다 - 화면에서만 감추면 소용이 없다. */
        const made = d.rows.filter(r => r.done || r.hidden || r.note);
        if (!made.length) return '';
        return `<h3 style="margin-top:16px">${d.closed ? '제출작' : '무엇을 만들고 있나'}</h3>
          ${d.closed ? '' : `<p class="sub">링크는 <b>마감 뒤</b>에 한꺼번에 열립니다.
            먼저 낸 팀이 손해를 보지 않게 하기 위해서입니다.</p>`}
          ${made.map(r => `<div class="card"><h3>${esc(r.name)}</h3>
            ${r.note ? `<div class="meta">${esc(r.note)}</div>` : ''}
            ${r.url ? `<div class="share">${esc(r.url)}</div>` : ''}</div>`).join('')}`;
      })()}

      ${(cw.solo.length || cw.looking.length) ? `<div class="card">
        <h3>같이 할 사람 찾기</h3>
        <div class="meta">연락처는 공개하지 않습니다.
          <b>당일 팀 짜는 시간에 이 목록을 보고 얼굴 보며 정합니다.</b>
          혼자 오셔도 팀이 생깁니다.</div>
        ${cw.solo.length ? `<div style="margin-top:12px">
          <b style="font-size:13px">혼자 오시는 분 ${cw.solo.length}명</b>
          <table>${cw.solo.map(r => `<tr>
            <td style="width:7em">${esc(r.name)}</td>
            <td>${r.role ? `<span class="pill">${esc(r.role)}</span> ` : ''}${esc(r.note || '')}</td>
          </tr>`).join('')}</table></div>` : ''}
        ${cw.looking.length ? `<div style="margin-top:12px">
          <b style="font-size:13px">자리가 남은 팀 ${cw.looking.length}팀</b>
          ${cw.looking.map(r => `<div class="card" style="margin-top:9px">
            <h3>${esc(r.name)} <span class="pill ${r.free ? 'ok' : ''}">${
              r.free ? r.free + '자리 남음' : '다 참'}</span></h3>
            ${r.want ? `<div class="meta">${esc(r.want)}</div>` : ''}
            ${r.note ? `<div class="meta">${esc(r.note)}</div>` : ''}
            <div class="seats">
              ${(r.mem || []).map(m => `<span class="seat${m.g ? ' g' : ''}">${esc(m.n)}${
                m.g ? ' · 밖에서' : ''}</span>`).join('')}
              ${Array(r.free).fill(0).map(() =>
                '<span class="seat free">＋ 빈자리</span>').join('')}
            </div>
          </div>`).join('')}</div>` : ''}
      </div>` : ''}

      ${(e.plan || []).length ? `<div class="card"><h3>진행 순서</h3>
        <table>${e.plan.map(r => `<tr class="${
          /제출 마감|코드 프리즈/.test(r.what) ? 'row-hot'
          : /^발표|시상|등록/.test(r.what) ? 'row-key' : ''}">
          <td style="width:5.5em">${esc(r.at)}</td>
          <td>${esc(r.what)}</td></tr>`).join('')}</table></div>` : ''}

      ${(hrep && hrep.n) ? `<div class="card">
        <h3>참가하신 분들이 남긴 평가</h3>
        <div class="meta">${repLine('운영이 매끄러웠나', hrep.run)}<br>
          ${repLine('배울 게 있었나', hrep.worth)}</div>
        ${hrep.notes.length ? `<div class="meta" style="margin-top:8px">
          ${hrep.notes.map(x => '“' + esc(x) + '”').join('<br>')}</div>` : ''}
      </div>` : ''}

      ${d.closed ? `<div class="card">
        <h3>이 대회 어떠셨나요</h3>
        <div class="meta">참가하신 분만 남길 수 있습니다. <b>안 하셔도 됩니다.</b>
          다음 참가자가 이 주최자를 고를 때 씁니다.</div>
        <label>참가할 때 쓴 연락처</label>
        <input id="rv-c" value="${esc(myContact())}" placeholder="본인 확인용. 저장하지 않습니다">
        <label>운영이 매끄러웠나요</label>${stars('run', 0)}
        <label>배울 게 있었나요</label>${stars('worth', 0)}
        <label>한 줄 (선택)</label>
        <input id="rv-n" placeholder="다음 참가자에게 도움이 될 한 줄">
        <div style="height:10px"></div>
        <button class="btn sm" id="rv-go">남기기</button>
      </div>` : ''}

      ${rec && rec.events ? `<div class="card" style="border-color:#AECFB8;background:var(--ok-l)">
        <h3>이 주최자가 지난번에</h3>
        <div class="meta">지난 대회 ${rec.events}개 · 참가 ${rec.teams}팀 ·
          완주율 <b>${rec.finishRate}%</b>${rec.promised
            ? ` · 끝나고 한 약속 ${rec.promised}건 중 <b>${rec.keptRate}%</b>를 지켰습니다` : ''}
        </div>
        <div class="meta" style="margin-top:6px">
          해커톤은 시상식에서 끝나지 않습니다. 이 숫자가 그 증거입니다.</div>
      </div>` : ''}

      ${whoBox()}
      ${rulesBox()}

      ${statusOf(e).k !== '끝남'
        ? (mine
            ? moreForm(mine)
            : `<div class="card"><h3>참가 신청</h3>
                 <div class="meta">이 페이지에서 바로 신청합니다. 이름만 있으면 됩니다.</div>
                 ${applyForm()}</div>`)
        : ''}

      <p class="sub" style="margin-top:14px">심사 기준 ·
        ${e.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}</p>`;
  },

  /* 행사장 큰 화면 — /tv/<대회id>. 노트북을 HDMI 로 꽂아 두는 용도다.
     참가자가 제일 자주 묻는 것 세 개(언제까지·지금 뭐 하는 시간·주소)를 종일 띄워 둔다. */
  async tv() {
    const d = await api(`/events/${cur}/tv`);
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    /* 지금 지난 것 중 마지막이 '지금', 그다음이 '다음'. 시각만 비교하면 된다. */
    const plan = d.plan || [];
    let at = -1;
    plan.forEach((r, i) => { if (r.at <= hhmm) at = i; });
    const cur1 = plan[at], nxt = plan[at + 1];

    return `<div class="tvwrap">
      <div class="tvtop">
        <div class="tvtitle">${esc(d.title)}</div>
        <div class="tvhost">${esc(d.host)}</div>
      </div>

      ${(cur1 && /팀 짜기|팀짜기/.test(cur1.what) && (d.crew.solo.length || d.crew.looking.length))
        ? `<div class="tvmid"><div class="tvnow" style="flex:1;overflow:hidden">
             <div class="tvlabel">같이 할 사람</div>
             <div style="display:flex;gap:2vw;margin-top:1vh">
               <div style="flex:1">
                 <div class="tvsub" style="color:#9DAB92">혼자 오신 분</div>
                 ${d.crew.solo.slice(0, 8).map(r => `<div class="tvsub">
                   <em>${esc(r.name)}</em> ${esc(r.role || '')}</div>`).join('')}
               </div>
               <div style="flex:1">
                 <div class="tvsub" style="color:#9DAB92">사람 찾는 팀</div>
                 ${d.crew.looking.slice(0, 8).map(r => `<div class="tvsub">
                   <em>${esc(r.name)}</em> ${r.size}명 · ${esc(r.want)}</div>`).join('')}
               </div>
             </div>
           </div></div>`
        : ''}

      <div class="tvmid">
        <div class="tvbig">
          ${d.due
            ? `<div class="tvlabel">제출 마감까지</div>
               <div class="tvclock" data-due="${esc(d.due)}"></div>`
            : `<div class="tvlabel">오늘</div>
               <div class="tvclock" style="font-size:9vh">${esc(d.starts)}</div>`}
          <div class="tvsub" style="margin-top:2.4vh">
            제출 <em>${d.done}</em> / ${d.teams}팀
            ${d.waiting.length && d.waiting.length <= 6
              ? `<br><span style="font-size:2.1vh;color:#9DAB92">아직 —
                 ${d.waiting.map(esc).join(' · ')}</span>` : ''}
          </div>
        </div>

        <div class="tvside">
          <div class="tvnow">
            <div class="tvlabel">지금</div>
            <b>${cur1 ? esc(cur1.what) : '시작 전'}</b>
            ${nxt ? `<div class="tvnext">다음 · ${esc(nxt.at)} ${esc(nxt.what)}</div>` : ''}
          </div>
          ${d.ranks.length ? `<div class="tvnow" style="flex:1">
            <div class="tvlabel">순위</div>
            ${d.ranks.map(r => `<div class="tvsub" style="display:flex;gap:1vw">
              <em style="width:2ch">${r.rank}</em>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
              <em>${r.score}</em></div>`).join('')}
          </div>` : ''}
        </div>
      </div>

      ${d.notice ? `<div class="tvnotice">${esc(d.notice)}</div>` : ''}
      ${d.wifi ? `<div class="tvwifi"><span>와이파이</span>${esc(d.wifi)}</div>` : ''}

      <div class="tvbot">
        ${qrTag(`${shareBase()}/e/${cur}`, 'big')}
        <div class="tvaddr">${esc(shareBase().replace(/^https?:\/\//, ''))}/e/${esc(cur)}
          <span>휴대폰으로 QR 을 찍으세요 · 여기서 신청하고 제출합니다</span></div>
        <div class="tvrank">
          <div><b>${d.teams}</b><span>참가 팀</span></div>
          <div><b>${d.done}</b><span>제출</span></div>
        </div>
      </div>
      ${(d.sponsors || []).length ? `<div class="tvbot" style="padding-top:1.6vh">
        <span style="font-size:1.6vh;color:#8B9A80;flex:none">함께한 곳</span>
        ${logoBand(d.sponsors, true)}
      </div>` : ''}
    </div>`;
  },

  /* 심사위원 화면 — /j/<대회id> 로 연다. 점수만 넣는다.
     남의 점수와 순위는 서버가 아예 안 준다. 심사 중에 순위를 보면 점수가 끌려간다. */
  async judge() {
    const who = localStorage.getItem('hackon.judge') || '';
    if (!who) {
      const e = await api(`/events/${cur}/judge`);
      return `<h2>${esc(e.event.title)}</h2>
        <p class="sub">심사위원 화면입니다. 이름을 넣으면 시작합니다.<br>
          같은 이름으로 다시 들어오면 넣던 점수를 이어서 고칠 수 있습니다.</p>
        <label>심사위원 이름</label><input id="jn" placeholder="이름">
        <div style="height:10px"></div>
        <button class="btn" id="jn-go">시작</button>`;
    }
    const d = await api(`/events/${cur}/judge?judge=${encodeURIComponent(who)}`);
    const done = d.teams.length - d.left;
    const head = `<p class="sub">${esc(who)} 님 · ${done}/${d.teams.length}팀 봤습니다
      <button class="btn sec sm" id="jn-out" style="margin-left:6px">이름 바꾸기</button></p>
      <div class="jbar"><div class="grow"><i style="width:${
        d.teams.length ? Math.round(done / d.teams.length * 100) : 0}%"></i></div>
        <button class="btn sec sm" id="j-all">${jAll ? '심사로 돌아가기' : '전체 비교'}</button></div>`;

    /* 전체 비교 - 앞 팀에 90점을 줬는데 뒤에 더 잘한 팀이 나오면 앞을 고쳐야 한다.
       그 길이 없으면 심사위원은 처음부터 점수를 짜게 준다. */
    if (jAll) {
      const my = d.teams.map(t => ({
        t, sum: d.event.rubric.reduce(
          (a, r) => a + (t.mine[r.key] ?? 0) * r.weight / 100, 0),
      })).sort((a, b) => b.sum - a.sum);
      return `<h2>${esc(d.event.title)}</h2>${head}
        <p class="sub">제가 준 점수만 보입니다. 다른 분 점수와 최종 순위는 안 보입니다.<br>
          팀을 누르면 그 팀으로 가서 고칠 수 있습니다.</p>
        <table><tr><th>팀</th><th class="n">내 점수</th></tr>
        ${my.map(x => `<tr data-jgo="${x.t.id}" style="cursor:pointer">
          <td>${esc(x.t.name)}${x.t.doneByMe ? '' : ' <span class="pill warn">아직</span>'}</td>
          <td class="n">${x.t.doneByMe ? Math.round(x.sum * 10) / 10 : '—'}</td></tr>`).join('')}
        </table>`;
    }

    /* 지금 볼 팀. 정해 둔 게 없으면 아직 안 본 팀부터, 다 봤으면 첫 팀으로. */
    let t = d.teams.find(x => String(x.id) === String(jTeam));
    if (!t) t = d.teams.find(x => !x.doneByMe) || d.teams[0];
    if (!t) return `<h2>${esc(d.event.title)}</h2>${head}
      <p class="sub">아직 참가 팀이 없습니다.</p>`;
    jTeam = t.id;
    const at = d.teams.findIndex(x => x.id === t.id);

    return `<h2>${esc(t.name)}</h2>${head}
      ${dueBox(d.event)}
      <div class="card">
        ${t.note ? `<div class="meta" style="font-size:14px">${esc(t.note)}</div>` : ''}
        ${t.url ? `<div class="shrow" style="margin-top:8px">
            <div class="share">${esc(t.url)}</div>
            <a class="btn sec sm" href="${esc(/^https?:\/\//i.test(t.url) ? t.url : '#')}"
               target="_blank" rel="noopener noreferrer">열기</a>
          </div>`
          : '<div class="meta">아직 제출하지 않았습니다.</div>'}
        ${(t.aiuse || t.aidrop) ? `<div class="meta" style="margin-top:9px">
          ${t.aiuse ? `<b>AI 를 쓴 곳</b> ${esc(t.aiuse)}<br>` : ''}
          ${t.aidrop ? `<b>버린 판단</b> ${esc(t.aidrop)}` : ''}
        </div>` : ''}
      </div>

      <div class="card">
        ${d.event.rubric.map(r => { const v = t.mine[r.key] ?? 70; return `
          <label>${esc(r.label)} <span class="pill">${r.weight}%</span></label>
          <div class="sl">
            <input type="range" min="0" max="100" step="5" value="${v}"
                   style="--p:${v}%" class="jv-${esc(t.id)}" data-key="${esc(r.key)}">
            <b>${v}</b>
          </div>`; }).join('')}
      </div>

      <div class="card">
        <label>좋았던 점 <span class="pill ok">참가팀에게 전달됩니다</span></label>
        <div class="tags">${GOOD_TAGS.map(x =>
          `<button data-tag="jg-${esc(t.id)}" data-txt="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <textarea class="jg-${esc(t.id)}" rows="2"
          placeholder="위에서 누르거나 직접 쓰세요">${esc(t.review.good)}</textarea>
        <label>더 하면 좋을 것</label>
        <div class="tags">${NEXT_TAGS.map(x =>
          `<button data-tag="jn2-${esc(t.id)}" data-txt="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <textarea class="jn2-${esc(t.id)}" rows="2"
          placeholder="위에서 누르거나 직접 쓰세요">${esc(t.review.next)}</textarea>
        <div class="meta">참가자가 가장 아쉬워하는 것이 “왜 떨어졌는지 모른다” 입니다.
          이름 없이 전달됩니다.</div>
      </div>

      <div class="shrow">
        <button class="btn sec sm" id="j-skip">건너뛰기</button>
        <button class="btn" id="j-next" data-jsave="${esc(t.id)}" style="flex:1">
          ${t.doneByMe ? '고치고 다음 팀' : '저장하고 다음 팀'}</button>
      </div>
      <p class="sub" style="margin-top:8px">${at + 1}번째 · 심사 기준
        ${d.event.rubric.map(r => esc(r.label) + ' ' + r.weight).join(' · ')}</p>`;
  },

  /* 프로필 - 누구나 열 수 있다. 연락처는 서버가 애초에 안 내려보낸다. */
  async prof() {
    const d = await api(`/people/${curPerson}`);
    const mine = myContact();
    return `<h2>${esc(d.handle || '이름 없음')}</h2>
      <p class="sub">${d.level ? esc(d.level) + ' · ' : ''}${
        d.placed ? `대회 ${d.events}번` : `대회 ${d.events}번 · 아직 배치 중`}</p>

      <div class="stat">
        <div><b>${d.finished}</b><span>완주</span></div>
        <div><b>${d.events ? d.finishRate + '%' : '—'}</b><span>완주율</span></div>
        <div><b>${d.noshow}</b><span>안 온 횟수</span></div>
      </div>
      <p class="sub">완주율은 <b>온 대회</b> 기준입니다.
        신청하고 안 온 것은 실력이 아니라 매너로 따로 셉니다.</p>

      <div class="card">
        <h3>다른 참가자가 준 평가</h3>
        <div class="meta">${repLine('실력', d.skill)}<br>${repLine('매너', d.manner)}</div>
        <div class="meta" style="margin-top:7px">누가 줬는지는 아무에게도 안 보입니다.
          같은 대회에 있던 분만 남길 수 있습니다.</div>
      </div>

      ${d.history.length ? `<h3 style="margin-top:16px">나온 대회</h3>
        <table><tr><th>대회</th><th>팀</th><th>결과</th></tr>
        ${d.history.map(h => `<tr><td>${esc(h.title)}<br>
            <span class="meta">${esc(h.ends)}</span></td>
          <td>${esc(h.team)}${h.role ? `<br><span class="meta">${esc(h.role)}</span>` : ''}</td>
          <td>${h.made ? '<span class="pill ok">완주</span>'
               : h.came ? '<span class="pill warn">미완</span>'
                        : '<span class="pill">안 옴</span>'}</td></tr>`).join('')}</table>` : ''}

      <div class="card">
        <h3>제 프로필인가요</h3>
        <div class="meta">참가할 때 쓴 연락처를 넣으면 이름과 실력을 고칠 수 있습니다.</div>
        <label>연락처</label><input id="pf-c" value="${esc(mine)}" placeholder="참가할 때 쓴 것">
        <div class="row">
          <div><label>보여 줄 이름</label><input id="pf-h" value="${esc(d.handle)}"></div>
          <div><label>실력</label><select id="pf-l">
            <option value="">안 고름</option>
            ${LEVELS.map(l => `<option${d.level === l ? ' selected' : ''}>${l}</option>`).join('')}
          </select></div>
        </div>
        <div style="height:10px"></div>
        <button class="btn sm" id="pf-save">고치기</button>
      </div>`;
  },

  /* 결과 보고서 — 협찬사에게 보내는 물건. 인쇄하면 그대로 PDF 가 된다.
     빈칸이 생기지 않게 앞의 세 기능(마감·신청·사후지원)을 먼저 만들었다. */
  async report() {
    const d = await api(`/events/${cur}/board`);
    const o = await api(`/events/${cur}/outcomes`);
    const sup = LIVE ? await api(`/events/${cur}/support`) : { rows:[] };
    const pk = await api(`/events/${cur}/pack`).catch(() => null);
    const fw = await api(`/events/${cur}/follow`).catch(() => null);
    /* 절 번호를 손으로 적으면 조건부로 빠지는 절 때문에 반드시 어긋난다. 세면서 붙인다. */
    const KR = ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
    let sec = 0;
    const S = () => KR[sec++] || String(sec);
    /* 심사 눈높이는 운영자 것이라 손님에게는 403 이 온다. 보고서는 나눠 주는 물건이라
       없는 부분은 빼고 그린다. 여기서 안 잡으면 보고서 전체가 안 뜬다. */
    let sp = { rows: [], gap: 0 };
    try { sp = await api(`/events/${cur}/spread`); } catch {}
    const e = d.event;
    const done = d.rows.filter(r => r.done);
    const money = e.sponsors.reduce((a, s) => a + (+s.amount || 0), 0);
    return `<div class="noprint" style="margin-bottom:14px">
        <button class="btn sm" id="b-print">인쇄 · PDF 로 저장</button>
        <div class="meta" style="margin-top:6px">이 주소를 그대로 보내셔도 됩니다.</div>
      </div>

      <h2>${esc(e.title)} 결과 보고서</h2>
      <p class="sub">${esc(e.host)} 주최 · ${esc(e.starts)}~${esc(e.ends)}
        ${e.topic ? '· 주제 ' + esc(e.topic) : ''}</p>

      ${(pk && pk.top && pk.top.length) ? `<h3>${S()}. 이런 것이 나왔습니다</h3>
        <p class="sub">숫자보다 이게 먼저입니다. 완주한 팀 중 위에서 셋입니다.</p>
        ${pk.top.map(t => `<div class="card">
          <h3>${t.rank}위 · ${esc(t.name)}
            ${t.reachable ? '<span class="pill ok">연락 받겠다고 했습니다</span>' : ''}</h3>
          ${t.note ? `<div class="meta" style="font-size:14px">${esc(t.note)}</div>` : ''}
          ${t.url ? `<div class="share">${esc(t.url)}</div>` : ''}
          ${t.aidrop ? `<div class="meta" style="margin-top:7px">
            <b>AI 가 준 것 중 버린 판단</b> ${esc(t.aidrop)}</div>` : ''}
        </div>`).join('')}
        ${pk.top.some(t => t.reachable) ? `<p class="sub">
          <b>연락 받겠다고 한 팀이 있습니다.</b> 주최자에게 말씀하시면 연결해 드립니다.
          참가자가 미리 동의한 경우에만 연결합니다.</p>` : ''}` : ''}

      <h3>${S()}. 무엇을 했나</h3>
      <div class="stat">
        <div><b>${e.teams}</b><span>신청</span></div>
        <div><b>${o.came ?? 0}</b><span>온 팀</span></div>
        <div><b>${o.finishRate}%</b><span>완주율</span></div>
      </div>
      ${o.solo ? `<p class="sub">혼자 오신 분 ${o.solo}명은 현장에서 팀을 짰습니다.</p>` : ''}

      ${(o.found || []).length ? `<h3>${S()}. 어디서 왔나</h3>
        <table><tr><th>경로</th><th class="n">신청</th></tr>
        ${o.found.map(f => `<tr><td>${esc(f.k)}</td><td class="n">${f.c}팀</td></tr>`).join('')}</table>
        <p class="sub">다음 회차 홍보는 위쪽 경로에 집중합니다.</p>` : ''}

      <h3>${S()}. 약속드린 것과 실제로 한 것</h3>
      ${(pk && pk.sponsors.length)
        ? `${pk.sponsors.map(sp => `<div class="card">
             <h3>${esc(sp.name)} <span class="pill">${esc(sp.kind)}</span>
               <span class="pill ${sp.kept === sp.total ? 'ok' : 'warn'}">${sp.kept}/${sp.total}</span>
               ${sp.amount ? `<span class="pill">${won(sp.amount)}</span>` : ''}</h3>
             <table><tr><th>약속</th><th style="width:5em">했나</th></tr>
             ${sp.promises.map(pr => `<tr>
               <td${pr.done ? '' : ' style="color:var(--warn)"'}>${esc(pr.text)}</td>
               <td>${pr.done ? '<span class="pill ok">함</span>'
                             : '<span class="pill warn">못 함</span>'}</td></tr>`).join('')}</table>
             ${sp.proof ? `<div class="meta" style="margin-top:8px"><b>증빙</b>
               <span class="share">${esc(sp.proof)}</span></div>` : ''}
           </div>`).join('')}
           ${money ? `<p class="sub">합계 ${won(money)} 상당.</p>` : ''}
           ${logoBand(e.sponsors)}`
        : e.sponsors.length
          ? `<table><tr><th>회사</th><th>무엇을</th><th class="n">규모</th></tr>
             ${e.sponsors.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.kind)}</td>
               <td class="n">${s.amount ? won(s.amount) : '—'}</td></tr>`).join('')}</table>
             ${logoBand(e.sponsors)}`
          : '<p class="sub">이번 회차는 협찬 없이 진행했습니다.</p>'}

      <h3>${S()}. 돌려드리는 숫자</h3>
      <p class="sub">‘몇 명이 봤다’를 쓰지 않습니다. 아래로 정산합니다.</p>
      <table>
        <tr><th>항목</th><th class="n">건수</th></tr>
        <tr><td>완주 (끝까지 결과물을 낸 팀)</td><td class="n">${o.finished}/${o.teams}</td></tr>
        <tr><td>면접 연결 ${how('hand')}</td><td class="n">${o.interview}</td></tr>
        <tr><td>도입 검토 ${how('hand')}</td><td class="n">${o.adoption}</td></tr>
        <tr><td>채용 ${how('hand')}</td><td class="n">${o.hired}</td></tr>
        ${fw && fw.asked12 ? `<tr><td><b>90일 뒤에도 이어가는 팀</b></td>
            <td class="n">${fw.alive12}/${fw.asked12}</td></tr>
          <tr><td>낸 결과물이 아직 열리는 팀</td><td class="n">${fw.liveNow}</td></tr>` : ''}
      </table>
      <p class="sub">표시 없는 숫자는 앱이 직접 센 것입니다.
        ${how('hand')} 는 주최자가 확인해 넣은 것입니다. 노출 수는 쓰지 않습니다.</p>

      ${(pk && pk.mix.role.length) ? `<h3>${S()}. 어떤 분들이 왔나</h3>
        <p class="sub">이름과 연락처는 담지 않습니다.
          ${pk.minCell}건 미만인 항목은 뭉쳐서 씁니다 — 작은 행사에서는 ‘1팀’이 곧 한 사람입니다.</p>
        <table><tr><th>맡은 일</th><th class="n">팀</th></tr>
        ${pk.mix.role.map(r => `<tr><td>${esc(r.k)}</td><td class="n">${r.c}</td></tr>`).join('')}
        </table>` : ''}

      ${fw && fw.asked12 ? `<h3>${S()}. 90일 뒤에 다시 물어봤습니다</h3>
        <p class="sub">해커톤 결과물은 대개 시상식에서 끝납니다.
          한 연구에서는 해커톤 코드의 <b>3분의 1만</b> 다시 쓰였습니다.
          그래서 끝나고 2주 · 6주 · 12주에 세 번 물어봤습니다.</p>
        <div class="stat">
          <div><b>${fw.aliveRate}%</b><span>90일 생존</span></div>
          <div><b>${fw.liveNow}</b><span>링크 살아있음</span></div>
        </div>

          <label>언제까지 (비우면 대회 끝나고 14일)</label>
          <input id="a-due" type="date">
          <div style="height:8px"></div>
          <button class="btn sm" id="a-add">짝지어 주기</button>` : ''}
      </div></details>` : ''}

<details open><summary>성과 기록하기</summary><div class="in">
        <div class="meta">행사 뒤 2주 동안 여기에 쌓습니다. 이게 다음 해 제안서의 근거가 됩니다.</div>
        <label>무엇</label>
        <select id="o-kind"><option>면접</option><option>도입검토</option><option>채용</option><option>후속미팅</option></select>

        <div style="height:10px"></div>
        <button class="btn sm" id="o-add">기록 추가</button>
      </div></details>`;
  },
};

function wire() {
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    cur = el.dataset.open; localStorage.setItem('hackon.event', cur); tab = 'board'; render();
  });
  /* div 로 만든 카드는 키보드로 못 닿는다. 탭으로 다니는 사람은 자기 대회를 영영 못 연다. */
  document.querySelectorAll('[data-open]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
  const go = $('[data-go]'); if (go) go.onclick = () => { tab = go.dataset.go; render(); };
  const bpub = $('#b-pub'); if (bpub) bpub.onclick = () => { tab = 'pub'; render(); };

  document.querySelectorAll('[data-pledge-open]').forEach(b => b.onclick = () => {
    const box = document.getElementById('pledge-' + b.dataset.pledgeOpen);
    if (box) box.hidden = !box.hidden;
  });
  document.querySelectorAll('[data-pledge-send]').forEach(b => b.onclick = async () => {
    const id = b.dataset.pledgeSend;
    const val = key => { const el = document.querySelector(`[data-p-${key}="${id}"]`); return el ? el.value.trim() : ''; };
    const name = val('name'), contact = val('contact');
    if (!name) return flash('이름을 넣어 주세요', true);
    if (!contact) return flash('운영자가 연락할 연락처를 넣어 주세요', true);
    try {
      if (LIVE) await api(`/needs/${id}/pledge`, { method:'POST', body:{ name, org:val('org'), contact, note:val('note') } });
      else {
        const n = DEMO.needs.find(x => x.id === id);
        if (n) n.pledges.push({ id:'dp' + Date.now(), name, org:val('org'), status:'pending' });
      }
      flash('맡겠다는 뜻을 보냈습니다. 운영자가 확인하면 공개 장부에 이름이 뜹니다');
    } catch (e) { flash(e.message, true); }
  });

  const nadd = $('#n-add');
  if (nadd) nadd.onclick = async () => {
    const label = $('#n-label').value.trim(), qty = Math.max(1, +$('#n-qty').value || 1);
    if (!label) return flash('어떤 자리가 필요한지 적어 주세요', true);
    try {
      if (LIVE) await api(`/events/${cur}/needs`, { method:'POST', body:{ kind:$('#n-kind').value, label, qty, note:$('#n-note').value.trim() } });
      else DEMO.needs.push({ id:'dn' + Date.now(), kind:$('#n-kind').value, label, qty, filled:0, note:$('#n-note').value.trim(), pledges:[] });
      flash('필요한 자리를 올렸습니다');
    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-pledge-status]').forEach(b => b.onclick = async () => {
    const id = b.dataset.pledgeStatus, status = b.dataset.status;
    try {
      if (LIVE) await api(`/pledges/${id}/status`, { method:'POST', body:{ status } });
      else {
        for (const n of DEMO.needs) {
          const p = (n.pledges || []).find(x => x.id === id);
          if (!p) continue;
          p.status = status;
          n.filled = (n.pledges || []).filter(x => x.status === 'ok' || x.status === 'done').length;
          if (status === 'ok') DEMO.ledger.push({ kind:n.kind, label:n.label, name:p.name, org:p.org, status:'ok', at:ymd() });
        }
      }
      flash(status === 'ok' ? '확인했습니다. 공개 장부에 반영됩니다' : '거절했습니다');
    } catch (e) { flash(e.message, true); }
  });

  const fusave = $('#fu-save');
  if (fusave) fusave.onclick = async () => {
    const tool = $('#fu-tool').value.trim();
    if (!tool) return flash('도구를 골라 주세요', true);
    try {
      if (LIVE) await api(`/events/${cur}/followup`, { method:'POST', tkey:tkeyOf(curTeam), body:{ tool, still_using:+$('#fu-still').value, note:$('#fu-note').value.trim() } });
      flash('응답을 보냈습니다');

  const msave = $('#m-save');

    const g = sel => { const el = $(sel); return el ? el.value : undefined; };
    try {
      /* 연락처 칸은 한 번 채우면 사라진다. 그래서 두 번째부터는 이 브라우저가 기억해 둔 것을 보낸다 -
         동의를 껐다 켰다 하려면 서버에 '나가 그 팀 사람'이라는 증거가 매번 있어야 한다.
         이미 적힌 연락처는 서버가 덮어쓰지 않으므로 같이 보내도 안전하다. */
      const r = await api(`/teams/${id}/more`, { method: 'POST', tkey: tkeyOf(id), body: {
        contact: g('#m-contact') || myContact() || undefined,
        role: g('#m-role'), found: g('#m-found'), note: g('#m-note'),

      const mc = $('#m-contact');

  const esave = $('#e-save');

    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-reveal]').forEach(el => {

  });

  const owgo = $('#ow-go');
  if (owgo) owgo.onclick = async () => {
    const v = $('#ow-in').value.trim();
    if (!v) return flash('열쇠를 넣어 주세요', true);
    localStorage.setItem('hackon.owner', v);
    try {

      flash(`대회 ${r.events.length}개를 찾았습니다`); render();
    } catch (e) { localStorage.removeItem('hackon.owner'); flash('열쇠가 맞지 않습니다', true); }

  const okgo = $('#ok-go');
  if (okgo) okgo.onclick = async () => {
    const v = $('#ok-in').value.trim();
    if (!v) return flash('열쇠를 넣어 주세요', true);

    try {
      const e = await api(`/events/${cur}`);
      if (!e.admin) { localStorage.removeItem('hackon.okey.' + cur);
                      return flash('열쇠가 맞지 않습니다', true); }
      flash('열었습니다'); render();
    } catch (e) { flash(e.message, true); }
  };

  const save = $('#f-save');
  if (save) save.onclick = async () => {
    const b = { title: $('#f-title').value.trim() };   // 처음엔 이름만 받는다
    /* 유형과 심사 기준은 고르는 것이라 손이 안 간다. 그래서 첫 화면에 같이 둔다. */
    if (!b.title) return flash('대회 이름을 넣어 주세요', true);

      const r = await api('/events', { method: 'POST', body: b });

      localStorage.setItem('hackon.event', cur);
      localStorage.setItem('hackon.okey.' + r.id, r.okey);   // 대회 열쇠
      if (r.owner) localStorage.setItem('hackon.owner', r.owner);   // 주최자 열쇠
      /* 빈 관리 화면을 마주하게 두지 않는다. 고른 유형에 맞는 진행표를 깔아 준다.

        const dr = await api(`/draft?start=10:00&end=19:30&teams=6&kind=${encodeURIComponent(kind)}`);
        await api(`/events/${cur}`, { method: 'PATCH', body: { plan: dr.rows } });

  const fkind = $('#f-kind');

  const join = $('#t-join');

    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      const r = await api(`/events/${cur}/teams`, { method: 'POST', body: {
        name,
        agree: true } });
      localStorage.setItem('hackon.team.' + cur, r.id);   // 두 번째 칸을 보여 주려고 기억한다
      /* 팀 열쇠. 이 브라우저가 그 팀 사람이라는 증거다 - 서버가 여기서 한 번만 준다.
         대회 열쇠(hackon.okey.*)와 같은 방식이다. */
      if (r.tkey) localStorage.setItem('hackon.tkey.' + r.id, r.tkey);
      flash('신청됐습니다. 조금만 더 여쭙겠습니다');
    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-team]').forEach(tr => tr.onclick = () => {
    if (!tr.dataset.team) return flash('데모에서는 팀 화면을 못 엽니다', true);
    curTeam = tr.dataset.team; tab = 'team'; render();
  });

  const ssave = $('#s-save');
  if (ssave) ssave.onclick = async () => {
    if (!LIVE) return flash('데모에서는 저장되지 않습니다', true);
    try {
      await api(`/teams/${curTeam}/submit`, { method: 'POST',
        body: { url: $('#s-url').value.trim(), note: $('#s-note').value.trim(),
                aiuse: $('#s-aiuse').value.trim(), aidrop: $('#s-aidrop').value.trim() } });
      flash('제출했습니다');
    } catch (e) { flash(e.message, true); }
  };

  const jsave = $('#j-save');
  if (jsave) jsave.onclick = async () => {
    const judge = $('#j-name').value.trim();
    if (!judge) return flash('심사위원 이름을 넣어 주세요', true);

    document.querySelectorAll('.j-v').forEach(i => { values[i.dataset.key] = +i.value; });
    try {
      await api(`/teams/${curTeam}/score`, { method: 'POST', body: { judge, values } });
      localStorage.setItem('hackon.judge', judge);
      flash('점수를 저장했습니다');
    } catch (e) { flash(e.message, true); }
  };

  const hadd = $('#h-add');
  if (hadd) hadd.onclick = async () => {
    const name = $('#h-name').value.trim();
    if (!name) return flash('이름을 넣어 주세요', true);
    try {
      await api(`/events/${cur}/support`, { method: 'POST', body: {
        name, org: $('#h-org').value, can: $('#h-can').value } });
      flash('지원자를 넣었습니다');
    } catch (e) { flash(e.message, true); }
  };

  const aadd = $('#a-add');
  if (aadd) aadd.onclick = async () => {
    try {
      const r = await api(`/events/${cur}/assign`, { method: 'POST', body: {
        team: $('#a-team').value, helper: $('#a-help').value, due: $('#a-due').value } });
      flash(`${r.due} 까지 봐 주기로 했습니다`);
    } catch (e) { flash(e.message, true); }
  };

  document.querySelectorAll('[data-came]').forEach(b => b.onclick = async () => {
    try { const r = await api(`/teams/${b.dataset.came}/checkin`, { method: 'POST', body: {} });
          flash(r.came ? '체크인했습니다' : '체크인을 취소했습니다'); }
    catch (e) { flash(e.message, true); }
  });

  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    try { await api(`/assignments/${b.dataset.done}/done`, { method: 'POST', body: {} });
          flash('완료로 표시했습니다'); }
    catch (e) { flash(e.message, true); }
  });

  const jgo = $('#jn-go');
  if (jgo) jgo.onclick = () => {

  };
  const jout = $('#jn-out');
  if (jout) jout.onclick = () => { localStorage.removeItem('hackon.judge'); render(); };

  document.querySelectorAll('[data-jsave]').forEach(b => b.onclick = async () => {
    const id = b.dataset.jsave, values = {};

      await api(`/teams/${id}/score`, { method: 'POST',

      /* 저장하면 아직 안 본 팀으로 넘어간다. 심사위원이 '다음 누구지' 를 안 찾게 한다. */
      const d = await api(`/events/${cur}/judge?judge=${encodeURIComponent(

      jTeam = nx2 ? nx2.id : null;
      flash(nx2 ? `저장했습니다. 다음은 ${nx2.name}` : '전부 보셨습니다. 수고하셨습니다');
      if (!nx2) jAll = true;
    } catch (e) { flash(e.message, true); }
